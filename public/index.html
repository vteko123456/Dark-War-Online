<script>/* src/net/netclient.js */
// DARK WAR — Local Wi-Fi connection (browser side, Update 6).
// Talks to tools/server.js over a WebSocket on the same address the page was loaded from. The server only
// relays; the host phone runs the authoritative match (src/net/netcore.js).
var DW = (globalThis.DW = globalThis.DW || {});

// Is this page being served by the local Wi-Fi server? (the published/online copy and file:// cannot do LAN play)
DW.netProbe = async function () {
  if (typeof location === 'undefined' || !/^http:$/.test(location.protocol)) return { ok: false, why: location && location.protocol === 'https:' ? 'https' : 'file' };
  try {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 2500);
    const r = await fetch('/netinfo', { cache: 'no-store', signal: ctl.signal }); clearTimeout(t);
    const j = await r.json(); if (j.server !== 'dark-war') throw new Error('not ours');
    return { ok: true, info: j };
  } catch (e) { return { ok: false, why: 'noserver' }; }
};

DW.NetClient = class {
  // h: { status(text, level), room(msg), peer(msg), error(text), message(msg), closed() }
  constructor(h) {
    this.h = h; this.ws = null; this.role = null; this.code = ''; this.closing = false;
    this.connected = false; this.peerOn = false; this.rtt = 0; this.lostSince = 0; this.pingId = 0; this.pings = new Map();
    this.timer = setInterval(() => this.heartbeat(), 1000);
  }
  get label() { return 'Wi-Fi server'; }
  url() { return `ws://${location.host}/ws`; }
  hello() { this.raw({ t: this.role === 'host' ? 'host' : 'join', code: this.code }); }   // Update 14: overridden by DW.OnlineClient
  start(role, code) { this.role = role; this.code = (code || '').toUpperCase(); this.closing = false; this.open(); }
  open() {
    if (this.closing) return;
    let ws; try { ws = new WebSocket(this.url()); } catch (e) { this.h.error('Could not reach the game server.'); return; }
    this.ws = ws;
    this.h.status(this.connected ? 'Reconnecting…' : 'Connecting…', 'warn');
    ws.onopen = () => {
      this.connected = true; this.lostSince = 0;
      this.hello();
    };
    ws.onmessage = (e) => {
      let m; try { m = JSON.parse(e.data); } catch (err) { return; }
      if (m.t === 'room') { this.code = m.code; this.peerOn = !!m.peer; this.h.room(m); return; }
      if (m.t === 'peer') { this.peerOn = m.on; this.h.peer(m); return; }
      if (m.t === 'error') { this.h.error(m.error, m); this.closing = true; ws.close(); return; }
      if (m.t === 'closed') { this.peerOn = false; this.h.closed(m); return; }
      if (m.t === 'ping') { this.raw({ t: 'pong', id: m.id }); return; }
      if (m.t === 'pong') { const t0 = this.pings.get(m.id); if (t0) { this.rtt = performance.now() - t0; this.pings.delete(m.id); } this.lastPong = performance.now(); return; }
      this.h.message(m);
    };
    ws.onclose = () => {
      if (this.ws !== ws) return;
      this.ws = null; this.peerOn = this.peerOn && false;
      if (this.closing) return;
      if (!this.lostSince) this.lostSince = performance.now();
      this.h.status(`Connection to the ${this.label} lost — reconnecting…`, 'bad');
      setTimeout(() => this.open(), 1000);     // keep trying until the player leaves
    };
    ws.onerror = () => {};
  }
  raw(o) { if (this.ws && this.ws.readyState === 1) this.ws.send(JSON.stringify(o)); }
  send(o) { this.raw(o); }
  heartbeat() {
    if (!this.ws || this.ws.readyState !== 1 || !this.peerOn) return;
    const id = ++this.pingId; this.pings.set(id, performance.now()); this.raw({ t: 'ping', id });
    for (const [k, t] of this.pings) if (performance.now() - t > 5000) this.pings.delete(k);
  }
  // 'good' | 'ok' | 'bad' | 'down' for the connection indicator
  quality() {
    if (!this.ws || this.ws.readyState !== 1) return 'down';
    if (!this.peerOn) return 'down';
    if (this.lastPong && performance.now() - this.lastPong > 2500) return 'bad';
    return this.rtt < 60 ? 'good' : this.rtt < 140 ? 'ok' : 'bad';
  }
  close() { this.closing = true; this.raw({ t: 'leave' }); clearInterval(this.timer); if (this.ws) this.ws.close(); this.ws = null; }
};

</script>
<script>/* src/net/online.js */
// DARK WAR — ONLINE multiplayer through an invite link (Update 14), browser side.
// Same host-authoritative netcode as LOCAL WI-FI (src/net/netcore.js: DW.NetHost / DW.NetGuest), but the relay is
// the internet-facing online/server.js instead of the home-network tools/server.js. Players connect OUT to it
// over HTTPS/WSS, so it works across different networks, mobile data, NAT and firewalls (no peer-to-peer link).
var DW = (globalThis.DW = globalThis.DW || {});

// Where the online server lives. Default: the same address the game page was opened from (the server serves
// the game itself, so an invite link is simply https://<server>/?room=<id>). A build can pin another server with
//   ONLINE_SERVER=https://my-dark-war.example.com node tools/build.js
// (that only works where the page's host allows connections to it; the published preview page does not).
DW.ONLINE = Object.assign({ server: '' }, DW.ONLINE || {});

DW.onlineBase = function () {
  if (DW.ONLINE.server) return DW.ONLINE.server.replace(/\/+$/, '');
  if (typeof location === 'undefined' || !/^https?:$/.test(location.protocol)) return '';
  return location.origin;
};
// Is an online server reachable from this page? → { ok, base } or { ok:false, why: 'file' | 'noserver' }
DW.onlineProbe = async function () {
  const base = DW.onlineBase(); if (!base) return { ok: false, why: 'file' };
  try {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 4000);
    const r = await fetch(base + '/health', { cache: 'no-store', signal: ctl.signal }); clearTimeout(t);
    const j = await r.json(); if (j.server !== 'dark-war-online') throw new Error('not ours');
    return { ok: true, base };
  } catch (e) { return { ok: false, why: 'noserver', base }; }
};
DW.onlineRoomStatus = async function (id) {
  try { const r = await fetch(DW.onlineBase() + '/api/room?id=' + encodeURIComponent(id), { cache: 'no-store' }); return (await r.json()).status; }
  catch (e) { return 'unreachable'; }
};
DW.onlineInviteURL = (id) => DW.onlineBase() + '/?room=' + encodeURIComponent(id);
// The room id in the address bar (an invite link, or our own room after a refresh)
DW.onlineRoomFromURL = function () {
  if (typeof location === 'undefined') return '';
  try { const id = new URLSearchParams(location.search).get('room') || ''; return /^[A-Za-z0-9]{12}$/.test(id) ? id : ''; } catch (e) { return ''; }
};
DW.onlineSetURL = function (id) {   // keep ?room=<id> in the address bar so a refresh rejoins the same room
  try { const u = new URL(location.href); if (id) u.searchParams.set('room', id); else u.searchParams.delete('room'); history.replaceState(null, '', u.toString()); } catch (e) {}
};
// The seat token of this browser tab for a room (survives a refresh, not shared with other tabs/devices)
DW.onlineSeat = {
  key: (id) => 'dw-online-' + id,
  get(id) { try { return JSON.parse(sessionStorage.getItem(this.key(id)) || 'null'); } catch (e) { return null; } },
  set(id, v) { try { sessionStorage.setItem(this.key(id), JSON.stringify(v)); } catch (e) {} },
  clear(id) { try { sessionStorage.removeItem(this.key(id)); } catch (e) {} },
};

DW.OnlineClient = class extends DW.NetClient {
  constructor(h) { super(h); this.token = ''; this.ka = setInterval(() => this.raw({ t: 'ka' }), 15000); }
  get label() { return 'online server'; }
  url() { return DW.onlineBase().replace(/^http/, 'ws') + '/online'; }
  start(role, code, token) { this.role = role; this.code = code || ''; this.token = token || ''; this.closing = false; this.open(); }
  hello() {
    if (this.code && this.token) this.raw({ t: 'rejoin', code: this.code, token: this.token });
    else if (this.role === 'host') this.raw({ t: 'create' });
    else this.raw({ t: 'join', code: this.code });
  }
  close() { clearInterval(this.ka); super.close(); }
};

</script>
<script>/* src/ui/menus.js */
// DARK WAR — Menus (DOM overlay on top of the canvas): title, main menu, character select, move list &
// combo guide, settings + key remapping, pause, results, tutorial, local Wi-Fi multiplayer screens.
var DW = (globalThis.DW = globalThis.DW || {});

DW.Menus = class {
  constructor(root, game) { this.root = root; this.game = game; this.stack = []; this.comboCache = {}; }
  esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
  show(html, cls = '') {
    this.root.innerHTML = `<div class="screen ${cls}">${html}</div>`;
    this.root.style.display = 'block';
    // Buttons fire on pointerup (robust on touch screens even after other fingers were dragging on the
    // canvas); 'click' still works for keyboard/mouse, de-duplicated.
    this.root.querySelectorAll('[data-act]').forEach(el => {
      const fire = (e) => {
        e.stopPropagation(); e.preventDefault();
        const now = performance.now(); if (el._fired !== undefined && now - el._fired < 400) return; el._fired = now;   // same tap: pointerup + click
        // a tap that just changed screens must not "ghost click" a button on the new screen
        if (e.type === 'click' && this.lastPointerFire !== undefined && now - this.lastPointerFire < 400) return;
        if (e.type === 'pointerup') this.lastPointerFire = now;
        DW.Sound.unlock(); DW.Sound.play(el.dataset.act === 'back' ? 'uiBack' : 'ui');
        this.game.action(el.dataset.act, Object.assign({}, el.dataset));
      };
      // Only a press that STARTED on this button counts. A finger that went down on the game screen
      // (e.g. holding Heavy) and lifts over a menu that just opened must not activate anything.
      el.addEventListener('pointerdown', (e) => { el._down = e.pointerId; });
      el.addEventListener('pointerup', (e) => { if (el._down === e.pointerId) { el._down = null; fire(e); } });
      el.addEventListener('pointercancel', () => { el._down = null; });
      el.addEventListener('click', (e) => { if (e.detail === 0) fire(e); });   // keyboard activation (Enter/Space) only
    });
  }
  hide() { this.root.style.display = 'none'; this.root.innerHTML = ''; }

  title() {
    this.show(`<div class="title-wrap" data-act="start">
      <div class="kanji-logo">闇戦</div><h1 class="logo">DARK WAR</h1>
      <p class="tag">Beginner friendly · High skill ceiling</p>
      <div class="blink">${DW.onlineRoomFromURL && DW.onlineRoomFromURL() ? 'TAP TO JOIN YOUR FRIEND\'S ROOM' : 'TAP TO START'}</div>
      <p class="small">Prototype · placeholder art & synthesized audio</p></div>`, 'title');
  }

  main() {
    this.show(`<div class="kanji-logo sm">闇戦</div><h1 class="logo sm">DARK WAR</h1>
      <div class="menu">
        <button data-act="select" data-mode="versus">VERSUS CPU<small>Best of 3 rounds</small></button>
        <button data-act="select" data-mode="training">TRAINING<small>Dummy, frame data, hitboxes, inputs</small></button>
        <button data-act="tutorial">TUTORIAL<small>Learn every mechanic step by step</small></button>
        <button data-act="trials">COMBO TRIALS<small>8–11 per character · Modern or Traditional</small></button>
        <button data-act="select" data-mode="local">LOCAL 2 PLAYERS<small>Two players on one keyboard / gamepads</small></button>
        <button data-act="select" data-mode="watch">CPU vs CPU (WATCH)<small>Pick two fighters and watch them play — speed, hitboxes, auto-rematch</small></button>
        <button data-act="movelist">MOVE LIST & COMBOS</button>
        <button data-act="settings">SETTINGS & CONTROLS</button>
        <button data-act="online">ONLINE MULTIPLAYER<small>Send a friend a link — play from anywhere</small></button>
        <button data-act="net">LOCAL WI‑FI MULTIPLAYER<small>Two phones on the same Wi‑Fi</small></button>
      </div>`, 'main');
  }

  charCard(c, selected, tag, colorIndex = 0) {
    const stars = '★'.repeat(c.difficulty) + '☆'.repeat(3 - c.difficulty), pal = DW.paletteFor(c, colorIndex);
    return `<button class="card ${selected ? 'sel' : ''}" data-act="pick" data-char="${c.id}" style="--aura:${pal.aura}">
      <canvas class="portrait" data-portrait="${c.id}" data-color="${colorIndex}" width="140" height="170"></canvas>
      <div class="cname">${c.name}</div><div class="ckanji">${c.kanji}</div>
      <div class="carch">${c.archetype}</div><div class="cdiff">${stars}</div>${tag ? `<div class="ctag">${tag}</div>` : ''}</button>`;
  }
  select(state) {
    const chars = Object.values(DW.CHARACTERS);
    const p = state.picking, mode = state.mode;
    const who = mode === 'watch' ? (p === 0 ? 'CPU 1 (LEFT)' : 'CPU 2 (RIGHT)') : mode === 'trial' ? 'TRIALS' : p === 0 ? 'PLAYER 1' : mode === 'local' ? 'PLAYER 2' : mode === 'training' ? 'DUMMY' : 'CPU OPPONENT';
    const human = mode !== 'watch' && (p === 0 || mode === 'local');
    const c = DW.CHARACTERS[state.chars[p]], ci = state.colors[p] || 0, pal = DW.paletteFor(c, ci);
    const extra = mode === 'watch' ? `<div class="schemehdr">CPU ${p + 1} DIFFICULTY</div><div class="row seg">${['easy', 'normal', 'hard'].map(l => `<button data-act="cpulevelw" data-p="${p}" data-level="${l}" class="${(state.cpuLevels || [])[p] === l ? 'on' : ''}">${l.toUpperCase()}</button>`).join('')}</div>`
      : mode === 'versus' && p === 1 ? `<div class="row seg">${['easy', 'normal', 'hard'].map(l => `<button data-act="cpulevel" data-level="${l}" class="${state.cpuLevel === l ? 'on' : ''}">${l.toUpperCase()}</button>`).join('')}</div>` : '';
    // colour swatches (P2 can't take P1's exact look on the same character)
    const taken = p === 1 && state.chars[0] === state.chars[1] ? state.colors[0] : -1;
    const sw = Array.from({ length: DW.colorCount(c) }, (_, i) => {
      const q = DW.paletteFor(c, i), off = i === taken;
      return `<button class="swatch ${i === ci ? 'on' : ''} ${off ? 'off' : ''}" data-act="color" data-idx="${i}" ${off ? 'disabled' : ''} title="${this.esc(c.colorNames ? c.colorNames[i] : 'Color ' + (i + 1))}"
        style="background:linear-gradient(135deg, ${q.cloth} 0 45%, ${q.aura} 45% 62%, ${q.kSuit || q.oSkin || q.body} 62%)">${off ? 'P1' : ''}</button>`;
    }).join('');
    const sch = state.schemes[p] || 'traditional';
    const seg = (act, cur) => `<div class="row seg">
        <button data-act="${act}" data-scheme="modern" class="${cur === 'modern' ? 'on' : ''}">MODERN</button>
        <button data-act="${act}" data-scheme="traditional" class="${cur === 'traditional' ? 'on' : ''}">TRADITIONAL</button></div>`;
    // Layout (fix for phones): header · scrolling roster/bio area · fixed footer. The footer always holds the
    // control-mode choice and the confirm button, so neither can be pushed off-screen by the 6-card roster.
    // Long explanations live in the scroll area; the footer only has the buttons plus a one-line summary.
    let foot = '', info = '';
    if (human && mode !== 'trial') {
      foot = `<div class="schemehdr">CONTROLS · ${p === 0 ? 'P1' : 'P2'}</div>${seg('scheme', sch)}
        <div class="footnote">${sch === 'modern' ? 'Modern: easier specials, supers & auto-combo' : 'Traditional: full manual inputs, full damage'}</div>`;
      info = `<div class="schemebox"><div class="schemehdr">ABOUT ${sch === 'modern' ? 'MODERN' : 'TRADITIONAL'} CONTROLS</div><p class="desc">${sch === 'modern'
          ? '<b>Modern:</b> beginner-friendly. Specials are SPECIAL + a direction, supers have their own buttons, and mashing LIGHT during a combo continues it for you (assisted hits deal 15% less). You still aim, time and defend.'
          : '<b>Traditional:</b> full manual control. Every chain, cancel, special direction and super chord (H+S, Down+H+S) is yours to input. Full damage.'}</p></div>`;
    }
    if (mode === 'trial') {
      const ts = state.trialScheme || 'traditional';
      foot = `<div class="schemehdr">COMBO TRIALS · CONTROL MODE</div>${seg('trialscheme', ts)}`;
      info = this.trialSchemeInfo(ts, c);
    }
    if (extra) foot += `<div class="schemehdr">CPU LEVEL</div>${extra}`;
    const prev = this.root.querySelector('.selscroll'), keep = prev && this.selKey === mode + p ? prev.scrollTop : 0;
    this.selKey = mode + p;
    this.show(`<div class="hdr"><button class="back" data-act="back">‹</button><h2>CHOOSE · ${who}</h2></div>
      <div class="selscroll">
      <div class="cards">${chars.map(ch => this.charCard(ch, ch.id === state.chars[p], p === 1 && state.chars[0] === ch.id ? 'P1' : '', ch.id === state.chars[p] ? ci : 0)).join('')}</div>
      <div class="colorrow"><span>COLOR</span>${sw}<b style="color:${pal.aura}">${this.esc(c.colorNames ? c.colorNames[ci] : '')}</b></div>
      <div class="bio"><b style="color:${pal.aura}">${c.name}</b> — ${this.esc(c.bio)}
        <div class="stats">Health ${c.health.toLocaleString('en-US')} · Walk ${c.movement.walkForward} · Air dashes ${c.dash.air.perAirtime}</div></div>
      ${info}</div>
      <div class="selfoot">${foot}
      <div class="row confirmrow"><button class="primary" data-act="confirm">${mode === 'trial' ? 'START TRIALS' : p === 0 ? 'NEXT ›' : mode === 'training' ? 'START TRAINING' : 'FIGHT!'}</button>
      ${p === 1 && mode !== 'local' ? '<button data-act="random">RANDOM</button>' : ''}</div></div>`, 'select picker');
    const sc = this.root.querySelector('.selscroll'); if (sc && keep) sc.scrollTop = keep;
    this.drawPortraits();
  }
  drawPortraits() {
    this.root.querySelectorAll('canvas[data-portrait]').forEach(cv => DW.drawPortrait(cv, DW.CHARACTERS[cv.dataset.portrait], +(cv.dataset.color || 0)));
  }

  movelist(charId, tab, scheme) {
    const c = DW.CHARACTERS[charId], mv = c.moves; scheme = scheme === 'modern' ? 'modern' : 'traditional';
    const tabs = Object.values(DW.CHARACTERS).map(ch => `<button data-act="mlchar" data-char="${ch.id}" class="${ch.id === charId ? 'on' : ''}" style="--aura:${ch.palette.aura}">${ch.name.split(' ').pop()}</button>`).join('');
    const sub = ['moves', 'combos', 'system'].map(t => `<button data-act="mltab" data-tab="${t}" class="${t === tab ? 'on' : ''}">${t.toUpperCase()}</button>`).join('');
    const schTabs = ['traditional', 'modern'].map(t => `<button data-act="mlscheme" data-scheme="${t}" class="${t === scheme ? 'on' : ''}">${t.toUpperCase()}</button>`).join('');   // Update 13
    let body = '';
    const adv = (m) => { if ((!m.hitbox && !m.projectile && !m.trap) || m.grab) return '—'; const a = m.blockstun - (m.endOnHit ? m.recovery : m.active - 1 - (m.multi ? (m.multi.count - 1) * m.multi.interval : 0) + m.recovery); /* Update 14: multi-hit → after the last hit */ return m.projectile || m.trap ? 'varies' : (a > 0 ? '+' : '') + a; };
    const row = (id, m) => `<tr><td><b>${this.esc(m.name)}</b><div class="desc">${this.esc(m.desc || '')}</div></td><td class="inp">${this.esc(m.input || id)}</td>
      <td class="num">${m.hitbox || m.projectile || m.trap ? m.startup + 1 : '—'}</td><td class="num">${DW.moveDamageText(m, '+') || '—'}</td>
      <td class="num">${adv(m)}</td><td>${[m.meterCost ? m.meterCost / 100 + ' bar' + (m.meterCost > 100 ? 's' : '') : '', m.shadowStep ? '影 SS' : '', m.grab ? 'grab' : '', m.armor ? 'armor' : '', m.invuln ? 'invuln' : '', m.height === 'low' ? 'low' : m.height === 'overhead' ? 'overhead' : '', m.bounce ? m.bounce.type + ' bounce' : '', (m.cancels || []).includes('jc') ? 'JC' : ''].filter(Boolean).join(' · ')}</td></tr>`;
    if (tab === 'moves') {
      // Update 13 — built from the live move data. Every non-hidden move appears exactly once: anything not in a
      // named group lands in "Other" (so a new move can never silently vanish from the list).
      const rekka = mv['5S'] && mv['5S'].rekka ? ['5S', '5S2', '5S3'] : [];
      const groups = [['Ground normals', ['5L', '5L2', '5L3', '2L', '5H', '6H', '2H']], ['Air normals (while jumping)', ['jL', 'jH']], ['Throw (universal)', ['5G']],
        [c.stances ? '無 Neutral stance — balanced (specials)' : 'Ground specials', ['5S', '6S', '4S', '2S', '1S', '3S'].filter(i => !rekka.includes(i))],
        ...(rekka.length ? [['Rekka — S, then S, then S (each part is optional)', rekka]] : []),
        ['Air specials (while jumping)', ['j5S', 'j6S', 'j6Sk', 'j4S', 'j2S', 'j8S']],
        ['炎 Flame stance — offensive (Down + S from Neutral)', ['K5L', 'K5H', 'K2H', 'K5S', 'K6S', 'K4S', 'K2S']], ['水 Water stance — defensive (Down + S from Flame)', ['M5L', 'M5H', 'M2H', 'M5S', 'M6S', 'M4S', 'M2S']],
        ['Supers', ['L1', 'jL1', 'L3']]];
      const seen = new Set(groups.flatMap(([, ids]) => ids)), other = Object.keys(mv).filter(i => !mv[i].hidden && !seen.has(i));
      if (other.length) groups.push(['Other', other]);
      const supNote = `<p class="desc">Supers: <b>H + S</b> (Level 1, 1 bar) and <b>Down + H + S</b> (Level 3, 3 bars) — or the dedicated <b>LV1</b> / <b>極</b> buttons (keys I / O). Same in both control schemes.</p>`;
      body = groups.filter(([g, ids]) => ids.some(i => mv[i] && !mv[i].hidden)).map(([g, ids]) => `<h3>${g}</h3><table><tr><th>Move</th><th>Input</th><th>Startup</th><th>Damage</th><th>On block</th><th>Properties</th></tr>${ids.filter(i => mv[i] && !mv[i].hidden).map(i => row(i, mv[i])).join('')}</table>${g === 'Supers' ? supNote : ''}`).join('');
      body = this.charMechanics(c) + body;
      if (scheme === 'modern' && c.assist) {
        const nm = (st) => st === 'J' ? 'pursuit jump' : st === 'JC' ? 'Jump Cancel' : st && typeof st === 'object' ? (st.super && mv[st.super] ? mv[st.super].name + ' if you have 1 bar' + (st.else && mv[st.else] ? ', else ' + mv[st.else].name : '') : st.else && mv[st.else] ? mv[st.else].name : 'end') : mv[st] ? mv[st].name : st;
        const route = (r) => r.map(st => `<span class="tok">${this.esc(nm(st))}</span>`).join(' <i>›</i> ');
        body = `<h3>Modern auto-combo (only while your combo is hitting)</h3><table>
          <tr><td><b>Mash LIGHT</b></td><td>${route(c.assist.light)}</td></tr>
          <tr><td><b>Mash HEAVY</b></td><td>${route(c.assist.heavy)}</td></tr>
          ${c.assist.special && mv[c.assist.special] ? `<tr><td><b>SPECIAL (no direction) mid-combo</b></td><td>${this.esc(mv[c.assist.special].name)}</td></tr>` : ''}</table>
          <p class="desc">Auto-picked hits deal 15% less. Outside a confirmed combo, every button and every direction + S works exactly as in Traditional — the table below is the same move set.</p>` + body;
      } else body = `<p class="desc">Traditional: every input below is done by hand — directions, buttons, cancels and the H + S / Down + H + S super chords.</p>` + body;
    } else if (tab === 'combos') {
      body = `<p class="desc">Every combo here is performed by the game's own test bot — the damage shown is real. Tap ▶ to watch it, then practise.</p>` +
        c.combos.map((cb, i) => {
          const key = c.id + i; if (!this.comboCache[key]) { const r = DW.runCombo(c.id, 'ren', cb.notation, cb.start ? { startDist: cb.start } : {}); this.comboCache[key] = r; }
          const r = this.comboCache[key];
          const bars = (cb.notation.match(/SS|L1/g) || []).length + (/L3/.test(cb.notation) ? 3 : 0);
          return `<div class="combo lvl-${cb.level.toLowerCase()}"><div class="ctop"><span class="lvl">${cb.level}</span> <b>${this.esc(cb.name)}</b>

            <div class="nota">${this.notation(cb.notation)}</div>
            <div class="cstat">${r.hits} hits · ${r.damage.toLocaleString('en-US')} damage · ${bars ? bars + ' bar' + (bars > 1 ? 's' : '') : 'no meter'}${r.ok ? '' : ' · <span style="color:#ff6b5c">needs precise timing</span>'}</div></div>`;
        }).join('');
    } else {
      const d = c.dash, M = c.movement;
      body = `<h3>Universal mechanics</h3><table>
        <tr><td><b>Launcher / anti-air</b></td><td>Down + H</td><td>Sends the opponent up — and it is everyone's dedicated anti-air (hits above and slightly behind the head; not invincible). Press JUMP after it hits to chase them. It can relaunch at most ${DW.CONFIG.combo.launcherLoopCap} times per combo; a third Down + H knocks them away ("LOOP LIMIT").</td></tr>
        <tr><td><b>Jump Cancel</b></td><td>JUMP during an air string</td><td>Air Heavy can be cancelled into a new jump on hit. <b>${DW.CONFIG.jumpCancel.allowancePerCombo} per combo</b>. Resets only when the combo ends.</td></tr>
        <tr><td><b>Ground Dash</b></td><td>DASH (back + DASH = backdash)</td><td>${d.ground.speed} px/f for ${d.ground.frames}f. Attack out of it from frame ${d.ground.attackCancelFrom}. A forward dash <b>slips through projectiles</b> on frames ${(d.ground.projThrough || [1, d.ground.frames]).join('–')} (character-specific) — not Super projectiles, strikes or throws, and the end of the dash can be hit. Backdashes don't pass projectiles.</td></tr>
        <tr><td><b>Air Dash</b></td><td>DASH in the air</td><td>${d.air.perAirtime} per jump. Holds height. Refreshed by Jump Cancel and Shadow Step.</td></tr>
        <tr><td><b>Shadow Step 影</b></td><td>DASH during a 影 move (1 bar)</td><td>Same button as Dash: pressing DASH during a special (or a move marked 影 SS) with 1 bar Shadow Steps — a fast homing dash. Invincible for ${DW.CONFIG.shadowStep.invulnFrames}f, act from frame ${DW.CONFIG.shadowStep.actionableFrom}. Keeps the combo going.</td></tr>
        <tr><td><b>Level 1 Super</b></td><td>H + S or LV1 (1 bar)</td><td>Cancel from normals and specials on hit.</td></tr>
        <tr><td><b>Level 3 Ultimate</b></td><td>DOWN + H + S or 極 (3 bars)</td><td>If its final hit is lethal, a finishing cinematic plays. If that KO also wins the match, the character's own CINEMATIC FINISH follows.</td></tr>
        <tr><td><b>Reversal buffer</b></td><td>—</td><td>A Special or Super pressed during block- or hitstun comes out as soon as the stun ends, with the direction you hold then.</td></tr>
        <tr><td><b>Blocking</b></td><td>Hold BACK</td><td>Hold DOWN+BACK for lows. Air attacks are overheads: block standing. Grabs can't be blocked.</td></tr>
        <tr><td><b>Throw</b></td><td>GRAB (back + GRAB = back throw)</td><td>Everyone has one. ${DW.CHARACTERS[charId].moves['5G'].startup + 1}f startup, short range. Beats blocking. Whiffs against jumping, stunned or knocked-down opponents; loses to a strike on the same frame; a whiff is punishable.</td></tr>
        <tr><td><b>Throw escape</b></td><td>GRAB within ${DW.CONFIG.throw.techWindow}f of being caught</td><td>Breaks a regular throw (no damage). Command grabs (e.g. Onimaru's) can't be escaped — avoid them by jumping, backdashing or hitting first.</td></tr>
        <tr><td><b>Kekkai Break 結</b></td><td>BREAK (full jade gauge)</td><td>Usable any time you can act — while being hit (from the first hit), while blocking, or from neutral (a <b>RAW BREAK</b>, no invulnerability after the burst). A sealing barrier freezes the fight, then bursts and throws a non-guarding attacker clear — back to neutral. If the opponent <b>blocks</b> the burst (or it reaches nobody) you stay open ${DW.CONFIG.break.punish.guarded}f longer and take counter-hits: punish it. Supers and grab sequences can't be broken. The gauge starts full and refills from damage taken.</td></tr>
        <tr><td><b>Bounces</b></td><td>—</td><td>1 ground bounce and 1 wall bounce per combo.</td></tr>
        <tr><td><b>Combo scaling</b></td><td>—</td><td>Full damage for 3 hits, then -10% per hit (min 35%; supers min 55%). Hitstun shrinks and juggle gravity rises with every hit.</td></tr>
        </table><h3>${c.name} movement</h3><p class="desc">Walk ${M.walkForward} px/f · Jump startup ${M.jumpSquat}f · Health ${c.health.toLocaleString('en-US')} · ${c.dash.air.perAirtime} air dash${c.dash.air.perAirtime > 1 ? 'es' : ''}</p>`;
    }
    this.show(`<div class="hdr"><button class="back" data-act="back">‹</button><h2>MOVE LIST</h2></div>
      <div class="tabs chars">${tabs}</div><div class="tabs">${sub}</div><div class="tabs scheme">${schTabs}</div>
      <p class="desc legend">Forward / Back are relative to your opponent. L = Light · H = Heavy · S = Special · "Air" = while jumping.</p>
      <div class="scroll">${body}</div>`, 'movelist opaque');
  }
  // Update 13 — character-specific mechanics, read from the live data (values update with the game).
  charMechanics(c) {
    const mv = c.moves, d = c.dash.ground, pt = d.projThrough || [1, d.frames], rows = [];
    rows.push(['Forward dash', `DASH (+ Forward or no direction). ${d.speed} px/f for ${d.frames}f, ${d.recovery}f recovery. <b>Slips through projectiles on frames ${pt[0]}–${pt[1]}</b> (not Supers, strikes or throws).`]);
    if (c.teleportCharges) rows.push(['Teleport charges', `${c.teleportCharges.max} charges (pips under her health), each refills ${c.teleportCharges.rechargeSeconds}s after use. Ground Forward + S, Back + S and air S teleports spend one; with none left the input does nothing. Dashes and the slide never spend charges.`]);
    if (mv['5S'] && mv['5S'].rekka) rows.push(['Rekka', `S, then S again after each cut (on hit, block or a miss) → ${mv['5S'].name} › ${mv['5S2'].name} › ${mv['5S3'].name}. Stop after any part. On block each follow-up leaves a gap the opponent can hit.`]);
    if (mv['2S'] && mv['2S'].lowProfile) rows.push(['Slide + Shadow Step', `${mv['2S'].name} (Down + S, any Down direction) can be Shadow Step-cancelled with DASH (1 bar) when it hits or is blocked — not after a miss.`]);
    if (mv['6S'] && mv['6S'].detonate !== undefined || mv['j6Sk']) rows.push(['Seals 封', `Down-Back + S (near, ${mv['1S'] ? mv['1S'].seal.x : '?'} px), Down + S (mid, ${mv['2S'] && mv['2S'].seal ? mv['2S'].seal.x : '?'} px), Down-Forward + S (far, ${mv['3S'] && mv['3S'].seal ? mv['3S'].seal.x : '?'} px). Up to 3 on screen (a 4th replaces the oldest), 15 s each, armed after 18f. An opponent who walks onto an armed seal is bound briefly. Detonate them all with Forward + S on the ground (Kai!) or Forward + S in the air (Kai! from the air). His fireballs ignite seals they pass over.`]);
    if (mv['5S'] && mv['5S'].charge) rows.push(['Charged Onibi', 'HOLD Special: release early for the normal Onibi, ~0.3 s for Lv1 (faster, stronger), ~0.8 s for Lv2 (huge, 2 hits, knockdown). Charging leaves him open.']);
    if (c.id === 'ayakashi' && DW.PUPPET) rows.push(['Puppet Kagemaru', `Her specials command the puppet. It takes ${DW.PUPPET.durability} hits to break, then rebuilds in about ${Math.round((DW.PUPPET.downFrames + DW.PUPPET.reformFrames) / 60)} s. While it is broken the puppet commands do nothing.`]);
    if (mv['K5L'] || mv['M5L']) rows.push(['Stances', '<b>Down + S</b> cycles the stance: 無 Neutral → 炎 Flame → 水 Water → 無 Neutral (one press = one step; the HUD dots show where you are). <b>S</b>, <b>Forward + S</b> and <b>Back + S</b> are different moves in each stance — Neutral: iai cut / advancing slash / retreating cut. Flame (offense): 3-hit flurry / lunging thrust / armored retaliation. Water (defense): parry / projectile-cutting advance / invulnerable retreat. Each stance also has its own L, H and Down + H. A stance change cancels a normal on hit, and the last frames of a stance attack can be cancelled into the next stance (Kirikae). Being hit, thrown or knocked down returns her to Neutral. Same inputs in Modern and Traditional.']);
    if (c.id === 'onimaru') rows.push(['Command grabs', 'S, Forward + S, air S and the Level 1 / Level 3 are grabs: unblockable and not throw-escapable, but telegraphed — jump or hit him first.']);
    return `<h3>${this.esc(c.name)} — character mechanics</h3><table>${rows.map(([a, b]) => `<tr><td><b>${a}</b></td><td>${b}</td></tr>`).join('')}</table>`;
  }
  notation(n) { return n.split(' ').map(t => `<span class="tok ${t === 'JC' || t === 'J' ? 'j' : t === 'SS' ? 'ss' : /L[13]/.test(t) && t.length === 2 ? 'sup' : /S/.test(t) ? 'sp' : ''}">${this.esc(DW.prettyToken(t))}</span>`).join(' <i>›</i> '); }

  settings(s) {
    const tog = (k, v, label) => `<button data-act="set" data-key="${k}" data-val="${v}" class="${String(s[k]) === String(v) ? 'on' : ''}">${label}</button>`;
    const keyrow = (pl, a) => `<tr><td>${DW.ACTION_LABELS[a]}</td><td><button class="key" data-act="remap" data-player="${pl}" data-action="${a}">${(this.game.controls.keymap[pl][a] || []).map(k => k.replace(/^Key|^Digit/, '')).join(' / ') || '—'}</button></td></tr>`;
    this.show(`<div class="hdr"><button class="back" data-act="back">‹</button><h2>SETTINGS</h2></div><div class="scroll">
      <h3>Audio</h3><div class="row seg">${tog('sound', true, 'SOUND ON')}${tog('sound', false, 'ALL OFF')}</div>
      ${[['Sfx', 'SFX'], ['Music', 'MUSIC'], ['Voice', 'CHARACTER VOICES'], ['Announcer', 'ANNOUNCER']].map(([k, label]) => `
        <div class="mixrow"><span>${label}</span>
          <button data-act="mix" data-key="mix${k}" data-d="-0.1">−</button><b>${s['mute' + k] ? 'MUTED' : Math.round(s['mix' + k] * 100) + '%'}</b><button data-act="mix" data-key="mix${k}" data-d="0.1">+</button>

      <h3>Keyboard — Player 1 <small>(tap a key to change it)</small></h3><table class="keys">${DW.ACTIONS.filter(a => a !== 'up').map(a => keyrow('p1', a)).join('')}</table>
      <h3>Keyboard — Player 2</h3><table class="keys">${DW.ACTIONS.filter(a => a !== 'up').map(a => keyrow('p2', a)).join('')}</table>
      <p class="desc">Gamepads work automatically (Xbox layout: X light · Y heavy · B special · A jump · RT grab · RB dash · LB Shadow Step).</p>
      <div class="row"><button data-act="resetkeys">RESET KEYS</button></div></div>`, 'settings opaque');
  }
  layoutPanel(c) {
    const it = c.selected(), names = { stick: c.moveStyle === 'dpad' ? 'D-Pad' : 'Movement stick', light: 'Light', heavy: 'Heavy', special: 'Special', dash: 'Dash / Shadow Step', grab: 'Grab', super1: 'Level 1 Super', super3: 'Level 3 Ultimate' };
    const pos = this.layPos || 'top';

// Character portraits for the select screen (drawn with the in-game renderer's pose system).
DW.drawPortrait = function (cv, ch, colorIndex = 0) {

<script>/* src/main.js */
// DARK WAR — Game shell: scenes, menus, fixed 60 Hz loop, settings persistence.
var DW = (globalThis.DW = globalThis.DW || {});

DW.Game = class {
  constructor() {
    this.canvas = document.getElementById('game');
    this.uiRoot = document.getElementById('ui');
    this.renderer = new DW.Renderer(this.canvas);
    this.fx = new DW.Effects(this.renderer);
    this.controls = new DW.Controls(this.canvas, this.renderer);
    this.menus = new DW.Menus(this.uiRoot, this);
    this.settings = Object.assign({ moveStyle: 'float', sound: true, shake: true, effects: 'full', buttonScale: 1, cpuLevel: 'normal', volume: 0.6,
      mixSfx: 1, mixMusic: 0.5, mixVoice: 0.9, mixAnnouncer: 0.9, muteSfx: false, muteMusic: false, muteVoice: false, muteAnnouncer: false,
      voiceTTS: true, voiceCaptions: false }, this.load('settings') || {});
    const km = this.load('keymap'); if (km) for (const pl of ['p1', 'p2']) if (km[pl]) {
      const k = km[pl]; if (k.shadow) { k.dash = [...new Set([...(k.dash || this.controls.keymap[pl].dash), ...k.shadow])]; delete k.shadow; }   // Update 3: Shadow Step key now dashes

    this.applySettings();
    this.sel = { mode: 'versus', chars: ['ren', 'onimaru'], picking: 0, cpuLevel: this.settings.cpuLevel, cpuLevels: (this.settings.watchLevels || ['hard', 'hard']).slice(), colors: [0, 0], schemes: [this.settings.schemeP1 || 'traditional', this.settings.schemeP2 || 'traditional'] };
    this.scene = 'title'; this.paused = false; this.match = null; this.demo = null;
    this.attract();
    this.controls.onCommand = (c) => this.command(c);
    this.controls.onKey = (code) => this.key(code);
    window.addEventListener('resize', () => this.fit()); this.fit();
    document.addEventListener('visibilitychange', () => { if (document.hidden && this.scene === 'fight' && !this.paused) this.pause(); });
    this.menus.title();
    this.last = performance.now(); this.acc = 0;
    requestAnimationFrame((t) => this.frame(t));
  }

  load(k) { try { return JSON.parse(localStorage.getItem('darkwar.' + k)); } catch (e) { return null; } }
  save(k, v) { try { localStorage.setItem('darkwar.' + k, JSON.stringify(v)); } catch (e) {} }
  applySettings() {
    const s = this.settings;
    DW.Sound.enabled = s.sound; DW.Sound.setVolume(s.volume);
    DW.Sound.setMix({ sfx: s.mixSfx, music: s.mixMusic, voice: s.mixVoice, announcer: s.mixAnnouncer },
                    { sfx: s.muteSfx, music: s.muteMusic, voice: s.muteVoice, announcer: s.muteAnnouncer });
    DW.Voice.tts = !!s.voiceTTS; DW.Voice.captions = !!s.voiceCaptions;
    DW.Voice.onCaption = (n) => this.fx.caption(n);
    if (!s.sound) DW.Music.stop();
    this.renderer.settings = { shake: s.shake, effects: s.effects };
    this.fx.intensity = s.effects === 'reduced' ? 0.4 : 1;
    this.controls.setScale(s.buttonScale);
    this.controls.moveStyle = s.moveStyle || 'float';
  }

  fit() {
    const L = DW.LAYOUT, dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    // Taller phones get a taller control area (the arena stays the same): 960–1170 logical px.
    L.H = Math.round(DW.clamp(L.W * window.innerHeight / Math.max(1, window.innerWidth), 960, 1170));
    // Update 11: on PORTRAIT screens (phones) the arena is 60 px shorter and the control area 60 px taller, so the
    // touch controls have room. Landscape / desktop keep the original layout exactly.
    const shrink = window.innerHeight > window.innerWidth * 1.25 ? DW.LAYOUT_BASE.phoneShrink : 0, B = DW.LAYOUT_BASE;
    L.arenaBottom = B.arenaBottom - shrink; L.groundY = B.groundY - shrink; L.stripTop = B.stripTop - shrink; L.stripBottom = B.stripBottom - shrink; L.controlsTop = B.controlsTop - shrink;
    L.phone = shrink > 0;

    const scale = Math.min(window.innerWidth / L.W, window.innerHeight / L.H);
    const w = Math.floor(L.W * scale), h = Math.floor(L.H * scale);

    this.canvas.width = Math.round(w * dpr); this.canvas.height = Math.round(h * dpr);
    this.renderer.g.setTransform(this.canvas.width / L.W, 0, 0, this.canvas.height / L.H, 0, 0);
    const r = this.canvas.getBoundingClientRect();
    Object.assign(this.uiRoot.style, { width: L.W + 'px', height: L.H + 'px', transform: `scale(${w / L.W})`, left: r.left + 'px', top: r.top + 'px' });
  }

  // ---------------------------------------------------------------- scenes
  attract() {   // CPU vs CPU fight running behind the menus
    const ids = Object.keys(DW.CHARACTERS);
    const a = ids[Math.floor(Math.random() * 3)], b = ids[Math.floor(Math.random() * 3)];
    this.match = new DW.Match({ mode: 'versus', p1: a, p2: b });
    this.inputs = [new DW.CPU(0, 'hard'), new DW.CPU(1, 'hard')];
    this.controls.setMode('versus'); this.controls.enabled = false;
    this.fx.clear();
  }

  // Same character on both sides must never look identical: P2 moves to the next free colour.
  fixColors() {
    const s = this.sel; s.colors = s.colors || [0, 0];
    if (s.chars[0] === s.chars[1] && s.colors[0] === s.colors[1]) s.colors[1] = (s.colors[0] + 1) % DW.colorCount(DW.CHARACTERS[s.chars[1]]);
  }
  startFight(mode, opts = {}) {
    this.controls.owner = 0;
    const s = this.sel;
    this.mode = mode; this.fixColors();

    const schemes = mode === 'watch' ? ['traditional', 'traditional'] : [s.schemes[0], mode === 'local' ? s.schemes[1] : 'traditional'];
    this.match = new DW.Match({ mode: matchMode, p1: s.chars[0], p2: s.chars[1], schemes, colors: s.colors.slice(), training: { autoRefill: true, infiniteMeter: !!opts.infiniteMeter, aiHealth: mode === 'training' ? (this.aiHealth || 'normal') : 'normal' }, matchIntro: 340 });
    if (mode === 'training') this.match.applyAiHealth();   // Update 12
    if (mode === 'watch') { const lv = s.cpuLevels || ['hard', 'hard']; this.inputs = [new DW.CPU(0, lv[0]), new DW.CPU(1, lv[1])]; this.controls.watchLevels = lv.slice(); }   // CPU vs CPU
    else if (mode === 'versus') this.inputs = [null, new DW.CPU(1, s.cpuLevel)];
    else if (mode === 'local') this.inputs = [null, 'p2'];
    else { this.dummy = new DW.Dummy(1, opts.dummy || 'stand'); this.inputs = [null, this.dummy]; this.controls.dummyLabel = this.dummy.mode.toUpperCase(); }
    if (this.dummy && this.dummy.mode === 'cpu') this.dummy.cpu = new DW.CPU(1, 'easy');
    this.controls.setMode(mode === 'local' ? 'versus' : mode, mode === 'local');
    this.controls.enabled = mode !== 'watch';   // watching: no stick / fight buttons, only the toolbar + pause
    if (mode === 'watch') { this.controls.watchSpeed = this.watchSpeed = this.watchSpeed || 1; this.controls.watchLoop = this.watchLoop = this.watchLoop !== undefined ? this.watchLoop : !!this.settings.watchLoop; }
    this.fx.clear(); if (mode !== 'watch') this.renderer.showBoxes = false; this.renderer.showHistory = false; this.renderer.tutorial = null; this.renderer.trial = null;
    this.stats = { best: [{ hits: 0, damage: 0 }, { hits: 0, damage: 0 }], ss: [0, 0], sup: [0, 0] };
    this.scene = 'fight'; this.paused = false; this.resultsShown = false; this.demo = null; this.compare = null; this.renderer.arenaOverlay = null;
    this.controls.releaseAll();
    this.menus.hide();
    DW.Voice.matchStart();
    this.music('fight');
  }
  music(name) { if (this.settings.sound) DW.Music.play(name); }

  startTrials(charId, i = 0) {
    this.sel.chars = [charId, 'ren'];
    this.startFight('trial', { dummy: 'stand', infiniteMeter: true });
    const sch = this.sel.trialScheme || this.settings.trialScheme || 'traditional';
    this.trials = new DW.Trials(charId, i, sch);
    this.match.fighters[0].scheme = sch; this.controls.trialMode = sch;
    this.trialReset();
  }
  // Update 8: switch the trial's control mode in place (keeps the trial you're on and all saved clears)
  setTrialScheme(sch) {
    this.settings.trialScheme = sch; this.save('settings', this.settings); this.sel.trialScheme = sch;
    this.trials.setScheme(sch); this.match.fighters[0].scheme = sch; this.controls.trialMode = sch;
    this.trialReset();
  }
  trialReset() {
    const m = this.match; m.resetPositions(true); { const h = (this.trials && this.trials.combo && this.trials.combo.start || 70) / 2; m.fighters[0].x = -h; m.fighters[1].x = h; }
    m.combos = [DW.newCombo(), DW.newCombo()]; this.fx.clear(); this.demo = null;
    this.renderer.trial = this.trials.view();
  }
  startLesson(i, track = (this.tutorial && this.tutorial.track) || 'beginner') {
    const L = DW.TUTORIAL_TRACKS[track][i];
    const mine = (this.sel.chars && this.sel.chars[0]) || 'ren';
    this.sel.chars = [L.p1 || (track === 'beginner' ? 'ren' : mine), L.p2 || 'ren'];
    this.tutorial = new DW.Tutorial(track, i, this.sel.schemes[0]);
    this.startFight('tutorial', { dummy: this.tutorial.dummyMode(), infiniteMeter: !!L.meter });
    this.match.mode = 'training';
    if (L.realMatch) { this.match.training.autoRefill = false; this.match.training.realMatch = true; }   // real KOs (training normally keeps 1 HP)
    if (L.lowHealth) { this.match.training.autoRefill = false; this.match.fighters[1].health = 1800; }
    const cb = DW.lessonGuide(L, this.match.fighters[0].char);
    if (cb) {   // character-specific lesson: show the route, measure its hit count with the real bot
      const r = DW.runCombo(this.sel.chars[0], 'ren', cb.notation, cb.start ? { startDist: cb.start } : {});
      this.tutorial.state.target = r.hits; this.tutorial.guideCombo = cb; this.tutorial.guideText = cb.name + ': ' + DW.prettyNotation(cb.notation);

  }
  // Demonstrate first: the game performs the lesson's input on P1, then hands control back.
  lessonDemo() {
    const t = this.tutorial, L = t.lesson; let bot = null;
    if (L.compare && typeof document !== 'undefined') {   // Dash vs Shadow Step: two live simulations, stacked
      const f = this.match.fighters[0];
      this.compare = new DW.DashCompare(f.char.id, f.colorIndex, f.scheme); t.phase = 'compare';
      this.renderer.arenaOverlay = (g) => this.compare && this.compare.draw(g);

    }
    if (/^guide/.test(L.demo) && t.guideCombo) bot = new DW.ComboBot(t.guideCombo.notation);
    else if (L.demo === 'heavyroute') bot = new DW.ComboBot(DW.heavyRouteNotation(this.match.fighters[0].char));
    else if (typeof L.demo === 'string') bot = new DW.ComboBot(L.demo);
    else if (L.demo && L.demo.next) { bot = Object.assign(Object.create(Object.getPrototypeOf(L.demo)), L.demo, { i: 0, n: 0, done: false }); }
    if (!bot) { t.phase = 'try'; return; }
    t.phase = 'demo';
    if (L.meter) this.match.fighters[0].meter = 300;
    this.demo = { bot, name: 'WATCH: ' + L.title, notation: '', t: 0, tutorial: true };
  }
  endLessonDemo() {
    const m = this.match, t = this.tutorial;
    this.demo = null; t.phase = 'try'; const keep = t.state.target; t.state = { target: keep };

          DW.netProbe().then(r => { if (this.scene !== 'netjoin' || this.net) return; this.netJoinView.open = (r.info && r.info.open) || []; if (!r.ok) this.netJoinView.status = { text: 'Game server not found at ' + location.host + '.', level: 'bad' }; m.netJoin(this.netJoinView); }); }
        break;
      case 'netjoingo': {
        const inp = this.uiRoot.querySelector('#netcode'); const code = ((inp && inp.value) || '').toUpperCase().replace(/[^A-Z]/g, '');
        this.netOpen('guest', code);
        this.netJoinView.code = code; this.netJoinView.status = { text: 'Connecting…', level: 'warn' }; m.netJoin(this.netJoinView);
        break;
      }
      case 'netleave': this.netClose(); DW.onlineSetURL(''); this.scene = 'menu'; this.attract(); m.main(); DW.Voice.reset(); this.music('menu'); break;
      // ---------------------------------------------------------------- Update 14: ONLINE (invite link)
      case 'online':
        if (this.net) this.netClose();
        this.scene = 'onlinemenu'; m.show('<div class="center"><h2>ONLINE</h2><p class="desc">Contacting the online server…</p></div>', 'settings');
        DW.onlineProbe().then(r => { if (this.scene !== 'onlinemenu') return; r.ok ? m.onlineMenu() : m.onlineUnavailable(r.why); });
        break;
      case 'onlinecreate':
        this.netOpen('host', '', 'online');
        this.scene = 'onlinehost'; m.onlineHostWait(this.net);
        break;
      case 'onlinecopy': {
        const n2 = this.net; if (!n2 || !n2.code) return; const url = DW.onlineInviteURL(n2.code);
        const done = (ok) => { n2.copied = ok ? 'Link copied — paste it to your friend.' : 'Copy failed — press and hold the link to copy it.'; if (this.scene === 'onlinehost') m.onlineHostWait(n2); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(() => done(true), () => done(false)); else done(false);
        break;
      }
      case 'onlineshare': {
        const n2 = this.net; if (!n2 || !n2.code || !navigator.share) return;
        navigator.share({ title: 'DARK WAR', text: 'Fight me in DARK WAR — open this link:', url: DW.onlineInviteURL(n2.code) }).catch(() => {});
        break;
      }
      case 'onlineurl': {   // the page was opened from an invite link (or our own room was refreshed)
        const id = d.room || DW.onlineRoomFromURL(); if (!id) { m.main(); return; }
        const seat = DW.onlineSeat.get(id);
        this.scene = 'onlinejoin'; this.onlineView = { code: id, status: { text: 'Joining your friend\'s room…', level: 'warn' } }; m.onlineJoin(this.onlineView);
        if (seat && seat.token) { this.netOpen(seat.role, id, 'online', seat.token); return; }
        DW.onlineRoomStatus(id).then(st => {
          if (this.scene !== 'onlinejoin') return;
          if (st === 'open') { this.netOpen('guest', id, 'online'); return; }
          this.onlineView.status = { text: st === 'full' ? 'This room already has two players.' : st === 'unreachable' ? 'Can\'t reach the online server. Check your internet connection and try again.' : 'This room doesn\'t exist any more (it expired or the link is wrong). Ask your friend for a new link.', level: 'bad' };
          this.onlineView.failed = true; DW.onlineSetURL(''); m.onlineJoin(this.onlineView);
        });
        break;
      }
      case 'npick': case 'ncolor': case 'nscheme': case 'nready': {
        if (!n || this.scene !== 'netlobby') return;
        const p = n.picks[n.me];
        if (act === 'nready') p.ready = !p.ready;
        else if (p.ready) return;
        if (act === 'npick') { if (p.char !== d.char) p.color = 0; p.char = d.char; }
        if (act === 'ncolor') p.color = +d.idx;
        if (act === 'nscheme') { p.scheme = d.scheme; this.settings.schemeP1 = d.scheme; this.save('settings', this.settings); }
        this.netFixMyColor();
        n.client.send({ t: 'pick', p });
        if (act === 'npick' || act === 'ncolor') this.save('netPick', { char: p.char, color: p.color });
        this.netLobbyView(); this.netMaybeStart();
        break;
      }
      case 'netrematch': if (n) { n.picks.forEach(p => { if (p) p.ready = false; }); this.netEnterLobby(); } break;
      case 'netresume': this.netMenuOpen = false; this.controls.releaseAll(); m.hide(); break;
    }
  },

  // ---------------------------------------------------------------- connection
  netOpen(role, code, kind = 'wifi', token = '') {
    if (this.net) this.netClose();
    const last = this.load('netPick') || {};
    const mine = { char: DW.CHARACTERS[last.char] ? last.char : 'ren', color: last.color || 0, scheme: this.settings.schemeP1 || 'traditional', ready: false };
    const online = kind === 'online';
    const n = this.net = { kind, role, me: role === 'host' ? 0 : 1, code: '', ips: [], port: location.port || 80, status: { text: online ? 'Connecting to the online server…' : 'Connecting to the game server…', level: 'warn' },
      peerOn: false, picks: [null, null], session: null, everPaired: false, peerLostAt: 0 };
    n.picks[n.me] = mine;
    const transport = { send: (o) => n.client.send(o) };
    n.session = role === 'host' ? new DW.NetHost(transport) : new DW.NetGuest(transport);
    if (role === 'guest') n.session.makeMatch = (opts) => this.netStartMatch(opts);
    if (online) n.session.stallMs = 1200;   // internet jitter is bigger than home Wi-Fi: hold the match a bit later
    n.client = new (online ? DW.OnlineClient : DW.NetClient)({
      status: (text, level) => { n.status = { text, level }; this.netRefresh(); },
      error: (text, msg) => { n.status = { text, level: 'bad' };
        if (online) { if (n.code || code) DW.onlineSeat.clear(n.code || code); DW.onlineSetURL(''); this.net = null; n.client.close();
          if (this.scene === 'fight') { this.netOverlay = 'gone'; this.menus.netNotice('MATCH ENDED', text, false); }
          else { this.scene = 'onlinejoin'; this.onlineView = { code: code || n.code, status: n.status, failed: true }; this.menus.onlineJoin(this.onlineView); }
          return; }
        if (role === 'guest') { const v = this.netJoinView || {}; v.status = n.status; this.net = null; n.client.close(); if (this.scene === 'netjoin') this.menus.netJoin(v); } else this.netRefresh(); },
      room: (msg) => {
        n.code = msg.code; if (msg.ips) n.ips = msg.ips; if (msg.port) n.port = msg.port;
        if (online && msg.token) { n.client.token = msg.token; DW.onlineSeat.set(msg.code, { role: msg.role, token: msg.token }); DW.onlineSetURL(msg.code); }
        n.peerOn = msg.peer;
        n.status = msg.peer ? { text: 'Connected', level: 'good' } : role === 'host' ? { text: online ? 'Waiting for your friend to open the link…' : 'Waiting for Phone 2 to join…', level: 'warn' } : { text: 'Joined — waiting for the host…', level: 'warn' };
        if (msg.peer) this.netPeerBack(); else this.netRefresh();
      },
      peer: (msg) => {
        if (msg.on) { n.peerOn = true; this.netPeerBack(); return; }
        n.peerOn = false; n.peerLostAt = performance.now();
        if (msg.left) { if (online && role === 'host') { n.everPaired = false; this.netGone('Your opponent left the room. Send the link again to play someone else.', true); return; } this.netGone('Your opponent left the game.'); return; }
        n.status = { text: 'Opponent disconnected — waiting for them to reconnect…', level: 'bad' };
        if (this.scene === 'fight' && !this.resultsShown) { this.netOverlay = 'lost'; this.netMenuOpen = false; this.menus.netNotice('CONNECTION LOST', online ? 'Your opponent\'s connection dropped (or they refreshed the page). Waiting up to a minute for them to come back…' : 'Your opponent\'s phone dropped off the Wi‑Fi. Waiting for it to reconnect…', true); }
        else this.netRefresh();
      },
      closed: (msg) => { if (online) { DW.onlineSeat.clear(n.code); DW.onlineSetURL(''); }
        this.netGone(online ? (msg && msg.why === 'expired' ? 'The room expired — the other player didn\'t come back.' : msg && msg.why === 'replaced' ? 'This room was opened in another tab.' : 'The player who created the room left.') : 'The host closed the game.'); },
      message: (msg) => this.netMessage(msg),
    });
    n.client.start(role, code, token);
  },
  netClose() {
    const n = this.net; if (!n) return;
    this.net = null; n.client.close(); this.netOverlay = null; this.netMenuOpen = false; this.controls.owner = 0;
    if (this.mode === 'net') this.mode = null;
  },
  netGone(text, keepRoom) {
    const n = this.net; if (!n) return;
    n.peerOn = false; n.status = { text, level: 'bad' };
    if (keepRoom && this.scene !== 'fight') { this.scene = 'onlinehost'; this.menus.onlineHostWait(n); return; }   // online host: the room stays open for a new guest
    if (this.scene === 'fight' || this.scene === 'netlobby') { this.netOverlay = 'gone'; this.menus.netNotice('MATCH ENDED', text, false); }
    else this.netRefresh();
  },
  // opponent (re)connected: share picks; mid-fight, bring the guest's replica back in step
  netPeerBack() {
    const n = this.net; n.peerLostAt = 0;
    n.status = { text: 'Connected', level: 'good' };
    n.client.send({ t: 'pick', p: n.picks[n.me] });
    if (this.scene === 'fight' && this.mode === 'net') {
      if (n.role === 'host') n.session.sendSnapshot(); else n.client.send({ t: 'hello' });
      if (this.netOverlay === 'lost') { this.netOverlay = null; this.menus.hide(); this.controls.releaseAll(); }
      return;
    }
    if (!n.everPaired || ['nethost', 'netjoin', 'onlinehost', 'onlinejoin'].includes(this.scene)) { n.everPaired = true; this.netEnterLobby(); }
    else this.netRefresh();
  },
  netRefresh() {
    const n = this.net; if (!n) return;
    if (this.scene === 'nethost') this.menus.netHostWait(n);
    else if (this.scene === 'onlinehost') this.menus.onlineHostWait(n);
    else if (this.scene === 'onlinejoin') { const v = this.onlineView || {}; v.status = n.status; this.menus.onlineJoin(v); }
    else if (this.scene === 'netjoin') { const v = this.netJoinView || {}; v.status = n.status; this.menus.netJoin(v); }
    else if (this.scene === 'netlobby') this.netLobbyView();
  },
  netMessage(msg) {
    const n = this.net; if (!n) return;
    if (msg.t === 'pick') {
      n.picks[1 - n.me] = msg.p;
      if (this.netFixMyColor()) n.client.send({ t: 'pick', p: n.picks[n.me] });
      if (this.scene === 'netlobby') { this.netLobbyView(); this.netMaybeStart(); }
      return;
    }
    // Update 14: the host reloaded the page mid-fight (its match is gone): both players go back to character select
    if (msg.t === 'hello' && n.role === 'host' && !(this.scene === 'fight' && this.mode === 'net')) { n.client.send({ t: 'tolobby' }); return; }
    if (msg.t === 'tolobby' && n.role === 'guest') { if (this.scene === 'fight') { n.session.match = null; n.status = { text: 'The host reloaded the page — pick your fighter again.', level: 'warn' }; this.netEnterLobby(); } return; }
    n.session.onMessage(msg);   // 'i' / 'resync' / 'hello' at the host; 'f' / 'start' / 'snap' at the guest
  },

  // ---------------------------------------------------------------- shared character select
  netEnterLobby() {
    this.netOverlay = null; this.netMenuOpen = false; this.resultsShown = false; this.paused = false;
    if (this.mode === 'net') this.mode = null;
    if (this.scene === 'fight') this.attract();
    this.scene = 'netlobby'; this.netLobbyView();
    this.net.client.send({ t: 'pick', p: this.net.picks[this.net.me] });
  },
  netLobbyView() { if (this.net && this.scene === 'netlobby') this.menus.netLobby(this.net); },
  // existing colour rule: the same character on both sides never looks identical (P2 moves to a free colour)
  netFixMyColor() {
    const n = this.net, p = n.picks[n.me], o = n.picks[1 - n.me];
    if (n.me === 1 && o && o.char === p.char && o.color === p.color) { p.color = (p.color + 1) % DW.colorCount(DW.CHARACTERS[p.char]); return true; }
    return false;
  },
  netMaybeStart() {
    const n = this.net; if (!n || n.role !== 'host' || !n.peerOn) return;
    const [a, b] = n.picks; if (!a || !b || !a.ready || !b.ready) return;
    const colors = [a.color, b.color];
    if (a.char === b.char && colors[0] === colors[1]) colors[1] = (colors[0] + 1) % DW.colorCount(DW.CHARACTERS[b.char]);
    const opts = { p1: a.char, p2: b.char, schemes: [a.scheme, b.scheme], colors, id: Date.now() };
    const match = this.netStartMatch(opts);
    n.session.start(match, opts);
  },
  netStartMatch(opts) {
    const n = this.net;
    n.picks.forEach(p => { if (p) p.ready = false; });
    this.mode = 'net';
    this.match = new DW.Match({ mode: 'versus', p1: opts.p1, p2: opts.p2, schemes: opts.schemes, colors: opts.colors, matchIntro: 340 });
    this.inputs = [null, null];
    this.controls.setMode('versus', false); this.controls.enabled = true; this.controls.owner = n.me;
    this.fx.clear(); this.renderer.showBoxes = false; this.renderer.showHistory = false; this.renderer.tutorial = null; this.renderer.trial = null; this.renderer.arenaOverlay = null;
    this.stats = { best: [{ hits: 0, damage: 0 }, { hits: 0, damage: 0 }], ss: [0, 0], sup: [0, 0] };
    this.scene = 'fight'; this.paused = false; this.resultsShown = false; this.demo = null; this.compare = null; this.dummy = null;
    this.netOverlay = null; this.netMenuOpen = false;
    this.controls.releaseAll(); this.menus.hide();
    DW.Voice.matchStart(); this.music('fight');
    return this.match;
  },

  // ---------------------------------------------------------------- networked match loop
  netTick() {
    const n = this.net; if (!n) return;
    const idle = this.netMenuOpen || this.resultsShown || this.netOverlay;
    const local = idle ? DW.emptyInputFrame() : this.controls.read(0);
    // Update 14 (online): the host's own input delay follows the measured round trip (≈ half of it), so both
    // players feel about the same lag — 2 frames on Wi-Fi, up to 7 on a slow internet route.
    if (n.kind === 'online' && n.role === 'host' && n.client.rtt) n.session.delay = DW.clamp(Math.round(n.client.rtt / 2 / 16.7) + 1, 2, 7);
    this.controls.endFrame();
    let ev;
    if (n.role === 'host') ev = n.session.step(local) || [];
    else { n.session.sendInput(local); ev = n.session.pump(); if (n.session.match) this.match = n.session.match; }
    const m = this.match;
    this.fx.ingest(ev, m); this.fx.continuous(m); this.fx.tick();
    DW.Voice.ingest(ev, m);
    for (const e of ev) {
      if (e.type === 'round' && m.wins[0] === DW.CONFIG.round.winsNeeded - 1 && m.wins[1] === DW.CONFIG.round.winsNeeded - 1) this.music('final');
      if (e.type === 'comboend' && e.hits > this.stats.best[e.who].hits) this.stats.best[e.who] = { hits: e.hits, damage: e.damage };
      if (e.type === 'shadowstep') this.stats.ss[e.who]++;
      if (e.type === 'super') this.stats.sup[e.who]++;
    }
    if (m.result && !this.resultsShown) {
      this.resultsShown = true; this.netMenuOpen = false;
      setTimeout(() => {
        if (this.mode !== 'net' || this.netOverlay) return;
        const label = n.me === 0 ? ['YOU', 'OPPONENT'] : ['OPPONENT', 'YOU'];
        this.menus.results({ net: true, chars: m.fighters.map(f => f.char.id), colors: m.fighters.map(f => f.colorIndex), winner: m.result.winner, wins: m.result.wins,
          names: m.fighters.map(f => f.char.name), label, best: this.stats.best, ss: this.stats.ss, sup: this.stats.sup });
      }, 600);
    }
  },
  netStalled() {
    const n = this.net; if (!n || this.resultsShown || this.netOverlay) return false;
    return n.role === 'host' ? n.session.stalled : (n.session.stalled || n.session.waitingSnap);
  },
  drawNetHud() {
    const n = this.net; if (!n) return;
    const g = this.renderer.g, L = DW.LAYOUT, r = this.renderer, m = this.match;
    g.save();
    // "YOU" tag under this phone's fighter
    const f = m.fighters[n.me];
    if (f && !m.cinematic) {
      const x = DW.clamp(r.sx(f.x), 30, L.W - 30), y = Math.min(r.sy(f.y) + 18, L.arenaBottom - 8);
      g.font = 'bold 12px system-ui'; g.textAlign = 'center';
      g.fillStyle = 'rgba(0,0,0,0.6)'; g.fillRect(x - 22, y - 12, 44, 16);
      g.fillStyle = f.pal ? f.pal.aura : '#ffd27a'; g.fillText('▲ YOU', x, y);
    }
    // connection indicator (bottom-left of the arena)
    const q = n.client.quality(), col = { good: '#5fd38a', ok: '#ffd27a', bad: '#e0464e', down: '#e0464e' }[q];
    const txt = q === 'down' ? 'NO LINK' : `${n.kind === 'online' ? 'Online' : 'Wi‑Fi'} ${Math.round(n.client.rtt)} ms`;
    g.font = '11px system-ui'; g.textAlign = 'left';
    g.fillStyle = 'rgba(0,0,0,0.55)'; g.fillRect(6, L.arenaBottom - 20, g.measureText(txt).width + 26, 16);
    g.fillStyle = col; g.beginPath(); g.arc(14, L.arenaBottom - 12, 4, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#e9e3d6'; g.fillText(txt + ` · P${n.me + 1}`, 22, L.arenaBottom - 8);
    // brief hiccup: the match is held (host) or catching up (guest) — never a frozen screen without explanation
    if (this.netStalled()) {
      g.fillStyle = 'rgba(5,4,7,0.6)'; g.fillRect(0, L.arenaTop + 160, L.W, 70);
      g.fillStyle = '#ffd27a'; g.font = 'bold 18px system-ui'; g.textAlign = 'center';
      g.fillText('WAITING FOR OPPONENT…', L.W / 2, L.arenaTop + 192);
      g.fillStyle = '#e9e3d6'; g.font = '13px system-ui'; g.fillText((n.kind === 'online' ? 'Connection' : 'Wi‑Fi') + ' hiccup — the fight resumes automatically', L.W / 2, L.arenaTop + 214);
    }
    g.restore();
  },
});

</script>
<script>DW.boot();</script>
</body>
