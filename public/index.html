<script>/* src/net/netcore.js */
// DARK WAR — Local Wi-Fi netplay core (Update 6). DOM-free so it runs (and is tested) in Node too.
//
// Model: HOST-AUTHORITATIVE INPUT STREAM + STATE CORRECTION
//   • The host phone runs the one true simulation. Every frame it decides which input from each player
//     applies on that frame (its own, and the latest one received from the guest) and broadcasts
//     { frame, P1 input, P2 input }. The guest never feeds its own input into its simulation.
//   • The guest phone replays exactly that frame stream on its own copy of the deterministic simulation
//     (so it draws full-rate animation locally instead of receiving positions 60×/s).
//   • Every 30 frames the host sends a hash of its state. If the guest's hash for that frame differs (e.g.
//     tiny float differences between phone browsers), the guest asks for a full SNAPSHOT of the host's match
//     and replaces its own — the host's outcome always wins. Snapshots also handle reconnects.
//   • This is NOT rollback: the guest's own inputs reach the screen after a network round trip (~20–60 ms on
//     home Wi-Fi). The host plays with a small fixed input delay to keep it fair.
var DW = (globalThis.DW = globalThis.DW || {});

DW.NET = { hostInputDelay: 2, hashEvery: 30, stallMs: 600, maxCatchUp: 4 };

// ---------------------------------------------------------------- input codec (16-bit mask)
DW.NetCodec = {
  KEYS: ['left', 'right', 'up', 'down', 'jump', 'light', 'heavy', 'special', 'grab', 'dash', 'shadow', 'super1', 'super3', 'brk'],
  enc(f) { let m = 0; if (f) this.KEYS.forEach((k, i) => { if (f[k]) m |= 1 << i; }); return m; },
  dec(m) { const f = DW.emptyInputFrame(); this.KEYS.forEach((k, i) => { f[k] = !!(m & (1 << i)); }); return f; },
};

// ---------------------------------------------------------------- state hash (cheap, every 30 frames)
DW.netHash = function (m) {
  let h = 2166136261 >>> 0;
  const mix = (v) => { const s = String(v); for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } };
  mix(m.frame); mix(m.timer); mix(m.roundState); mix(m.wins.join(','));
  for (const f of m.fighters) { mix(Math.round(f.x * 10)); mix(Math.round(f.y * 10)); mix(f.health); mix(Math.round(f.meter)); mix(Math.round(f.brk || 0)); mix(f.state); mix(f.moveId || ''); mix(f.moveFrame || 0); }
  mix(m.entities.length);
  return h;
};

// ---------------------------------------------------------------- full snapshot (serialize a whole Match)
// Generic deep copy that replaces references to shared definition data (characters, moves, sequences,
// poses, config, cinematic scripts) with symbolic paths, and live objects (Match, Fighters) with ids.
DW.NetSnap = {
  registry: null,
  buildRegistry() {
    const reg = new Map(), seen = new Set();
    const walk = (o, path, depth) => {
      if (!o || typeof o !== 'object' || seen.has(o) || depth > 8) return;
      seen.add(o); reg.set(o, path);
      for (const k of Object.keys(o)) walk(o[k], path + '.' + k, depth + 1);
    };
    walk(DW.CHARACTERS, 'CHARACTERS', 0); walk(DW.SEQUENCES, 'SEQUENCES', 0); walk(DW.POSES, 'POSES', 0);
    walk(DW.CONFIG, 'CONFIG', 0); if (DW.Cinematic) walk(DW.Cinematic.scripts, 'CINE', 0);
    this.registry = reg; this.byPath = new Map([...reg].map(([o, p]) => [p, o]));
  },
  save(match) {
    if (!this.registry) this.buildRegistry();
    const reg = this.registry, f0 = match.fighters[0], f1 = match.fighters[1];
    const enc = (v, depth) => {
      if (v === null || typeof v !== 'object') return typeof v === 'function' ? undefined : v;
      if (v === match) return { $m: 1 };
      if (v === f0) return { $f: 0 }; if (v === f1) return { $f: 1 };
      const p = reg.get(v); if (p) return { $r: p };
      if (v instanceof Set) return { $set: [...v].map(x => enc(x, depth + 1)) };
      if (Array.isArray(v)) return v.map(x => enc(x, depth + 1));
      const out = {};
      for (const k of Object.keys(v)) { const e = enc(v[k], depth + 1); if (e !== undefined) out[k] = e; }
      return out;
    };
    const body = {};
    for (const k of Object.keys(match)) if (k !== 'fighters' && k !== 'events') body[k] = enc(match[k], 0);
    body.fighters = match.fighters.map(f => { const o = {}; for (const k of Object.keys(f)) if (k !== 'match') { const e = enc(f[k], 0); if (e !== undefined) o[k] = e; } return o; });
    return body;
  },
  // Restore into an existing Match created with the same characters (keeps class prototypes and methods).
  load(match, body) {
    if (!this.registry) this.buildRegistry();
    const dec = (v) => {
      if (v === null || typeof v !== 'object') return v;
      if (Array.isArray(v)) return v.map(dec);
      if (v.$m) return match;
      if (v.$f !== undefined) return match.fighters[v.$f];
      if (v.$r) return this.byPath.get(v.$r);
      if (v.$set) return new Set(v.$set.map(dec));
      const o = {}; for (const k of Object.keys(v)) o[k] = dec(v[k]); return o;
    };
    for (const k of Object.keys(body)) if (k !== 'fighters') match[k] = dec(body[k]);
    match.events = [];
    body.fighters.forEach((fb, i) => {
      const f = match.fighters[i];
      for (const k of Object.keys(fb)) {
        if (k === 'input') { Object.assign(f.input, dec(fb.input)); continue; }
        f[k] = dec(fb[k]);
      }
      f.match = match;
    });
    return match;
  },
};

// Same rule on both phones, applied from the frame's inputs: tapping an attack skips the pre-fight intro.
DW.netPreStep = function (m, ia, ib) {
  if (m.roundState === 'intro') for (const i of [ia, ib]) if (i && (i.light || i.heavy || i.special || i.jump)) m.skipIntro();
};

// ---------------------------------------------------------------- sessions
// transport: { send(obj) } ; incoming messages are given to session.onMessage(obj).
// makeMatch(opts) must build the same Match on both phones from the agreed match options.
DW.NetHost = class {
  constructor(transport, now) {
    this.tx = transport; this.now = now || (() => Date.now());
    this.guestInput = 0; this.guestQueue = []; this.guestSeq = -1; this.lastGuestMsg = this.now(); this.localQueue = [];
    this.match = null; this.history = []; this.stalled = false; this.paused = false;
    this.delay = DW.NET.hostInputDelay; this.stallMs = DW.NET.stallMs;   // Update 14: per-session (online adapts them)
  }
  start(match, opts) { this.match = match; this.opts = opts; this.history = []; this.localQueue = []; this.guestQueue = []; this.guestInput = 0; this.lastGuestMsg = this.now(); this.tx.send({ t: 'start', opts }); }
  onMessage(msg) {
    // guest inputs are queued and used one per frame, so a short tap that arrives bunched with its release
    // (Wi-Fi delivers in bursts) is never lost
    if (msg.t === 'i' && msg.s > this.guestSeq) { this.guestSeq = msg.s; this.guestQueue.push(msg.b); this.lastGuestMsg = this.now(); }
    else if (msg.t === 'resync' || msg.t === 'hello') this.sendSnapshot();
    else if (msg.t === 'ping') this.tx.send({ t: 'pong', id: msg.id });
    if (msg.t !== 'pong') this.lastGuestMsg = this.now();
  }
  sendSnapshot() { if (this.match) this.tx.send({ t: 'snap', f: this.match.frame, data: DW.NetSnap.save(this.match), opts: this.opts }); }
  // One host frame. localInput = this phone's controls (P1). Returns the events of the frame, or null if
  // the match is held (guest silent for too long, or paused).
  step(localInput) {
    const m = this.match; if (!m) return null;
    this.stalled = this.now() - this.lastGuestMsg > this.stallMs;
    // host input delay: P1's press is applied a couple of frames later, which roughly matches what the guest feels
    this.localQueue.push(DW.NetCodec.enc(localInput));
    if (this.stalled || this.paused) { this.localQueue = this.localQueue.slice(-this.delay); return null; }
    while (this.localQueue.length > this.delay + 1) { const x = this.localQueue.shift(); this.localQueue[0] |= x; }   // delay shrank: merge, never drop a press
    const a = this.localQueue.length > this.delay ? this.localQueue.shift() : 0;
    const q = this.guestQueue;
    if (q.length) {
      let b = q.shift();
      while (q.length > 3) b |= q.shift();          // far behind (after a hiccup): merge, keeping every press
      this.guestInput = b;
    }
    const b = this.guestInput;                     // nothing new this frame: the guest is still holding the same buttons
    const ia = DW.NetCodec.dec(a), ib = DW.NetCodec.dec(b);
    DW.netPreStep(m, ia, ib); m.step([ia, ib]);
    this.history.push([a, b]); if (this.history.length > 600) this.history.shift();
    const out = { t: 'f', f: m.frame, a, b };
    if (m.frame % DW.NET.hashEvery === 0) out.h = DW.netHash(m);
    this.tx.send(out);
    return m.drainEvents();
  }
};

DW.NetGuest = class {
  constructor(transport, now) {
    this.tx = transport; this.now = now || (() => Date.now());

    this.hashes = new Map(); this.resyncs = 0; this.gapWait = 0; this.waitingSnap = false; this.makeMatch = null;
    this.stallMs = DW.NET.stallMs;
  }
  sendInput(input) { this.tx.send({ t: 'i', s: ++this.seq, b: DW.NetCodec.enc(input) }); }
  onMessage(msg) {
    this.lastHostMsg = this.now();
    if (msg.t === 'f') {
      if (this.match && msg.f <= this.match.frame) return;
      let i = this.queue.length; while (i > 0 && this.queue[i - 1].f > msg.f) i--;   // keep frame order (dedupe)
      if (!(this.queue[i - 1] && this.queue[i - 1].f === msg.f)) this.queue.splice(i, 0, msg);
    }
    else if (msg.t === 'start') { this.match = this.makeMatch(msg.opts); this.queue = []; this.hashes.clear(); }
    else if (msg.t === 'snap') {
      if (!this.match) this.match = this.makeMatch(msg.opts);
      DW.NetSnap.load(this.match, msg.data); this.match.frame = msg.f;
      this.queue = this.queue.filter(q => q.f > msg.f); this.waitingSnap = false; this.resyncs++;
    }
  }
  get stalled() { return this.now() - this.lastHostMsg > this.stallMs; }
  // Advance the local replica by the frames the host has confirmed. Returns all events produced.
  pump() {
    const m = this.match, ev = []; if (!m || this.waitingSnap) return ev;
    // normally one frame per tick; catch up a little when behind so the guest never drifts back in time
    const n = this.queue.length > 8 ? DW.NET.maxCatchUp : this.queue.length > 3 ? 2 : 1;
    for (let k = 0; k < n && this.queue.length; k++) {
      if (this.queue[0].f !== m.frame + 1) {                       // a frame is missing: wait briefly, then ask for the truth
        if (++this.gapWait > 30) { this.gapWait = 0; this.waitingSnap = true; this.tx.send({ t: 'resync' }); }

      }
      this.gapWait = 0;
      const q = this.queue.shift();
      const ia = DW.NetCodec.dec(q.a), ib = DW.NetCodec.dec(q.b);
      DW.netPreStep(m, ia, ib); m.step([ia, ib]);
      ev.push(...m.drainEvents());
      if (q.h !== undefined && DW.netHash(m) !== q.h) { this.waitingSnap = true; this.tx.send({ t: 'resync' }); break; }
    }
    return ev;
  }
};

// DARK WAR — Procedural PLACEHOLDER music (Music bus). A low drone, taiko-style drums and koto-like
// plucks in the Japanese "in" scale, generated live. Not a composed score — swap for real tracks later.
var DW = (globalThis.DW = globalThis.DW || {});

DW.Music = {
  track: null, step: 0, next: 0, timer: null, drone: null,
  SCALE: [0, 1, 5, 7, 8],                 // in-scale (miyako-bushi) on D
  TRACKS: {
    menu:  { bpm: 72,  root: 146.8, drums: 'x...............x.......x.......', pluck: 0.22, density: 0.25 },
    fight: { bpm: 112, root: 146.8, drums: 'x..x..x.x...x.x.x..x..x.x.x.x..x', pluck: 0.18, density: 0.4 },
    final: { bpm: 126, root: 155.6, drums: 'x.xx..x.x.xx..x.x.xx..x.x.xxx.xx', pluck: 0.2, density: 0.5 },
  },
  play(name) {
    const S = DW.Sound; if (!S || !S.ctx) { this.want = name; return; }
    if (this.track === name) return;
    this.stop(); this.track = name; this.want = null;
    const c = S.ctx, T = this.TRACKS[name]; if (!T) return;
    // drone: two detuned low saws through a slow lowpass sweep
    const g = c.createGain(); g.gain.value = 0.0001; g.gain.exponentialRampToValueAtTime(0.09, c.currentTime + 2); g.connect(S.buses.music);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 260; lp.connect(g);
    const lfo = c.createOscillator(), lg = c.createGain(); lfo.frequency.value = 0.07; lg.gain.value = 120; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
    const o1 = c.createOscillator(), o2 = c.createOscillator(); o1.type = o2.type = 'sawtooth';
    o1.frequency.value = T.root / 2; o2.frequency.value = T.root / 2 * 1.004; o1.connect(lp); o2.connect(lp); o1.start(); o2.start();
    this.drone = { g, nodes: [o1, o2, lfo] };
    this.step = 0; this.next = c.currentTime + 0.1;
    this.timer = setInterval(() => this.schedule(), 50);
  },
  stop() {
    const S = DW.Sound;
    if (this.timer) clearInterval(this.timer); this.timer = null;
    if (this.drone && S && S.ctx) { const t = S.ctx.currentTime; this.drone.g.gain.cancelScheduledValues(t); this.drone.g.gain.setValueAtTime(this.drone.g.gain.value, t); this.drone.g.gain.linearRampToValueAtTime(0, t + 0.6); for (const n of this.drone.nodes) n.stop(t + 0.7); }
    this.drone = null; this.track = null;
  },
  schedule() {
    const S = DW.Sound, c = S.ctx, T = this.TRACKS[this.track]; if (!c || !T) return;
    const dt = 60 / T.bpm / 4;
    while (this.next < c.currentTime + 0.2) {
      const t = this.next, i = this.step % T.drums.length;
      if (T.drums[i] === 'x') this.taiko(t, i % 8 === 0 ? 1 : 0.6);
      if (i % 4 === 2 && Math.random() < 0.35) this.rim(t);
      if (i % 2 === 0 && Math.random() < T.density) {
        const deg = this.SCALE[Math.floor(Math.random() * this.SCALE.length)], oct = Math.random() < 0.3 ? 2 : 1;
        this.pluck(t, T.root * oct * Math.pow(2, deg / 12), T.pluck);
      }
      this.step++; this.next += dt;
    }
  },
  taiko(t, v) {
    const c = DW.Sound.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(48, t + 0.25);
    g.gain.setValueAtTime(0.5 * v, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
    o.connect(g); g.connect(DW.Sound.buses.music); o.start(t); o.stop(t + 0.45);
  },
  rim(t) {
    const S = DW.Sound, c = S.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = S.noiseBuf; f.type = 'bandpass'; f.frequency.value = 2400; f.Q.value = 4;
    g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    s.connect(f); f.connect(g); g.connect(S.buses.music); s.start(t); s.stop(t + 0.06);
  },
  pluck(t, f, v) {
    const c = DW.Sound.ctx, o = c.createOscillator(), o2 = c.createOscillator(), g = c.createGain(), lp = c.createBiquadFilter();
    o.type = 'triangle'; o2.type = 'square'; o.frequency.value = f; o2.frequency.value = f * 2.001;
    lp.type = 'lowpass'; lp.frequency.setValueAtTime(f * 6, t); lp.frequency.exponentialRampToValueAtTime(f * 1.2, t + 0.5);
    const g2 = c.createGain(); g2.gain.value = 0.15; o2.connect(g2); g2.connect(lp); o.connect(lp); lp.connect(g);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + 1.1);

  },
};

<script>/* src/audio/voice.js */
// DARK WAR — Centralized, event-driven VOICE system (character voices + announcer).
//
// The simulation never plays voices. It emits gameplay events (special, grabstart, voicecue, ko, round…);
// this module maps them to voice EVENTS, then decides — per channel — whether a line plays:
//   • priority: a line plays only if nothing of equal/higher priority is playing on its channel
//     (higher priority interrupts lower). Announcer lines of equal priority queue briefly instead.
//   • cooldowns per speaker+event, random "chance" thinning, and anti-repeat line picking.
//   • each gameplay event is handled exactly once (events are drained once per frame).
// Channels: fighter 0, fighter 1 (character voices, Voice bus) and 'ann' (announcer, Announcer bus).
// Speech (text-to-speech) is one shared device resource, so speech lines also pass a global arbiter.
//
// ⚠ PLACEHOLDER OUTPUT — see voice_data.js. Generic device TTS + synthesized grunts, clearly labelled.
var DW = (globalThis.DW = globalThis.DW || {});

const over0 = (match, w) => match.wins[w.id] >= DW.CONFIG.round.winsNeeded;
DW.Voice = {
  tts: true,               // speak placeholder lines (settings: "Spoken placeholder lines")
  captions: false,         // show "[VO placeholder] line" captions on screen
  log: [],                 // last decisions (tests / debug overlay)
  onCaption: null,
  _now: null,

  now() { return this._now != null ? this._now : (typeof performance !== 'undefined' ? performance.now() : Date.now()) / 1000; },
  reset() {
    this.chan = { 0: { prio: 0, until: 0 }, 1: { prio: 0, until: 0 }, ann: { prio: 0, until: 0 } };
    this.speech = { prio: 0, until: 0 };
    this.cool = {}; this.lastLine = {}; this.pending = []; this.comboCalled = [0, 0]; this.log = []; this.introQ = []; this.qBusy = false; this.qToken = (this.qToken || 0) + 1;
    if (this.synth()) try { speechSynthesis.cancel(); } catch (e) {}
  },
  synth() { return typeof speechSynthesis !== 'undefined' && typeof SpeechSynthesisUtterance !== 'undefined' ? speechSynthesis : null; },
  unlock() {   // iOS needs a first utterance inside a user gesture
    if (this._unlocked || !this.synth()) return; this._unlocked = true;
    try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {}
  },

  // ------------------------------------------------------------------ public entry points
  matchStart() { this.reset(); },
  title() { if (!this.chan) this.reset(); this.announce('title'); },

  // Map one frame's gameplay events → voice requests. Pure bookkeeping; audio is best-effort.
  ingest(events, match) {
    if (!this.chan) this.reset();
    const F = match.fighters, charOf = (i) => F[i] && F[i].char.id;
    const need = DW.CONFIG.round.winsNeeded;
    if (match.introSkipped && this.skipSeen !== match) { this.skipSeen = match; this.skipIntro(); }   // Update 15: skipped (also via netplay)
    for (const e of events) {
      switch (e.type) {
        case 'attack': this.say(e.who, e.id[0] === 'j' ? 'airAttack' : /H/.test(e.id) ? 'attackHeavy' : 'attack', { char: charOf(e.who) }); break;
        case 'windup': this.say(e.who, 'slam', { char: charOf(e.who) }); break;
        case 'jc': this.say(e.who, 'airCombo', { char: charOf(e.who) }); break;
        case 'teleport': this.say(e.who, 'teleport', { char: charOf(e.who) }); break;
        case 'bounce': if (e.kind === 'ground') this.say(1 - e.who, 'groundBounce', { char: charOf(1 - e.who) }); break;
        case 'special': {
          const mv = F[e.who].char.moves[e.id] || {};
          if (mv.super === 3) this.say(e.who, 'l3', { char: charOf(e.who), move: mv });
          else if (mv.super === 1) this.say(e.who, 'l1', { char: charOf(e.who), move: mv });
          else if (!mv.grab) this.say(e.who, 'special', { char: charOf(e.who), move: mv });
          break;
        }
        case 'grabstart':
          if (e.super) break;   // super grabs speak through their own sequence cues
          this.say(e.who, e.command ? 'cmdgrab' : 'throw', { char: charOf(e.who) }); break;
        case 'voicecue': this.say(e.who, e.cue, { char: charOf(e.who) }); break;
        case 'hit': {
          if (e.attacker == null) break;
          const big = e.kind === 'super' || e.kind === 'crush' || e.dmg >= 700;
          this.say(e.who, big ? 'hurtBig' : 'hurt', { char: charOf(e.who) });
          if (e.counter) { this.say(e.attacker, 'counter', { char: charOf(e.attacker) }); this.announce('counterHit'); }
          else if (e.punish) this.say(e.attacker, 'punish', { char: charOf(e.attacker) });
          const mv = F[e.attacker].char.moves[e.move];
          if (mv && mv.kind === 'launcher') this.say(e.attacker, 'launcher', { char: charOf(e.attacker) });
          const c = match.combos && match.combos[e.attacker];
          if (c && c.hits >= 6 && !this.comboCalled[e.attacker]) { this.comboCalled[e.attacker] = 1; this.say(e.attacker, 'combo', { char: charOf(e.attacker) }); }
          break;
        }
        case 'comboend': this.comboCalled[e.who] = 0; if (e.hits >= 10) this.announce('bigCombo'); break;
        case 'counterstance': this.say(e.who, 'counter', { char: charOf(e.who) }); break;
        case 'tech': this.say(e.who, 'tech', { char: charOf(e.who) }); this.announce('throwEscape'); break;
        case 'shadowstep': this.say(e.who, 'shadowstep', { char: charOf(e.who) }); break;
        case 'break': this.say(e.who, 'breaker', { char: charOf(e.who) }); if (e.combo) this.announce('breakCall'); break;
        case 'trapset': case 'sealset': this.say(e.who, 'trapset', { char: charOf(e.who) }); break;
        case 'cinematic': this.say(e.who, 'finisherStart', { char: charOf(e.who) }); break;
        case 'matchintro': {   // Update 15: a strict SEQUENTIAL queue — VS call, P1 intro, P2 intro — each waits for the previous line
          const N = DW.ANNOUNCER.names;
          this.introQ = [];
          this.queueLine(() => this.announce('versus', { p1: N[e.p1] || e.p1, p2: N[e.p2] || e.p2 }, 0, true));
          this.queueLine(() => this.say(0, 'intro', { char: e.p1, force: true }));
          this.queueLine(() => this.say(1, 'intro', { char: e.p2, force: true }));
          break;
        }
        case 'round': {
          if (match.mode !== 'versus') break;
          const final = match.wins[0] === need - 1 && match.wins[1] === need - 1;
          if (this.introBusy()) this.queueLine(() => this.announce(final ? 'finalRound' : 'round', { n: e.round }, 0, true));   // never cut a character's intro
          else this.announce(final ? 'finalRound' : 'round', { n: e.round }); break;
        }
        case 'fight': if (match.mode === 'versus') { if (this.introBusy()) this.queueLine(() => this.announce('fight', {}, 0, true)); else this.announce('fight'); } break;
        case 'timelow': this.announce('timeLow'); break;
        case 'text': if (e.text === 'TIME' && e.big) this.announce('timeUp'); break;
        case 'ko': {
          const w = F[e.who], l = F[1 - e.who];
          this.say(l.id, over0(match, w) ? 'defeat' : 'ko', { char: l.char.id });
          if (match.mode !== 'versus') break;
          const name = DW.ANNOUNCER.names[w.char.id] || w.char.name;
          const perfect = w.health >= w.char.health;
          const over = match.wins[w.id] >= need;

<script>/* src/render/sword.js */
// DARK WAR — Sword animation primitives (Update 8, Akatsuki). Presentation only.
//
// A sword attack is NOT a sequence of snapshots. Every sword move names one primitive (move.swing). A primitive
// is four key states of the blade — guard → WIND-UP (end of startup) → STRIKE (end of active) → FOLLOW-THROUGH
// (40% into recovery) → guard again — and each key is { a: blade angle°, h: [hand angle° around the shoulder,
// hand distance] }. In between, the blade angle and the hand are interpolated in POLAR form around the shoulder,
// so the hands travel on arcs and the blade sweeps through every angle in between (never a jump), with phase-
// specific easing: ease-in-out wind-up (anticipation), ease-out strike (fast start, the cut "bites"), soft
// follow-through and smooth return. The blade has one fixed shape (never stretches), always starts at the top
// hand, and both arms are solved to the grip with 2-bone IK every frame, so the sword never floats.
// Angles: 0 = pointing forward (toward the opponent), 90 = straight up, -90 = straight down, 180 = backward.

  BLADE: 58, HANDLE: 13, UPPER: 19, FORE: 17,

  //   Water:   blade upright in front of the chest, BOTH hands together on the hilt (calm, defensive wall)
  GUARD: { N: { a: 28, h: [-34, 27] }, K: { a: 6, h: [14, 13] }, M: { a: 82, h: [-26, 22] } },

    horizontal: { wind: { a: 46, h: [-70, 15] },   hit: { a: -6, h: [-12, 35] },  follow: { a: -24, h: [-24, 31] }, trail: 'arc' },
    diagonal:   { wind: { a: 132, h: [96, 22] },   hit: { a: -42, h: [-36, 34] }, follow: { a: -62, h: [-52, 30] }, trail: 'arc' },
    vertical:   { wind: { a: 98, h: [104, 24] },   hit: { a: -58, h: [-24, 35] }, follow: { a: -72, h: [-46, 30] }, trail: 'arc' },
    overhead:   { wind: { a: 124, h: [112, 26] },  hit: { a: -72, h: [-28, 35] }, follow: { a: -82, h: [-56, 29] }, trail: 'arc' },
    rising:     { wind: { a: -152, h: [-104, 22] }, hit: { a: 82, h: [62, 33] },  follow: { a: 96, h: [80, 28] }, trail: 'arc' },
    low:        { wind: { a: 24, h: [-44, 15] },   hit: { a: -16, h: [-46, 35] }, follow: { a: -22, h: [-52, 30] }, trail: 'arc' },

    parry:      { wind: { a: 78, h: [12, 22] },    hit: { a: 84, h: [18, 24] },   follow: { a: 70, h: [6, 24] }, trail: 'none' },
    divethrust: { wind: { a: -24, h: [-14, 18] },  hit: { a: -56, h: [-56, 34] }, follow: { a: -56, h: [-56, 32] }, trail: 'line' },
    // Update 14 — Shin's stance specials
    flurry:     { wind: { a: 70, h: [14, 20] }, cuts: [{ a: -40, h: [-34, 35] }, { a: 62, h: [36, 31] }, { a: -8, h: [-10, 37] }], hit: { a: -8, h: [-10, 37] }, follow: { a: -26, h: [-24, 31] }, trail: 'arc' },

    glide:      { wind: { a: 86, h: [10, 23] },    hit: { a: -18, h: [-16, 36] }, follow: { a: -34, h: [-30, 31] }, trail: 'arc' },
    evade:      { stance: 'M', trail: 'none' },
    hold:       { stance: 'K', trail: 'none' },

  // Where the sword should be this frame (target), from the fighter's state.
  target(f) {
    const G = this.GUARD;
    if (f.state === 'attack' && f.move && f.move.swing && !f.seq) return this.atFrame(f, f.moveFrame);
    if (f.seq || f.seqPose) {   // L3 sequence: blade follows the attacker's sequence pose
      const p = f.seqPose || '';

      if (p === 'ak_after') return { a: -58, h: [-66, 30], phase: 'seq' };
      if (p === 'ak_lunge') return { a: 6, h: [-8, 36], phase: 'seq' };

    if (f.state === 'win' || f.cinePose === 'win' || f.cinePose === 'sheathe') return { a: -164, h: [-118, 12], phase: 'rest', sheathed: true };

        r.swordMem[id] = { a: out.a, h: out.h, t: r.t }; return out;
      }
      r.swordMem[id] = { a: T.a, h: T.h, t: r.t }; return T;
    }
    const k = 0.32;   // ~6-frame critically-smooth blend toward a new held angle
    const out = { a: mem.a + (T.a - mem.a) * k, h: [mem.h[0] + (T.h[0] - mem.h[0]) * k, mem.h[1] + (T.h[1] - mem.h[1]) * k], phase: T.phase, sheathed: T.sheathed && Math.abs(mem.a - T.a) < 8 };
    r.swordMem[id] = { a: out.a, h: out.h, t: r.t };
    return out;
  },

  // 2-bone IK (local coords): shoulder S → hand H. Elbow bends downward/outward.
  ik(S, H, a, b) {
    let dx = H[0] - S[0], dy = H[1] - S[1], d = Math.hypot(dx, dy) || 0.001;
    const maxD = a + b - 0.5, minD = Math.abs(a - b) + 1;

    const cos = DW.clamp((a * a + d * d - b * b) / (2 * a * d), -1, 1), al = Math.acos(cos), base = Math.atan2(dy, dx);

  },

  // Full geometry for a blade state + body points (local coords): grip hands, elbows, blade base/tip, curve.
  geometry(st, pts) {
    const N = pts.neck, sF = [N[0] + 2, N[1] - 5], sB = [N[0] - 4, N[1] - 4];
    const ha = st.h[0] * Math.PI / 180, r = Math.min(st.h[1], this.UPPER + this.FORE - 1.5);
    const top = [sF[0] + Math.cos(ha) * r, sF[1] + Math.sin(ha) * r];
    const ba = st.a * Math.PI / 180, u = [Math.cos(ba), Math.sin(ba)], n = [-u[1], u[0]];
    const low = [top[0] - u[0] * 8, top[1] - u[1] * 8];                  // second hand lower on the handle
    const armF = this.ik(sF, top, this.UPPER, this.FORE), armB = this.ik(sB, low, this.UPPER, this.FORE);
    const H = armF.H, L2 = [H[0] - u[0] * 8, H[1] - u[1] * 8];
    const pommel = [H[0] - u[0] * 11, H[1] - u[1] * 11], guard = [H[0] + u[0] * 3, H[1] + u[1] * 3];
    const base = [H[0] + u[0] * 4.5, H[1] + u[1] * 4.5], tip = [H[0] + u[0] * (4.5 + this.BLADE), H[1] + u[1] * (4.5 + this.BLADE)];
    return { sF, sB, H, L2, eF: armF.E, eB: this.ik(sB, L2, this.UPPER, this.FORE).E, u, n, pommel, guard, base, tip };
  },
};

// DARK WAR — Canvas renderer (portrait). Reads match state; never changes it.
// Fighters are drawn procedurally from a pose skeleton (PLACEHOLDER art, but each character has a
// distinct silhouette). Swapping in sprite/skeletal animation later only replaces drawFighter().

// Update 11: base values (desktop / landscape). Portrait phones subtract phoneShrink from the arena (main.fit).
DW.LAYOUT_BASE = Object.assign({ phoneShrink: 60 }, DW.LAYOUT);


DW.Renderer = class {
  constructor(canvas) {
    this.c = canvas; this.g = canvas.getContext('2d');
    this.cam = { x: 0, y: 0, scale: 1 };
    this.showBoxes = false; this.showHistory = false;
    this.hpGhost = [99999, 99999];

  // ---------------------------------------------------------------- camera
  updateCamera(match) {
    const [a, b] = match.fighters, L = DW.LAYOUT;

  // Update 12 — CINEMATIC FINISH overlay. Upper third only (the fighters stay visible below), letterbox, aura

  drawCinematicFinish(match) {
    const g = this.g, L = DW.LAYOUT, F = match.finish, w = match.fighters[F.att], t = F.t, H = L.arenaBottom - L.arenaTop;
    const col = (w.pal || w.char.palette).aura, out = Math.max(0, Math.min(1, (F.dur - t) / 18)), inn = Math.min(1, t / 10);
    g.save(); g.globalAlpha = out;
    const vg = g.createRadialGradient(L.W / 2, L.arenaTop + H * 0.55, H * 0.2, L.W / 2, L.arenaTop + H * 0.55, H * 0.9);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.7)'); g.fillStyle = vg; g.fillRect(0, L.arenaTop, L.W, H);
    const bar = 64 * inn; g.fillStyle = '#000'; g.fillRect(0, L.arenaTop, L.W, bar); g.fillRect(0, L.arenaBottom - bar, L.W, bar);
    const ty = L.arenaTop + Math.max(bar + 70, H * 0.24);
    // blade streak across the title line
    if (t >= 4) { const k = Math.min(1, (t - 4) / 8); const sx = -40 + (L.W + 80) * k;
      const sg = g.createLinearGradient(sx - 260, 0, sx, 0); sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(1, 'rgba(255,255,255,0.95)');
      g.fillStyle = sg; g.fillRect(sx - 260, ty - 2, 260, 4); g.fillStyle = col; g.globalAlpha = out * 0.5; g.fillRect(0, ty - 1, Math.min(L.W, sx), 2); g.globalAlpha = out; }
    // dark band behind the words

    g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    const word = 'FINISH', size = Math.round(Math.min(72, L.W / 6.2));
    // "CINEMATIC" — smaller line above, letters drop in (laid out with real letter widths)
    const top = 'CINEMATIC', topSize = Math.round(Math.min(26, L.W / 15)), gap = 3, topY = ty - size * 0.86 - 10;
    g.font = `bold italic ${topSize}px Georgia, serif`; const tws = [...top].map(c => g.measureText(c).width + gap), tw = tws.reduce((a, b) => a + b, 0);
    let px = L.W / 2 - tw / 2;
    for (let i = 0; i < top.length; i++) { const lt = t - 10 - i * 1.5, x = px + tws[i] / 2; px += tws[i]; if (lt < 0) continue; const k = Math.min(1, lt / 6);
      g.globalAlpha = out * k; g.fillStyle = col; g.fillText(top[i], x, topY - (1 - k) * 18); }
    // "FINISH" — huge, each letter slams from 2.6x with a red/cyan split, then settles
    g.font = `900 ${size}px "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif`; const wws = [...word].map(c => g.measureText(c).width + size * 0.06), ww = wws.reduce((a, b) => a + b, 0);
    px = L.W / 2 - ww / 2;

      g.save(); g.translate(x, ty); g.scale(sc, sc); g.globalAlpha = out * k;

      g.shadowColor = col; g.shadowBlur = 18; g.fillStyle = '#fff'; g.fillText(word[i], 0, 0); g.restore(); }
    // the final letter lands: underline flash

    if (land >= 0) { const k = Math.min(1, land / 10); g.globalAlpha = out * (1 - k * 0.6); g.fillStyle = col; g.fillRect(L.W / 2 - ww / 2 * k, ty + 12, ww * k, 3);

  drawPart(p) {

    if (p.kind === 'dust') { g.fillStyle = `rgba(160,130,120,${0.35 * a})`; g.beginPath(); g.arc(x, y, p.r * s * (1.6 - a), 0, Math.PI * 2); g.fill(); }

    else if (p.kind === 'crater') { g.fillStyle = `rgba(0,0,0,${0.6 * a})`; g.beginPath(); g.ellipse(x, y, p.r * s, p.r * 0.18 * s, 0, 0, Math.PI * 2); g.fill(); }

    else if (p.kind === 'rock') { g.fillStyle = p.color; g.globalAlpha = Math.min(1, a * 2); g.save(); g.translate(x, y); g.rotate(p.life * 0.3); g.fillRect(-p.r * s, -p.r * s * 0.7, p.r * 2 * s, p.r * 1.4 * s); g.restore(); g.globalAlpha = 1; }
    else if (p.kind === 'petal') { g.save(); g.translate(x, y); g.rotate(p.rot); g.scale(1, 0.55 + 0.45 * Math.sin(p.rot * 1.7)); g.globalAlpha = Math.min(1, a * 1.6); g.fillStyle = p.color; g.beginPath(); g.ellipse(0, 0, 4.2 * s, 2.4 * s, 0, 0, Math.PI * 2); g.fill(); g.restore(); g.globalAlpha = 1; }   // Update 11
    else if (p.kind === 'ember') { g.fillStyle = p.color; g.globalAlpha = a; g.fillRect(x - 2, y - 2, 4 * s, 4 * s); g.globalAlpha = 1; }
    else { g.strokeStyle = p.color; g.globalAlpha = a; g.lineWidth = p.w * s; g.lineCap = 'round'; g.beginPath(); g.moveTo(x, y); g.lineTo(x - p.vx * 2.4 * s, y + p.vy * 2.4 * s); g.stroke(); g.globalAlpha = 1; }
  }
  drawRing(r) {

  drawSlash(sl) {

  // Update 5 — Kasumi's teleport charges as a numeric counter ("TELEPORT 2 / 3") just under that player's health
  // bar, inside the top of the arena (above the fighters). It belongs to the HUD side (P1 left / P2 right), not
  // to wherever the fighter stands. A thin bar under it fills while the next charge recharges.
  // Update 7: Kasumi's teleport charges as a circle with the number inside. The outline fills CLOCKWISE as the
  // next charge recharges; each further charge that is recharging gets its own small ring beside it (its own
  // independent timer), so 2-3 charges recharging at once read clearly. HUD side, not fighter position.
  drawTeleportCounter(f, side) {

    const R = 17, cx = side === 0 ? 16 + R : L.W - 16 - R, cy = Math.max(L.hudBottom + 34, (this.panelBottom || 0) + 26), dir = side === 0 ? 1 : -1, TOP = -Math.PI / 2;
    const timers = tp.timers.slice().sort((a, b) => a - b), prog = (t) => DW.clamp(1 - t / tp.frames, 0, 1);

    g.beginPath(); g.arc(cx, cy, R + 5, 0, Math.PI * 2); g.fill();

      g.beginPath(); g.arc(cx, cy, R, TOP, TOP + Math.PI * 2 * p0); g.stroke(); g.globalAlpha = 1; }
    if (timers.length) {   // a bright head on the moving end of the outline

<script>/* src/render/finishfx.js */

  tick() {

    for (const t of this.texts) t.life--;

    if (this.captions) { for (const c of this.captions) c.life--; this.captions = this.captions.filter(c => c.life > 0); }
    this.texts = this.texts.filter(t => t.life > 0);

    this.ghosts = this.ghosts.filter(g => g.life > 0);
    for (const s of this.slashes) s.life--;
    for (const s of this.seals) s.life--; this.seals = this.seals.filter(s => s.life > 0);
    if (this.tint && --this.tint.life <= 0) this.tint = null;
    if (this.walls) { for (const w of this.walls) w.life--; this.walls = this.walls.filter(w => w.life > 0); }
    if (this.orbs) { for (const o of this.orbs) { if (o.grow !== undefined) o.grow++; else if (!o.hold || o.t < (o.form || 0) + o.dur) o.t++; if (o.ding) o.ding++; } this.orbs = this.orbs.filter(o => o.hold || o.t <= o.dur + 2); }

      const on = (t.id === 'boxes' && this.renderer.showBoxes) || (t.id === 'wloop' && this.watchLoop) || (t.id === 'wspeed' && (this.watchSpeed || 1) !== 1) || (t.id === 'history' && this.renderer.showHistory) || (t.id === 'meter' && match.training && match.training.infiniteMeter);
      g.fillStyle = on ? '#5a1a20' : '#1a1418'; g.fillRect(t.x, top + 6, t.w, 26);
      g.strokeStyle = '#5a1a20'; g.lineWidth = 1; g.strokeRect(t.x + 0.5, top + 6.5, t.w - 1, 25);
      if (t.id === 'tmode') { g.fillStyle = this.trialMode === 'modern' ? '#3a2a10' : '#1f2a3a'; g.fillRect(t.x + 1, top + 7, t.w - 2, 24); g.strokeStyle = '#ffd27a'; g.strokeRect(t.x + 0.5, top + 6.5, t.w - 1, 25); }
      g.fillStyle = t.id === 'tmode' ? '#ffd27a' : '#e9e3d6';
      const mOn = !!(match.training && match.training.infiniteMeter); if (t.id === 'meter') g.fillStyle = mOn ? '#ffd27a' : '#9a8c90';
      g.fillText(t.id === 'wspeed' ? 'SPEED: ' + (this.watchSpeed || 1) + '×' : t.id === 'wloop' ? 'LOOP: ' + (this.watchLoop ? 'ON' : 'OFF') : t.id === 'boxes' && this.mode === 'watch' ? 'BOXES: ' + (this.renderer.showBoxes ? 'ON' : 'OFF') : t.id === 'meter' ? '∞ METER: ' + (mOn ? 'ON' : 'OFF') : t.id === 'dummy' ? 'DUMMY: ' + (this.dummyLabel || '') : t.id === 'tmode' ? 'MODE: ' + (this.trialMode === 'modern' ? 'MODERN' : 'TRADITIONAL') + ' ⇄' : t.label, t.x + t.w / 2, top + 23);
    }
    if (this.mode === 'training' || this.mode === 'tutorial' || this.mode === 'trial') {
      const fi = match.lastFrameInfo;
      g.textAlign = 'left'; g.font = '11px ui-monospace, Menlo, monospace'; g.fillStyle = '#9a8c90';
      const y = L.arenaBottom - 12;
      g.textAlign = 'center';
      if (fi) {
        const adv = fi.advantage, tag = adv > 0 ? 'PLUS' : adv >= -3 ? 'SAFE' : 'PUNISHABLE';
        const txt = `${fi.name} · ${fi.startup}f startup · on block ${adv > 0 ? '+' : ''}${adv} ${tag}`;
        g.font = '11px ui-monospace, Menlo, monospace';
        const w = g.measureText(txt).width + 14;
        g.fillStyle = 'rgba(0,0,0,0.55)'; g.fillRect(L.W / 2 - w / 2, y - 12, w, 17);
        g.fillStyle = adv > 0 ? '#7dff9a' : adv >= -3 ? '#ffd27a' : '#ff6b5c'; g.fillText(txt, L.W / 2, y);
      }
    } else if (this.mode === 'watch') {
      g.fillStyle = '#9a8c90'; g.textAlign = 'center'; g.font = '11px system-ui';
      g.fillText(`WATCHING · CPU ${(this.watchLevels || ['hard', 'hard'])[0].toUpperCase()} vs CPU ${(this.watchLevels || ['hard', 'hard'])[1].toUpperCase()} · ${this.watchSpeed || 1}× · P / Esc = menu · F speed · H boxes · L loop · R restart`, L.W / 2, top + 50);
    } else if (this.twoPlayer) {
      g.fillStyle = '#9a8c90'; g.textAlign = 'center'; g.font = '11px system-ui';
      g.fillText('P1: WASD · J K L · Shift · Space      P2: Arrows · Num1 2 3 · Num0 · NumEnter', L.W / 2, top + 22);
    }
    if (!this.enabled && !this.editing) return;
    const st = this.stick, idle = !st.active || this.editing, SR = this.stickHome.r;
    const ox = idle ? this.stickHome.x : st.ox, oy = idle ? this.stickHome.y : st.oy;
    if (this.editing) {
      g.save(); g.setLineDash([6, 6]); g.strokeStyle = 'rgba(255,210,122,0.35)'; g.strokeRect(2, 2, L.W - 4, L.H - 4); g.restore();
    }
    if (this.moveStyle === 'dpad') { this.drawDpad(g, this.stickHome.x, this.stickHome.y, SR); }
    else this.drawStick(g, ox, oy, SR, st, idle);
    if (idle && !this.editing) { g.fillStyle = 'rgba(233,227,214,0.35)'; g.font = '11px system-ui'; g.textAlign = 'center';
      g.fillText(this.moveStyle === 'dpad' ? 'D-PAD' : this.moveStyle === 'locked' ? 'MOVE · LOCKED' : 'MOVE', this.stickHome.x, this.stickHome.y + SR + 14); }
    this.drawButtons(g, match);
  }

  drawStick(g, ox, oy, SR, st, idle) {
    g.strokeStyle = 'rgba(233,227,214,0.25)'; g.lineWidth = 2;
    g.beginPath(); g.arc(ox, oy, SR, 0, Math.PI * 2); g.stroke();
    g.fillStyle = 'rgba(233,227,214,0.05)'; g.fill();
    if (this.moveStyle === 'locked') {            // anchor marks show it won't move
      g.strokeStyle = 'rgba(233,227,214,0.18)';
      for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2; g.beginPath(); g.moveTo(ox + Math.cos(a) * (SR - 8), oy + Math.sin(a) * (SR - 8)); g.lineTo(ox + Math.cos(a) * SR, oy + Math.sin(a) * SR); g.stroke(); }
    }
    let kx = ox, ky = oy;
    if (!idle) { const dx = st.x - st.ox, dy = st.y - st.oy, d = Math.hypot(dx, dy) || 1, m = Math.min(d, SR); kx = ox + dx / d * m; ky = oy + dy / d * m; }
    g.fillStyle = idle ? 'rgba(201,74,58,0.5)' : 'rgba(201,74,58,0.9)';
    g.beginPath(); g.arc(kx, ky, SR * 0.44, 0, Math.PI * 2); g.fill();
  }

  drawDpad(g, cx, cy, R) {
    const d = this.stick.active && !this.editing ? this.stickDirs() : {}, w = R * 0.62, r = R;
    const arm = (dir, x, y, ww, hh, rot) => {
      const on = d[dir];
      g.fillStyle = on ? 'rgba(201,74,58,0.95)' : 'rgba(30,24,32,0.95)'; g.strokeStyle = on ? '#ffd27a' : 'rgba(233,227,214,0.35)'; g.lineWidth = 2;
      g.beginPath(); g.roundRect ? g.roundRect(x, y, ww, hh, 6) : g.rect(x, y, ww, hh); g.fill(); g.stroke();
      g.save(); g.translate(x + ww / 2, y + hh / 2); g.rotate(rot); g.fillStyle = on ? '#0b0910' : 'rgba(233,227,214,0.7)';
      g.beginPath(); g.moveTo(0, -w * 0.22); g.lineTo(w * 0.2, w * 0.1); g.lineTo(-w * 0.2, w * 0.1); g.fill(); g.restore();
    };
    arm('up', cx - w / 2, cy - r, w, r - w / 2 + 2, 0);
    arm('down', cx - w / 2, cy + w / 2 - 2, w, r - w / 2 + 2, Math.PI);
    arm('left', cx - r, cy - w / 2, r - w / 2 + 2, w, -Math.PI / 2);
    arm('right', cx + w / 2 - 2, cy - w / 2, r - w / 2 + 2, w, Math.PI / 2);
    g.fillStyle = 'rgba(30,24,32,1)'; g.fillRect(cx - w / 2 + 1, cy - w / 2 + 1, w - 2, w - 2);
  }

  drawButtons(g, match) {
    const L = DW.LAYOUT;
    const held = new Set([...this.pointers.values()].map(p => p.target)), kb = this.lastRead;
    const f0 = match.fighters[this.owner || 0];   // the fighter THIS device controls (P2 on a Wi-Fi guest phone)
    for (const b of this.buttons) {
      const on = held.has(b.id) || kb[b.id];
      const overFight = b.y - b.r < L.controlsTop && !this.editing;          // placed over the fight: see-through
      const short = b.cost && f0.meter < b.cost;                              // Level 1 / Ultimate not affordable yet
      const dim = !this.editing && short;
      const ssLive = b.id === 'dash' && !this.editing && f0.state === 'attack' && f0.canShadowStep && f0.canShadowStep();   // DASH would Shadow Step now
      g.globalAlpha = (dim ? 0.45 : 1) * (overFight ? 0.6 : 1);
      g.fillStyle = on ? b.color : 'rgba(20,16,22,0.9)';
      g.beginPath(); g.arc(b.x, b.y, b.r, 0, Math.PI * 2); g.fill();
      g.strokeStyle = b.color; g.lineWidth = 2.5; g.stroke();
      if (b.cost && !this.editing) {                                          // meter requirement ring
        const k = DW.clamp(f0.meter / b.cost, 0, 1);
        g.strokeStyle = k >= 1 ? b.color : 'rgba(150,120,200,0.9)'; g.lineWidth = 4;
        g.beginPath(); g.arc(b.x, b.y, b.r + 4, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * k); g.stroke();
        if (k >= 1) { g.globalAlpha = 0.35 + Math.sin(performance.now() / 160) * 0.25; g.lineWidth = 2; g.beginPath(); g.arc(b.x, b.y, b.r + 9, 0, Math.PI * 2); g.stroke(); g.globalAlpha = 1; }
      }
      if (b.id === 'brk' && !this.editing && f0.brk !== undefined) {         // Break gauge ring; pulses when a Break would work right now
        const B = DW.CONFIG.break, k = DW.clamp(f0.brk / B.cost, 0, 1), live = k >= 1 && f0.breakBlocker && !f0.breakBlocker(match.fighters[1 - (this.owner || 0)], match);
        g.strokeStyle = k >= 1 ? b.color : 'rgba(122,240,200,0.35)'; g.lineWidth = 4;
        g.beginPath(); g.arc(b.x, b.y, b.r + 4, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * k); g.stroke();
        if (live) { g.globalAlpha = 0.55 + Math.sin(performance.now() / 60) * 0.35; g.lineWidth = 4; g.beginPath(); g.arc(b.x, b.y, b.r + 10, 0, Math.PI * 2); g.stroke(); g.globalAlpha = (k >= 1 ? 1 : 0.45) * (overFight ? 0.6 : 1); }
        if (k < 1) g.globalAlpha = 0.45 * (overFight ? 0.6 : 1);
      }
      if (b.id === 'dash' && !this.editing) {                                 // shadow-step badge: lit when Dash = Shadow Step
        const bx = b.x + b.r * 0.72, by = b.y - b.r * 0.72, ready = f0.meter >= DW.CONFIG.shadowStep.cost;
        if (ssLive) { g.globalAlpha = 0.5 + Math.sin(performance.now() / 70) * 0.3; g.strokeStyle = '#c94a3a'; g.lineWidth = 4; g.beginPath(); g.arc(b.x, b.y, b.r + 6, 0, Math.PI * 2); g.stroke(); g.globalAlpha = 1; }
        g.fillStyle = ssLive ? '#c94a3a' : ready ? 'rgba(201,74,58,0.55)' : 'rgba(60,40,48,0.8)'; g.beginPath(); g.arc(bx, by, b.r * 0.36, 0, Math.PI * 2); g.fill();
        g.fillStyle = ssLive || ready ? '#fff2e0' : '#8a7a80'; g.font = `bold ${Math.round(b.r * 0.34)}px serif`; g.textAlign = 'center'; g.fillText('影', bx, by + b.r * 0.12);
      }
      g.fillStyle = on ? '#0b0910' : b.color; g.textAlign = 'center';
      g.font = `bold ${Math.round(b.r * (b.cost ? 0.5 : 0.62))}px Georgia, serif`; g.fillText(b.label, b.x, b.y + b.r * 0.12);
      g.font = 'bold 8px system-ui, sans-serif';
      g.fillText(b.cost && !this.editing ? (f0.meter >= b.cost ? 'READY' : (b.cost / 100) + ' BAR' + (b.cost > 100 ? 'S' : '')) : b.id === 'brk' && !this.editing && f0.brk >= DW.CONFIG.break.cost ? 'READY' : b.sub, b.x, b.y + b.r * 0.55);
      g.globalAlpha = 1;
    }
    if (this.editing) {
      if (this.bad > 0) this.bad--;
      for (const it of this.items()) {
        const isSel = it.id === this.sel, invalid = (this.drag && this.drag.it === it && this.drag.invalid) || (isSel && this.bad > 0);
        if (!isSel && !invalid) continue;
        g.save(); g.strokeStyle = invalid ? '#ff4b3e' : '#ffd27a'; g.lineWidth = 3; g.setLineDash(invalid ? [] : [5, 4]);
        g.beginPath(); g.arc(it.x, it.y, it.r + 7, 0, Math.PI * 2); g.stroke(); g.restore();
        if (isSel) {                                                        // resize handle
          const h = this.handlePos(it);
          g.fillStyle = '#ffd27a'; g.beginPath(); g.arc(h[0], h[1], 9, 0, Math.PI * 2); g.fill();
          g.strokeStyle = '#0b0910'; g.lineWidth = 2; g.beginPath(); g.moveTo(h[0] - 4, h[1] + 4); g.lineTo(h[0] + 4, h[1] - 4); g.moveTo(h[0] + 1, h[1] - 4); g.lineTo(h[0] + 4, h[1] - 4); g.lineTo(h[0] + 4, h[1] - 1); g.stroke();
        }
      }
    }
  }

};

</script>
<script>/* src/ui/tutorial.js */
// DARK WAR — Tutorials: a BEGINNER track (18 lessons, one mechanic at a time) and an optional
// ADVANCED track (19 lessons). Every lesson:
//   1. DEMONSTRATES the mechanic first (the game plays it for you — tap any attack to skip),
//   2. then lets you TRY it, checked against real gameplay EVENTS (works the same for touch and keyboard),
//   3. gives FEEDBACK when an input is wrong (hint(s, ev, m) → short message),
//   4. is repeatable; clears are saved (localStorage 'darkwar.tutorial').
// Text tokens like {L} or {FWD} are rewritten for the device you're using: "LIGHT" on touch, "LIGHT [J]" on keyboard.
var DW = (globalThis.DW = globalThis.DW || {});

// --------------------------------------------------------------------------- helpers
const T = {
  hitBy: (ev, test) => ev.filter(e => e.type === 'hit' && e.attacker === 0 && test(e)),
  my: (ev, type) => ev.filter(e => e.type === type && e.who === 0),
  count: (s, k, n, cap) => (s[k] = Math.min(cap, (s[k] || 0) + n)),
  held: (s, k, cond, need) => { if (cond) s[k] = (s[k] || 0) + 1; return Math.min(need, s[k] || 0) >= need ? 1 : 0; },
  // demo script: [frames, {inputs}] pairs with fwd/back meaning toward/away from the opponent
  script: (steps) => ({
    i: 0, n: 0, done: false,
    next(m) {
      const f = DW.emptyInputFrame(), me = m.fighters[0], opp = m.fighters[1];
      if (this.i >= steps.length) { this.done = true; return f; }
      const [len, inp] = steps[this.i], fwd = opp.x > me.x ? 'right' : 'left', back = fwd === 'right' ? 'left' : 'right';
      for (const k in inp) f[k === 'fwd' ? fwd : k === 'back' ? back : k] = inp[k];
      if (++this.n >= len) { this.i++; this.n = 0; }
      return f;
    },
  }),
};
DW.TutorialHelpers = T;

// --------------------------------------------------------------------------- BEGINNER
DW.LESSONS_BEGINNER = [
  { id: 'b-move', free: true, title: 'BASIC MOVEMENT', dummy: 'stand',
    text: 'Move with {MOVE}. Your fighter always turns to face the opponent. Just move around for a moment.',
    demo: T.script([[40, { fwd: true }], [10, {}], [40, { back: true }]]),
    check(s, ev, m) { const st = m.fighters[0].state; if (st === 'walkF' || st === 'walkB') s.t = (s.t || 0) + 1; return [Math.min(60, s.t || 0), 60]; },
    unit: 'moving' },
  { id: 'b-walk', free: true, title: 'WALK FORWARD & BACK', dummy: 'stand',
    text: 'Hold {FWD} to walk toward the dummy, then hold {BACK} to walk away. Walking back also BLOCKS — remember that!',
    demo: T.script([[45, { fwd: true }], [45, { back: true }]]),
    check(s, ev, m) { const st = m.fighters[0].state; if (st === 'walkF') s.f = (s.f || 0) + 1; if (st === 'walkB') s.b = (s.b || 0) + 1; return [(s.f >= 30 ? 1 : 0) + (s.b >= 30 ? 1 : 0), 2]; } },
  { id: 'b-jump', free: true, title: 'JUMP & CROUCH', dummy: 'stand',
    text: 'Push the stick UP to jump (keyboard: {J}) — UP-FORWARD and UP-BACK jump diagonally. Hold {DOWN} to crouch. Jump once, then crouch for a moment.',
    demo: T.script([[2, { jump: true }], [50, {}], [40, { down: true }]]),
    check(s, ev, m) { if (T.my(ev, 'jump').length) s.j = 1; if (m.fighters[0].state === 'crouch') s.c = (s.c || 0) + 1; return [(s.j || 0) + (s.c >= 20 ? 1 : 0), 2]; },
    hint(s, ev, m) { if (s.c && s.c < 20 && m.fighters[0].state !== 'crouch' && !s.j) return 'Keep holding {DOWN} a little longer.'; } },
  { id: 'b-light', title: 'LIGHT ATTACKS', dummy: 'stand',
    text: 'Walk close and press {L}. Light attacks are FAST and short. Hit the dummy 3 times.',
    demo: 'L L L',
    check(s, ev) { T.count(s, 'n', T.hitBy(ev, e => /L/.test(e.move) && !/^j/.test(e.move)).length, 3); return [s.n || 0, 3]; },
    hint(s, ev, m) {
      if (T.hitBy(ev, e => /H/.test(e.move)).length) return 'That was HEAVY — this lesson wants {L}.';
      const f = m.fighters[0]; if (f.state === 'attack' && f.movePhase() === 'recovery' && !f.moveHit && Math.abs(m.fighters[1].x - f.x) > 80) return 'Too far away — walk closer first.';
    } },
  { id: 'b-heavy', title: 'HEAVY ATTACKS', dummy: 'stand',
    text: 'Press {H}. Heavy attacks are SLOWER but hit harder and reach farther. Hit the dummy 3 times.',
    demo: 'H',
    check(s, ev) { T.count(s, 'n', T.hitBy(ev, e => /^5?H$|^2H$/.test(e.move)).length, 3); return [s.n || 0, 3]; },
    hint(s, ev) { if (T.hitBy(ev, e => /L/.test(e.move)).length) return 'That was LIGHT — press {H}.'; } },
  { id: 'b-special', title: 'SPECIAL ATTACKS', dummy: 'stand',
    text: 'Specials are {S} + a direction — no circles or motions. Try {S} alone, then {FWD} + {S}.',
    demo: T.script([[2, { special: true }], [70, {}], [3, { fwd: true }], [2, { fwd: true, special: true }], [70, {}]]),
    check(s, ev, m) { s.ids = s.ids || {}; for (const e of T.my(ev, 'special')) if (/S$/.test(e.id) && !/^j/.test(e.id)) s.ids[e.id] = 1; return [Math.min(2, Object.keys(s.ids).length), 2]; },
    hint(s, ev) { if (s.ids && Object.keys(s.ids).length === 1 && T.my(ev, 'special').length && Object.keys(s.ids).length < 2) return 'Same special again — now hold {FWD} while pressing {S}.'; } },
  { id: 'b-block', free: true, title: 'BLOCKING', dummy: 'poke',
    text: 'The dummy will attack you. Hold {BACK} (away from it) to block. Block 3 attacks.',
    demo: T.script([[200, { back: true }]]),
    check(s, ev) { T.count(s, 'n', T.my(ev, 'block').length, 3); return [s.n || 0, 3]; },
    hint(s, ev) { if (ev.some(e => e.type === 'hit' && e.who === 0)) return 'Got hit! Hold {BACK} — away from the dummy — BEFORE its attack lands.'; } },
  { id: 'b-grab', title: 'GRABS & ESCAPES', dummy: (s) => (s.g ? 'thrower' : 'block'),
    text: 'Blocking can\'t stop a grab. Walk close to the blocking dummy and press {G}. Then the dummy will grab YOU — press {G} the moment you\'re caught to escape.',
    demo: T.script([[30, { fwd: true }], [2, { grab: true }], [90, {}]]),
    check(s, ev) { if (T.my(ev, 'grabstart').length) s.g = 1; if (s.g && T.my(ev, 'tech').length) s.t = 1; return [(s.g || 0) + (s.t || 0), 2]; },
    hint(s, ev, m) { if (s.g && !s.t && ev.some(e => e.type === 'grabstart' && e.who === 1)) return 'Grabbed! Press {G} right away to break free.'; if (!s.g && T.my(ev, 'grabstart').length === 0 && ev.some(e => e.type === 'block' && e.who === 1)) return 'It blocks attacks — use {G} up close instead.'; } },
  { id: 'b-dash', free: true, title: 'DASHING', dummy: 'stand',
    text: 'Press {D} to dash forward fast. {BACK} + {D} hops back. Jump and press {D} to AIR DASH. Do all three.',
    demo: T.script([[2, { dash: true }], [40, {}], [2, { back: true, dash: true }], [40, {}], [2, { jump: true }], [12, {}], [2, { dash: true }], [50, {}]]),
    check(s, ev, m) { for (const e of T.my(ev, 'dash')) { if (e.air) s.a = 1; else if (e.back) s.b = 1; else s.f = 1; } if (m.fighters[0].state === 'backdash') s.b = 1; return [(s.f || 0) + (s.b || 0) + (s.a || 0), 3]; } },
  { id: 'b-combo', title: 'BASIC COMBOS', dummy: 'stand',
    textModern: 'MODERN LIGHT AUTO-COMBO: keep tapping {L} while your attacks HIT and the whole Light combo plays — through the launcher, the air string and a finisher. Land a 3-hit combo.',
    text: 'A combo = attacks that connect with no gap. Do {L}, {L}, {H} in a steady rhythm. Early presses are remembered — don\'t mash.',
    demo: 'L L H',
    check(s, ev) { for (const e of T.my(ev, 'comboend')) if (e.hits >= 3) s.ok = 1; return [s.ok || 0, 1]; },
    hint(s, ev) { for (const e of T.my(ev, 'comboend')) if (e.hits < 3) return `${e.hits} hit${e.hits > 1 ? 's' : ''} — a little faster between buttons. {L}, {L}, {H}.`; } },
  { id: 'b-launch', title: 'LAUNCHERS & AIR ATTACKS', dummy: 'stand',
    textModern: 'Keep tapping {L}: the auto-combo reaches the LAUNCHER, jumps after them and attacks in the air for you. (Manually: {DOWN}+{H}, then {J}, then Air {L}, Air {H}.)',
    text: '{DOWN} + {H} is the LAUNCHER. When it hits, press {J} to chase them, then {L}, {H} in the air.',
    demo: 'L H 2H J jL jH',
    // ordered, event-driven (the old Lesson 5 bug was a hidden 6-hit requirement)
    check(s, ev) {
      for (const e of ev) {
        if (e.type === 'text' && e.text === 'LAUNCH' && e.who === 0) { s.launched = 1; s.jumped = 0; s.air = 0; }
        if (s.launched && e.type === 'jump' && e.who === 0) s.jumped = 1;
        if (s.jumped && e.type === 'hit' && e.attacker === 0 && /^j/.test(e.move)) s.air = Math.min(2, (s.air || 0) + 1);
        if (s.air >= 2) s.ok = 1;
        if (e.type === 'comboend' && e.who === 0 && !s.ok) s.launched = s.jumped = s.air = 0;
      }
      return [s.ok ? 4 : (s.launched || 0) + (s.jumped || 0) + Math.min(2, s.air || 0), 4];
    },
    hint(s, ev) { if (s.launched && !s.jumped && T.my(ev, 'comboend').length) return 'Press {J} right after the launcher hits — the jump aims itself.'; } },
  { id: 'b-l1', title: 'METER & LEVEL 1', dummy: 'stand', meter: true,
    textModern: 'Fighting fills your METER (3 bars). Press the {L1} button to spend 1 bar on a Level 1 Super. Hit the dummy with it.',
    text: 'Fighting fills your METER (3 bars). Press {L1} (or {H}+{S} together) to spend 1 bar on a Level 1 Super. Hit the dummy with it.',

// The route a guide-driven lesson demonstrates (character combo guide).
DW.heavyRouteNotation = function (char) {

  return char.assist.heavy.map(st => typeof st === 'object' ? st.super : st).filter(Boolean).map(st => tok[st]).join(' ');
};
DW.lessonGuide = function (L, char) {
  if (L.guideSS) return char.combos.filter(c => / SS /.test(' ' + c.notation + ' ') && !/L3|L1/.test(c.notation)).sort((a, b) => a.notation.length - b.notation.length)[0];
  if (L.guide) return char.combos.find(c => c.level === 'Intermediate' && !c.start) || char.combos[0];

DW.TUTORIAL_TRACKS = { beginner: DW.LESSONS_BEGINNER, advanced: DW.LESSONS_ADVANCED };
DW.LESSONS = DW.LESSONS_BEGINNER;   // legacy alias

// Saved progress
DW.TutorialProgress = {
  load() { try { return JSON.parse(localStorage.getItem('darkwar.tutorial')) || {}; } catch (e) { return {}; } },
  mark(id) { const p = this.load(); p[id] = 1; try { localStorage.setItem('darkwar.tutorial', JSON.stringify(p)); } catch (e) {} },
};

DW.Tutorial = class {
  constructor(track = 'beginner', index = 0, scheme = 'traditional') {
    this.track = track; this.list = DW.TUTORIAL_TRACKS[track]; this.index = index; this.scheme = scheme;
    this.state = {}; this.doneTimer = 0; this.phase = 'try'; this.feedback = null; this.fbTimer = 0;
  }
  get lesson() { return this.list[this.index]; }
  dummyMode() { const d = this.lesson.dummy; return typeof d === 'function' ? d(this.state) : d; }
  view() {
    const l = this.lesson;
    const raw = (this.state.stage2 && l.text2) || (this.scheme === 'modern' && l.textModern) || l.text;
    return { index: this.index, total: this.list.length, track: this.track, scheme: this.scheme, title: l.title, text: DW.tutText(raw, this.scheme), done: this.doneTimer > 0,
      progress: this.progress, phase: this.phase, feedback: this.fbTimer > 0 ? DW.tutText(this.feedback, this.scheme) : null, guide: this.guideText };
  }
  update(events, match) {
    if (this.fbTimer > 0) this.fbTimer--;
    if (this.phase === 'demo') return null;
    if (this.doneTimer > 0) { this.doneTimer--; return this.doneTimer === 0 ? 'next' : null; }
    const [cur, need] = this.lesson.check(this.state, events, match);
    this.progress = need > 1 ? `${cur}/${need}` : '';
    if (cur >= need) {
      this.doneTimer = 100; this.fbTimer = 0; DW.TutorialProgress.mark(this.lesson.id);
      DW.Sound && DW.Sound.play('lesson'); return 'clear';
    }
    if (this.lesson.hint) {
      const h = this.lesson.hint(this.state, events, match);
      if (h && (h !== this.feedback || this.fbTimer < 30)) { this.feedback = h; this.fbTimer = 150; }
    }
    return null;
  }
};

// Device-aware input words. Touch: "LIGHT". Keyboard: "LIGHT [J]".
DW.tutText = function (text, scheme = 'traditional') {
  if (!text) return text;
  const G = DW.game, kb = G && G.controls && G.controls.device === 'keyboard', km = G && G.controls && G.controls.keymap.p1;
  const key = (a) => { if (!kb || !km || !km[a]) return ''; const c = km[a][0] || ''; return ' [' + c.replace(/^Key|^Digit/, '').replace(/Left$|Right$/, '').replace('Arrow', '') + ']'; };

    L: 'LIGHT' + key('light'), H: 'HEAVY' + key('heavy'), S: 'SPECIAL' + key('special'), G: 'GRAB' + key('grab'), J: kb ? 'JUMP' + key('jump') : 'UP on the stick',
    D: 'DASH' + key('dash'), SS: 'DASH' + key('dash'), BRK: 'BREAK 結' + key('brk'),
    L1: scheme === 'modern' ? 'LV1' + key('super1') : 'HEAVY+SPECIAL together' + (kb ? key('heavy') + key('special') : '') + ' (or LV1)',
    L3: scheme === 'modern' ? 'ULT' + key('super3') : 'DOWN+HEAVY+SPECIAL' + (kb ? key('down') + key('heavy') + key('special') : '') + ' (or ULT)',
    FWD: 'FORWARD' + (kb ? key('right') : ''), BACK: 'BACK' + (kb ? key('left') : ''), DOWN: 'DOWN' + key('down'), UP: kb ? 'UP' + key('jump') : 'UP on the stick',
    MOVE: kb ? 'the keys' + key('left') + key('right') : 'the stick (left thumb)',
  };
  return text.replace(/\{(\w+)\}/g, (_, k) => W[k] || k);
};

<script>/* src/ui/dashcompare.js */
// DARK WAR — Tutorial side-by-side: NORMAL DASH vs SHADOW STEP (Update 3).
// Two REAL simulations (same character, same camera framing, same start positions) run in sync and are
// drawn stacked in the arena — the game is portrait-only, so stacking keeps both large and readable.
//   top:    the fighter presses DASH in neutral          → normal dash, no meter used
//   bottom: the fighter hits with Forward + S, then presses DASH → Shadow Step, 1 bar spent
// Both use the actual in-game moves, effects and animations; nothing is pre-recorded.
var DW = (globalThis.DW = globalThis.DW || {});

DW.DashCompare = class {
  constructor(charId, colorIndex, scheme) {
    const L = DW.LAYOUT;
    this.off = document.createElement('canvas'); this.off.width = L.W; this.off.height = L.H;
    this.r = new DW.Renderer(this.off); this.r.settings = { shake: false, effects: 'full' };
    this.charId = charId; this.colorIndex = colorIndex; this.scheme = scheme;
    this.loops = 0; this.reset();
  }
  reset() {
    const mk = () => {
      const m = new DW.Match({ mode: 'training', p1: this.charId, p2: 'ren', colors: [this.colorIndex, this.charId === 'ren' && !this.colorIndex ? 1 : 0], training: { autoRefill: true, infiniteMeter: false } });
      m.fighters[0].x = -110; m.fighters[1].x = 10; m.fighters[0].meter = 100;
      return { m, fx: new DW.Effects(this.r) };
    };
    this.A = mk(); this.B = mk();
    this.t = 0;
  }
  input(side, t) {
    const f = DW.emptyInputFrame();
    if (side === 'A') { if (t >= 26 && t < 28) { f.right = true; f.dash = true; } }
    else {
      if (t < 14) f.right = t >= 4;                                   // walk into range
      if (t === 14 || t === 15) { f.right = true; f.special = true; }  // Forward + S
      const p = this.B.m.fighters[0];
      if (t >= 22 && p.state === 'attack' && p.moveHit && !this.ssDone) { f.dash = true; }   // DASH during the special = Shadow Step
    }
    return f;
  }
  step() {
    for (const side of ['A', 'B']) {
      const S = this[side];
      S.m.step([this.input(side, this.t), DW.emptyInputFrame()]);
      const ev = S.m.drainEvents();
      if (side === 'B' && ev.some(e => e.type === 'shadowstep')) this.ssDone = true;
      S.fx.ingest(ev, S.m); S.fx.continuous(S.m); S.fx.tick();
    }
    if (++this.t > 120) { this.loops++; this.ssDone = false; this.reset(); }
  }
  draw(g) {
    const L = DW.LAYOUT, top = L.arenaTop + 132, H = L.arenaBottom - top, half = H / 2;   // below the lesson panel
    g.save(); g.fillStyle = '#07060a'; g.fillRect(0, L.arenaTop, L.W, L.arenaBottom - L.arenaTop);
    const srcH = 240, srcY = L.arenaBottom - srcH;
    const rows = [['A', 'NORMAL DASH', 'free · no meter', '#ffd27a'], ['B', 'SHADOW STEP', 'costs 1 bar · DASH during a special', '#ff6a5a']];
    rows.forEach(([side, label, sub, col], i) => {
      const S = this[side]; this.r.updateCamera(S.m); this.r.draw(S.m, S.fx, null);
      const y = top + i * half, scale = (half - 4) / srcH, w = L.W * scale, x = (L.W - w) / 2;
      g.drawImage(this.off, 0, srcY, L.W, srcH, x, y + 2, w, half - 4);
      g.fillStyle = 'rgba(8,6,12,0.8)'; g.fillRect(x + 6, y + 8, 220, 40);
      g.fillStyle = col; g.font = 'bold 17px Georgia, serif'; g.textAlign = 'left'; g.fillText(label, x + 14, y + 27);
      g.fillStyle = '#e9e3d6'; g.font = '11px system-ui'; g.fillText(sub, x + 14, y + 42);
      const f = S.m.fighters[0];                                       // that fighter's meter, so the cost is visible
      g.fillStyle = 'rgba(8,6,12,0.8)'; g.fillRect(x + w - 112, y + 8, 104, 22);
      g.fillStyle = '#2a2030'; g.fillRect(x + w - 104, y + 15, 88, 8);
      g.fillStyle = f.meter >= 100 ? '#a66bff' : '#5a4a6a'; g.fillRect(x + w - 104, y + 15, 88 * Math.min(1, f.meter / 100), 8);
      g.fillStyle = '#e9e3d6'; g.font = '9px system-ui'; g.textAlign = 'right'; g.fillText(f.meter >= 100 ? '1 BAR' : 'SPENT', x + w - 10, y + 26);
    });
    g.strokeStyle = '#3a2a30'; g.beginPath(); g.moveTo(0, top + half); g.lineTo(L.W, top + half); g.stroke();
    g.restore();
  }
};

<script>/* src/ui/trials.js */
// DARK WAR — Combo Trials: perform each Combo Guide route on the training dummy, step by step.
// Progress is tracked from real game events (which move hit, jumps, Jump Cancels, Shadow Steps, Supers).
//
// Update 8 — Modern AND Traditional. Every trial keeps ONE objective (the same moves, in the same order, as
// one unbroken combo); only the instructions and the buttons change:
//   • Traditional: the real inputs — directions + buttons, chains, cancels, H+S / Down+H+S super chords.
//   • Modern: wherever the character's Modern auto-combo produces the next move, the step just says "L" (or "H")
//     — mash it, the game picks the move; supers use the LV1 / ULT buttons; everything else is the same input.
// DW.trialSteps() derives the Modern steps by replaying the exact auto-combo rules the fighter uses
// (fighter.pickMove), and the automated tests perform every trial both ways with those instructions.
var DW = (globalThis.DW = globalThis.DW || {});

// The move id a trial token produces (needs the previous move for chains such as 5L → 5L2 → 5L3).
DW.trialMoveId = function (char, tok, prevId, inAir) {
  const mv = char.moves;
  if (tok === 'L') { const p = prevId && mv[prevId]; return p && p.chainL && mv[p.chainL] ? p.chainL : '5L'; }
  if (tok === 'H') return '5H';
  if (tok === 'S') return '5S';
  if (tok === 'jS') return 'j5S';
  if (tok === 'L1' || tok === 'L3') return (inAir && mv['j' + tok] ? 'j' : '') + tok;
  return tok;
};

const ARROW = { 2: '↓', 6: '→', 4: '←', 1: '↙', 3: '↘', 8: '↑' };
// Traditional (manual) wording for one token.
DW.trialTradLabel = function (tok) {
  const air = /^j[1-9]?[LHS]/.test(tok) && tok !== 'J' && tok !== 'JC';
  const core = air ? tok.slice(1) : tok;
  const m = /^([1-9]?)([LHS])$/.exec(core);
  if (m) return (air ? 'air ' : '') + (m[1] && m[1] !== '5' ? ARROW[m[1]] + '+' : '') + m[2];
  return ({ J: 'JUMP ↑', fJ: 'JUMP ↗', JC: 'JUMP CANCEL ↑', SS: 'DASH (影 Shadow Step)', AD: 'AIR DASH', L1: 'H+S', L3: '↓+H+S', jL1: 'air H+S', G: 'GRAB', bG: '←+GRAB', P: 'S+↓ (puppet)' })[tok] || tok;
};

// Steps for a combo in a scheme: [{ tok, label, auto, btn, move, press }]
//   press = the exact buttons to press for this step (used by the Modern bot and shown to the player).
DW.trialSteps = function (charId, notation, scheme) {
  const char = DW.CHARACTERS[charId], A = char.assist, toks = notation.trim().split(/\s+/);
  const out = []; let prev = null, run = null, air = false, connected = false, stance = 'N';
  for (const tok of toks) {
    const isJump = tok === 'J' || tok === 'fJ' || tok === 'JC';
    let id = DW.trialMoveId(char, tok, prev, air);
    if (stance !== 'N' && !air && char.moves[stance + id]) id = stance + id;   // stance characters (Akatsuki): same input, stance version
    let step = { tok, label: DW.trialTradLabel(tok), auto: false, move: id, press: null };
    if (scheme === 'modern') {
      // Modern supers: dedicated buttons
      if (tok === 'L1' || tok === 'jL1') step = Object.assign(step, { label: 'LV1', press: { super1: true } });
      else if (tok === 'L3') step = Object.assign(step, { label: 'ULT', press: { super3: true } });
      // Modern auto-combo: same rules as Fighter.pickMove — only mid-combo, only a neutral L/H press
      let autoBtn = null;
      if (A && connected && (tok !== 'fJ')) {
        for (const btn of ['light', 'heavy']) {
          const R = A[btn]; if (!R) continue;
          const i = run && run.btn === btn ? run.i : R.indexOf(prev);
          if (i < 0) continue;
          let nx = R[i + 1];
          if (nx && typeof nx === 'object') nx = nx.super && char.moves[nx.super] ? nx.super : nx.else;   // trials always have meter
          const want = tok === 'J' ? 'J' : tok === 'JC' ? 'JC' : id;
          if (nx === want) { autoBtn = btn; run = { btn, i: i + 1 }; break; }
        }
        // neutral SPECIAL mid-combo = the character's combo special
        if (!autoBtn && A.special && id === A.special && !air && !/^j/.test(id) && prev && !/^j/.test(prev)) { step = Object.assign(step, { label: 'S', press: { special: true }, autoSpecial: true }); }
      }
      if (autoBtn) step = Object.assign(step, { auto: true, btn: autoBtn, label: autoBtn === 'light' ? 'L' : 'H', press: { [autoBtn]: true } });
      else if (!step.autoSpecial) run = null;
    }
    if (stance !== 'N' && id !== DW.trialMoveId(char, tok, prev, air)) step.label = (char.stances[stance].kanji) + ' ' + step.label;   // a stance version of the move: show the stance
    out.push(step);
    const md = char.moves[id]; if (md && (md.toStance || md.toStanceEnd)) stance = md.toStance || md.toStanceEnd;
    if (!isJump && tok !== 'SS' && tok !== 'AD') { prev = id; connected = true; }
    if (tok === 'SS' || tok === 'AD') { run = null; }
    if (isJump) air = true; else if (/^j/.test(id)) air = true; else if (tok !== 'SS' && tok !== 'AD' && !/^L[13]$/.test(tok)) air = false;
    if (tok === 'fJ') connected = false;
  }
  return out;
};

// A bot that performs a trial exactly as the instructions for `scheme` say (Modern: mash L where it says L).
DW.trialBot = function (charId, combo, scheme, opts = {}) {
  const steps = DW.trialSteps(charId, scheme === 'modern' && combo.modern ? combo.modern : combo.notation, scheme);
  return new DW.ComboBot(steps.map(s => s.tok).join(' '), Object.assign({ press: steps.map(s => s.press) }, scheme === 'modern' ? { pursuitGap: 4 } : {}, opts));   // Modern: mashing L reaches the pursuit jump sooner
};

// Saved clears: { charId: { index: { modern: 1, traditional: 1 } } }
// Update 15: progress is keyed by the combo's NAME (stable when the list is reordered). Saves from before Update 15
// were keyed by list position — they are migrated once with the old order below (renamed routes mapped).
DW.TRIAL_LEGACY = {"ren": ["Low starter (Update 3 chain)", "Jump-in → ground (air-to-ground)", "Grounded basics", "First launcher", "Jump Cancel route", "Double Jump Cancel", "Shadow Step extension", "Spike bounce loop", "Dive kick → Shadow Step", "Level 1 confirm", "Level 3 confirm"], "onimaru": ["Air Level 1 finish (Update 5)", "Heavy chain (Update 3)", "Falling hammer → Jishin (air-to-ground)", "Armored basics", "First launcher", "Jump Cancel route", "Double Jump Cancel", "Command grab → Shadow Step", "Air grab bounce conversion", "Level 1 confirm", "Level 3 confirm"], "kasumi": ["Low-high chain (Update 3)", "Shadow drop (air-to-ground)", "Triple kunai", "Swallow slash", "First launcher", "Jump Cancel route", "Double Jump Cancel", "Hien-zan → Shadow Step", "Shadow dive loop", "Level 1 confirm", "Level 3 confirm"], "akatsuki": ["Neutral basics", "First launcher", "Into Flame: three-cut Renka", "Flame cleave bounce", "Jump Cancel route", "Flame lunge → Shadow Step", "Full cycle: Flame → Water sweep", "Cleave bounce + Jump Cancel", "Level 1 confirm", "Level 3 confirm"], "kurogane": ["Talisman basics", "First launcher", "Low start", "Seal setup → Kai!", "Onibi → Shadow Step", "Jump Cancel route", "Seal burst → Shadow Step", "Forward Rakurai ender", "Level 1 confirm", "Level 3 confirm"], "ayakashi": ["Strings basics", "Puppet slash ender", "Puppet sweep ender", "Puppet slash → launcher", "Air dive ender", "Jump Cancel route", "Puppet ascension (Shadow Step)", "Full string ascension", "Level 1 confirm", "Level 3 confirm"]};
DW.TRIAL_RENAMED = { 'Low starter (Update 3 chain)': 'Low starter → launcher', 'Heavy chain (Update 3)': 'Heavy chain → launcher', 'Air Level 1 finish (Update 5)': 'Air Level 1 finish',
  'Low-high chain (Update 3)': 'Low-high chain → launcher', 'Shadow drop (air-to-ground)': 'Shadow drop (air-to-ground + Jump Cancel)', 'kurogane:Low start': 'Low start → launcher', 'Strings basics': 'Strings launcher' };
DW.TrialProgress = {
  migrate(p) {
    let changed = false;
    for (const ch of Object.keys(p)) { const old = p[ch] || {}, legacy = DW.TRIAL_LEGACY[ch] || [];
      for (const k of Object.keys(old)) { if (!/^\d+$/.test(k)) continue; const nm = legacy[+k]; delete old[k]; changed = true; if (!nm) continue;
        const to = DW.TRIAL_RENAMED[ch + ':' + nm] || DW.TRIAL_RENAMED[nm] || nm; old[to] = Object.assign(old[to] || {}, p[ch][k] || {}, (p.__raw && p.__raw[ch] && p.__raw[ch][k]) || {}); } }
    return changed;
  },
  load() {
    let p; try { p = JSON.parse(localStorage.getItem('darkwar.trials')) || {}; } catch (e) { p = {}; }
    const raw = JSON.parse(JSON.stringify(p)); p.__raw = raw;
    const changed = this.migrate(p); delete p.__raw;
    if (changed) try { localStorage.setItem('darkwar.trials', JSON.stringify(p)); } catch (e) {}
    return p;
  },
  key(char, i) { const c = DW.CHARACTERS[char]; return typeof i === 'number' ? (c.combos[i] ? c.combos[i].name : String(i)) : i; },
  mark(char, i, scheme) { const p = this.load(), k = this.key(char, i); ((p[char] = p[char] || {})[k] = p[char][k] || {})[scheme] = 1; try { localStorage.setItem('darkwar.trials', JSON.stringify(p)); } catch (e) {} },
  get(char, i) { const p = this.load(), k = this.key(char, i); return (p[char] && p[char][k]) || {}; },
};

DW.Trials = class {
  constructor(charId, index = 0, scheme = 'traditional') { this.charId = charId; this.scheme = scheme; this.set(index); }
  get list() { return DW.CHARACTERS[this.charId].combos; }
  set(i) {
    this.index = (i + this.list.length) % this.list.length;
    this.combo = this.list[this.index];
    this.setScheme(this.scheme);
    this.pos = 0; this.state = 'ready'; this.timer = 0; this.lastMatched = null; this.attempts = this.attempts || 0; this.feedback = null; this.seen = new Set();
  }
  // switching modes keeps the trial you're on (and every saved clear); only the instructions change
  setScheme(scheme) {
    this.scheme = scheme;
    this.steps = DW.trialSteps(this.charId, this.combo.modern && scheme === 'modern' ? this.combo.modern : this.combo.notation, scheme);
    this.tokens = this.steps.map(s => s.tok);
    this.pos = 0; this.state = 'ready'; this.lastMatched = null; this.feedback = null; this.seen = new Set();
  }
  // does event e satisfy step k?
  matches(k, e) {
    const t = this.tokens[k], mv = e.move || '', want = this.steps[k].move;
    const md = DW.CHARACTERS[this.charId].moves[want];
    if (md && !md.hitbox && !md.projectile && !md.trap && !md.grab && !md.seq && !md.counter && !md.puppet && !md.detonate)   // stance changes / steps: they never hit, so performing them is the step
      return (e.type === 'special' || e.type === 'attack') && e.id === want;
    // Update 9: a puppet attack immediately followed by a Shadow Step (Ayakashi's air routes) — the puppet strikes
    // on its own timer, so she Shadow Steps BEFORE its hit lands. The step is done when the puppet's attack starts;
    // the route still has to keep the combo alive to clear.
    if (md && md.puppet && md.puppetCmd && md.puppetCmd.attack && this.tokens[k + 1] === 'SS') return e.type === 'puppetatk';
    switch (t) {
      case 'L': return e.type === 'hit' && mv === want && mv !== this.lastMatched;
      case 'J': case 'fJ': return e.type === 'jump';
      case 'JC': return e.type === 'jc';
      case 'SS': return e.type === 'shadowstep';
      case 'AD': return e.type === 'dash' && e.air;
      case 'L1': case 'jL1': return e.type === 'super' && e.level === 1;
      case 'L3': return e.type === 'super' && e.level === 3;
      case 'G': case 'bG': return e.type === 'grabstart';
      default: return (e.type === 'hit' || e.type === 'grabstart') && (mv === want || mv === t);
    }
  }
  wrong(msg) { if (this.state === 'going') { this.state = 'wrong'; this.timer = 0; this.feedback = msg; this.attempts++; } }
  update(events, match) {
    if (this.state === 'clear') { if (++this.timer > 100) { this.set(this.index + 1); return 'next'; } return null; }
    if ((this.state === 'dropped' || this.state === 'wrong') && ++this.timer > 70) { this.pos = 0; this.state = 'ready'; this.feedback = null; this.seen = new Set(); this.lastMatched = null; }
    for (const e of events) {
      const mine = (e.who === 0 && e.type !== 'hit') || (e.type === 'hit' && e.attacker === 0);
      if (e.type === 'comboend' && e.who === 0 && this.pos > 0 && this.state === 'going') {
        if (this.pos >= this.tokens.length) { this.state = 'clear'; this.timer = 0; this.feedback = null; DW.TrialProgress.mark(this.charId, this.index, this.scheme); DW.Sound && DW.Sound.play('lesson'); return 'clear'; }
        this.state = 'dropped'; this.timer = 0; this.attempts++; this.lastMatched = null;
        this.feedback = `Combo ended after step ${this.pos}. Next was: ${this.steps[this.pos].label}`;
        return 'dropped';
      }
      if (!mine || this.state === 'dropped' || this.state === 'wrong' || this.pos >= this.tokens.length) continue;
      if (this.matches(this.pos, e)) {
        if (this.pos === 0) this.state = 'going';
        this.seen.add(this.steps[this.pos].move); if (e.move) this.seen.add(e.move);
        this.pos++; this.lastMatched = e.move || null;
      } else if (e.type === 'hit' && this.pos > 0 && this.state === 'going' && e.move && !this.seen.has(e.move) && !e.proj) {
        // a different attack landed in the middle of the route (not a later hit of a move already done): wrong input
        const name = (DW.CHARACTERS[this.charId].moves[e.move] || {}).name || e.move;
        this.wrong(`Wrong move: expected ${this.steps[this.pos].label}, you did ${name}.`);
      }
    }
    return null;
  }
  view() {
    const done = DW.TrialProgress.get(this.charId, this.index);
    return { char: DW.CHARACTERS[this.charId], index: this.index, total: this.list.length, combo: this.combo, tokens: this.tokens, steps: this.steps, scheme: this.scheme,
      pos: this.pos, state: this.state, attempts: this.attempts, feedback: this.feedback, cleared: done };
  }
};
