<script>/* src/core/config.js */
// DARK WAR — global tunables. Everything balance-related lives here or in character data.
// Units: pixels (world space) and frames (60 per second). Y is height above the ground (up = positive).
var DW = (globalThis.DW = globalThis.DW || {});

DW.CONFIG = {
  FPS: 60,
  STAGE_HALF_WIDTH: 620,        // walls at -620 / +620
  MAX_SEPARATION: 600,          // camera limit
  GRAVITY: 0.75,
  modernAssistScale: 0.85,   // Update 3: damage multiplier for moves picked by the Modern combo assist
  MAX_FALL_SPEED: 20,
  INPUT_BUFFER_FRAMES: 8,       // how long a button press is remembered
  CHORD_FRAMES: 2,              // Heavy+Special pressed within this many frames = Super input

  combo: {
    launcherLoopCap: 2,   // Update 12: max Down Heavy relaunches per combo (L → H → 2H loops)
    damageFullHits: 3, damageStepPerHit: 0.10, damageMinScale: 0.35,
    hitstunFullHits: 4, hitstunStepPerHit: 0.04, hitstunMinScale: 0.60,
    juggleGravityPerHit: 0.035, juggleGravityMax: 1.7,
    superMinScale: 0.55,           // supers never scale below this
    groundBouncesPerCombo: 1,
    wallBouncesPerCombo: 1,
  },

  jumpCancel: { allowancePerCombo: 2, launcherPursuitCountsAsJC: false },

  // Meter economy (Update 7). Every source is tuned on its own; all values are per point of the move's
  // base damage unless noted. 1 bar = 100. Before/after numbers: node tests/meter_report.js
  meter: {
    barSize: 100, maxBars: 3,
    // Update 15: every normal-play source ×1.8 (meter felt too slow after Update 7's cut). Supers still build none.
    hit: { normal: 0.0153, special: 0.0216, grab: 0.0198 },  // attacker, on hit (U7: 0.0085 / 0.012 / 0.011; before U7 0.06)
    perHit: 4.5,              // flat amount per hit, so fast low-damage characters aren't starved (U7: 2.5)
    comboFullHits: 3,         // the first 3 hits of a combo build full meter...
    comboStep: 0.14,          // ...then each later hit builds 14% less...
    comboMin: 0.15,           // ...down to 15%
    repeatScale: 0.5,         // the same move used again in one combo builds half as much each time
    comboCap: 100,            // most meter one combo can ever build for the attacker (1 bar; U7: 0.6)
    taken: 0.0162,            // defender, x damage actually taken (U7: 0.009)
    takenComboCap: 60,        // most meter the defender can build from one combo (U7: 35)
    blockAttacker: 0.0144, blockDefender: 0.009,   // x the move's base damage (U7: 0.008 / 0.005)
  },

  // Update 7 — KEKKAI BREAK (結界, "sealing barrier"): the defender's combo/pressure escape. Its own gauge,
  // separate from meter. All numbers configurable; see docs/STATUS.md for the design.
  break: {
    max: 100, cost: 100, start: 100,  // one full gauge = one Break; starts the MATCH full, carries between rounds
    fillPerDamage: 0.013,             // refills from damage you take (≈ 77% of a 10,000 HP life bar for a full gauge)
    fillPerSecond: 0.25,              // plus a slow trickle while the round is on (400 s alone)
    minComboHits: 2,                  // a combo can be broken once it has 2+ hits (not a single poke)
    fromBlockstun: true,              // also breaks blocked pressure
    freeze: 16,                       // dramatic freeze on activation (both fighters)
    startup: 14, active: 4, total: 45, // barrier bursts on frame 14 (after the freeze); the breaker is committed until frame 45
    invuln: 20,                        // breaker can't be hit through startup + burst
    // Timing rule this creates: an attacker who keeps attacking (or whose last hit was a slow heavy/special) is caught
    // by the burst; one who STOPS after a light and holds back recovers in time to guard it, then punishes.
    radius: 185, height: 240,         // burst reach
    repel: { vx: 12, vy: 8.5, frames: 38 },  // a caught attacker is thrown clear (invulnerable, no follow-up: back to neutral)
    guarded: { vx: 7, blockstun: 10 },        // an attacker who was GUARDING only slides back and can punish the recovery
    punish: { guarded: 20, whiff: 14 },       // Update 15: extra committed frames (and counter-hit state) after a guarded / missed Break
  },

  shadowStep: {
    cost: 100, frames: 15, actionableFrom: 6, invulnFrames: 5,
    speed: 17, airSpeed: 17, spacing: 52,
  },

  hitstop: { light: 6, heavy: 9, launcher: 11, special: 10, grab: 12, super: 7 },
  counterHitHitstunBonus: 1.3,

  throw: { techWindow: 10, techPush: 7, techRecovery: 16 },  // universal grab: escape by pressing Grab within 10f of being caught

  knockdownFrames: 45, getupInvulnFrames: 10, airTechInvulnFrames: 8,

  round: {
    cineFinish: 150, /* Update 12: CINEMATIC FINISH beat (frames) after a lethal Level 3, before the round ends */ seconds: 99, winsNeeded: 2, koPause: 150 },
};

</script>
<script>/* src/core/input.js */
// DARK WAR — device-agnostic input.
// Keyboard, touch, CPU and (later) network all produce the same InputFrame each sim frame.
var DW = (globalThis.DW = globalThis.DW || {});

DW.BUTTONS = ['light', 'heavy', 'special', 'dash', 'shadow', 'jump', 'grab', 'super1', 'super3', 'brk'];

DW.emptyInputFrame = function () {
  return { left: false, right: false, up: false, down: false,
           light: false, heavy: false, special: false, dash: false, shadow: false, jump: false, grab: false, super1: false, super3: false, brk: false };
};

DW.InputState = class {
  constructor() {
    this.prev = DW.emptyInputFrame();
    this.cur = DW.emptyInputFrame();
    this.lastPress = {}; this.pressSnap = {};
    for (const b of [...DW.BUTTONS, 'up']) { this.lastPress[b] = -9999; this.pressSnap[b] = DW.emptyInputFrame(); }
    this.history = [];
  }

  // stamp = the fighter's own clock (pauses during hitstop), so buffered presses survive freezes
  feed(frame, stamp, simFrame) {
    this.prev = this.cur;
    this.cur = Object.assign(DW.emptyInputFrame(), frame);
    for (const b of DW.BUTTONS) if (this.cur[b] && !this.prev[b]) { this.lastPress[b] = stamp; this.pressSnap[b] = this.cur; }
    if (this.cur.up && !this.prev.up) this.lastPress.up = stamp;
    const sig = DW.inputSignature(this.cur);
    const top = this.history[this.history.length - 1];
    if (!top || top.sig !== sig) {
      this.history.push({ sig, frame: simFrame === undefined ? stamp : simFrame });
      if (this.history.length > 24) this.history.shift();
    }
  }

  buffered(b, now) { return now - this.lastPress[b] <= DW.CONFIG.INPUT_BUFFER_FRAMES; }
  age(b, now) { return now - this.lastPress[b]; }
  consume(b) { this.lastPress[b] = -9999; }
  jumpBuffered(now) { return this.buffered('jump', now) || this.buffered('up', now); }
  consumeJump() { this.consume('jump'); this.consume('up'); }

  // Direction held now, or (if nothing is held now) the direction held when the button was pressed.
  dirFor(b, facing) {
    const now = this.cur, s = this.pressSnap[b] || now;
    const src = (now.left || now.right || now.down || now.up) ? now : s;
    const fwd = facing > 0 ? src.right && !src.left : src.left && !src.right;
    const back = facing > 0 ? src.left && !src.right : src.right && !src.left;
    const down = now.down || s.down;
    return { down, fwd, back, up: src.up };
  }
  downFor(b) { return this.cur.down || !!(this.pressSnap[b] && this.pressSnap[b].down); }
  forward(facing) { return facing > 0 ? this.cur.right && !this.cur.left : this.cur.left && !this.cur.right; }
  back(facing) { return facing > 0 ? this.cur.left && !this.cur.right : this.cur.right && !this.cur.left; }
  down() { return this.cur.down; }
};

DW.inputSignature = function (f) {
  const h = f.left ? -1 : f.right ? 1 : 0, v = f.down ? -1 : f.up ? 1 : 0;
  let s = String([[1, 2, 3], [4, 5, 6], [7, 8, 9]][v + 1][h + 1]);
  if (f.light) s += 'L'; if (f.heavy) s += 'H'; if (f.special) s += 'S';
  if (f.grab) s += 'G'; if (f.super1) s += '¹'; if (f.super3) s += '³'; if (f.dash) s += 'D'; if (f.shadow) s += '影'; if (f.jump) s += 'J'; if (f.brk) s += '結';
  return s;
};

</script>

var DW = (globalThis.DW = globalThis.DW || {});
DW.clamp = DW.clamp || ((v, lo, hi) => Math.max(lo, Math.min(hi, v)));

  // How far a near-horizontal body is lowered so it lies ON the ground instead of hovering at hip height.
  lyingDrop(rot, y) {
    if (!rot) return 0;
    const h = DW.clamp((Math.abs(Math.sin(rot)) - 0.5) / 0.5, 0, 1);
    return 46 * h * DW.clamp(1 - y / 90, 0, 1);

  },

  solveOrigin(w, facing, scale, rot, l) {
    let x = l[0], y = l[1];
    if (rot) { const c = Math.cos(rot), s = Math.sin(rot), yy = y - 60; [x, y] = [x * c - yy * s, x * s + yy * c + 60]; }
    const ox = w[0] - x * facing * scale;
    let oy = w[1] - y * scale;
    for (let i = 0; i < 24; i++) oy = w[1] - y * scale + this.lyingDrop(rot, oy);   // converges geometrically
    return [ox, oy];
  },

DW.Seq = {
  smooth(t) { t = Math.max(0, Math.min(1, t)); return t * t * (3 - 2 * t); },
  channel(keys, name, t, fallback) {
    let k0 = null, k1 = null;
    for (const k of keys) { if (k[name] === undefined) continue; if (k.f <= t) { if (!k0 || k.f >= k0.f) k0 = k; } else if (!k1 || k.f < k1.f) k1 = k; }
    if (!k0) return fallback;
    if (!k1) return k0[name];
    const u = this.smooth((t - k0.f) / (k1.f - k0.f)), a = k0[name], b = k1[name];
    if (Array.isArray(a)) return a.map((x, i) => x + (b[i] - x) * u);
    return a + (b - a) * u;
  },
  latest(keys, name, t) { let v, f = -1; for (const k of keys) { if (k.f <= t && k[name] !== undefined && k.f >= f) { v = k[name]; f = k.f; } } return v; },
  // interpolated pose between the surrounding pose keys
  pose(keys, name, t, fallback) {
    let k0 = null, k1 = null;
    for (const k of keys) { if (k[name] === undefined) continue; if (k.f <= t) { if (!k0 || k.f >= k0.f) k0 = k; } else if (!k1 || k.f < k1.f) k1 = k; }
    const P = DW.POSES, a = P[k0 ? k0[name] : fallback] || P.idle;
    if (!k0 || !k1) return { pts: a, name: k0 ? k0[name] : fallback };
    return { pts: DW.Pose.mix(a, P[k1[name]] || a, this.smooth((t - k0.f) / (k1.f - k0.f))), name: k0[name] };
  },
  // Shadow clones for a sequence frame: each clone has a life [from, to], a position relative to the sequence
  // origin (x forward, y altitude), a pose that blends a -> b, and fades in/out. Pure data -> renderer.
  clones(list, t, S, owner) {
    const out = [];
    for (const c of list) {
      if (t < c.from || t > c.to) continue;
      const u = (t - c.from) / Math.max(1, c.to - c.from), fade = Math.min(1, (t - c.from) / 4, (c.to - t) / 6);
      const P = DW.POSES, pa = P[c.pose] || P.idle, pb = P[c.pose2 || c.pose] || pa;
      out.push({ x: S.x0 + S.dir * (c.x + (c.dx || 0) * u), y: c.y + (c.dy || 0) * u, facing: c.flip ? -S.dir : S.dir, pts: DW.Pose.mix(pa, pb, this.smooth(Math.min(1, u * 2))), alpha: 0.75 * Math.max(0, fade), rot: c.rot || 0 });
    }
    return out;
  },
  resolveAY(v, start) {
    if (v === 'start') return start;
    if (typeof v === 'string' && v.startsWith('start+')) return start + parseFloat(v.slice(6));
    return v;
  },
  // Exact damage the sequence will deal if nothing interrupts it (used to know up front whether a Level 3 is lethal)
  predictDamage(def, comboHits, isSuper, releaseDamage) {
    const cc = DW.CONFIG.combo; let hits = comboHits, total = 0;
    const scaleAt = (h) => { let s = Math.max(cc.damageMinScale, 1 - cc.damageStepPerHit * Math.max(0, h - cc.damageFullHits)); return isSuper ? Math.max(cc.superMinScale, s) : s; };
    for (const k of def.keys) if (k.dmg) { hits++; total += Math.round(k.dmg * scaleAt(hits)); }
    hits++; total += Math.round(releaseDamage * scaleAt(hits));
    return total;
  },
};

</script>
<script>/* src/characters/common.js */
// DARK WAR — shared helpers for character data. Characters are pure data; this only fills defaults.
var DW = (globalThis.DW = globalThis.DW || {});
DW.CHARACTERS = DW.CHARACTERS || {};

// Universal throw (Grab button) — every character gets one. A quick, conventional throw:
// beats blocking, escapable by pressing Grab within the tech window, can't hit airborne or stunned opponents.
DW.universalThrow = (o = {}) => ({
  name: 'Throw', desc: 'Universal grab. Beats blocking. Escape it by pressing Grab within 10 frames. Hold back to throw backward.', input: 'Grab',
  kind: 'throw', grab: 'ground', throwTech: true, startup: 5, active: 3, recovery: 24, pose: 'reach',
  hitbox: { x: 8, y: 20, w: o.range || 46, h: 100 }, damage: o.damage || 900,
  seq: DW.SEQUENCES.throw, seqBack: DW.SEQUENCES.throwBack,
});

DW.defineCharacter = function (def) {
  if (!def.moves['5G']) def.moves['5G'] = DW.universalThrow(def.throw);
  for (const [id, m] of Object.entries(def.moves)) {
    m.id = id;
    if (m.active === undefined) m.active = 1;
    if (m.recovery === undefined) m.recovery = 10;
    if (m.damage === undefined) m.damage = 0;
    if (m.hitstun === undefined) m.hitstun = 20;
    if (m.blockstun === undefined) m.blockstun = 12;
    if (m.height === undefined) m.height = 'mid';
    if (/^j/.test(id)) m.air = true; else if (!m.hidden) m.ground = true;
    if (m.super) { m.kind = 'super'; m.meterCost = m.super === 3 ? 300 : 100; m.superFreeze = m.superFreeze || (m.super === 3 ? 60 : 36); }
    if (/S$/.test(id) || m.special) m.kind = m.kind || 'special';
    if (m.seq && m.seq.release && m.damage === 0) m.damage = (m.seq.keys || []).reduce((a, k) => a + (k.dmg || 0), 0) + (m.seq.release.damage || 0);
  }
  DW.CHARACTERS[def.id] = def;
  return def;
};

// Combo notation in plain words for players (the test bot still uses the compact tokens internally).
// Damage as shown in move lists ("2×300" for multi-projectile moves like Hishi-kunai).
DW.moveDamageText = (m, sep = ' (last ') => {
  if (m.multi) return `${m.multi.count}×${m.damage}${m.final ? sep + m.final.damage + (sep.includes('(') ? ')' : '') : ''}`;
  if (Array.isArray(m.projectile)) return m.projectile.length + '×' + m.projectile[0].damage;
  return m.damage || (m.projectile && m.projectile.damage) || (m.trap && m.trap.damage) || 0;
};
// Colour variation i (0 = default) — merged over the base palette so every field always exists.
DW.paletteFor = (char, i) => Object.assign({}, char.palette, (char.palettes || [])[(i || 0) - 1] || {});
DW.colorCount = (char) => 1 + (char.palettes || []).length;
DW.TOKEN_WORDS = {
  L: 'L', H: 'H', '2L': 'Down + L', '2H': 'Down + H', S: 'S', '5S': 'S', '6S': 'Forward + S', '4S': 'Back + S', '2S': 'Down + S',
  jL: 'Air L', jH: 'Air H', jS: 'Air S', j5S: 'Air S', j6S: 'Air Forward + S', j4S: 'Air Back + S', j2S: 'Air Down + S', j8S: 'Air Up + S',
  J: 'Jump', fJ: 'Forward Jump', '6H': 'Forward + H', '1S': 'Down-Back + S', '3S': 'Down-Forward + S', JC: 'Jump Cancel', SS: 'Shadow Step', L1: 'H + S (Super)', L3: 'Down + H + S (Ultimate)', G: 'Grab', bG: 'Back + Grab',
};
DW.prettyToken = (t) => DW.TOKEN_WORDS[t] || t;
DW.prettyNotation = (n) => n.split(' ').map(DW.prettyToken).join(' → ');

</script>

<script>/* src/core/fighter.js */
// DARK WAR — Fighter: state machine, movement, dashes, jumps, specials, Shadow Step, supers, cancels.
// Pure simulation: no drawing, no DOM, no randomness. Runs identically in the browser and in Node tests.
var DW = (globalThis.DW = globalThis.DW || {});

DW.GROUND_ACTIONABLE = ['idle', 'walkF', 'walkB', 'crouch'];
DW.clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

DW.Fighter = class {
  constructor(id, charDef, x, match) {

  }
  clearMove() {

  }

  setState(s) {

  }
  setStance(st, why) {
    if (this.stance === st) return;
    this.stance = st;
    if (this.match && this.match.emit) this.match.emit({ type: 'stance', who: this.id, stance: st, why: why || 'change', x: this.x, y: this.y });
  }
  get M() { return this.char.movement; }
  get bars() { return Math.floor(this.meter / DW.CONFIG.meter.barSize); }
  isActionableGround() { return DW.GROUND_ACTIONABLE.includes(this.state); }

  hurtbox() {
    const hb = this.char.hurtboxes;

    if (this.air) return hb.air;
    if (this.state === 'attack' && this.move && this.move.lowProfile && this.inRange(this.move.lowProfile.f)) return this.move.lowProfile.box;   /* Update 12: slides */

  }

  movePhase() {

  }
  inRange(r) { return r && this.moveFrame >= r[0] && this.moveFrame <= r[1]; }

  isInvulnerable() {

    if (this.state === 'shadowstep' && this.stateFrame <= DW.CONFIG.shadowStep.invulnFrames) return true;
    if (this.state === 'repelled' || (this.state === 'break' && this.stateFrame <= (this.brkKind === 'raw' ? DW.CONFIG.break.startup + DW.CONFIG.break.active : DW.CONFIG.break.invuln))) return true;

  addBreak(v) { this.brk = DW.clamp(this.brk + v, 0, DW.CONFIG.break.max); }

  startMove(id) {

    // Update 10: a range-limited cross-up teleport decides ONCE, at the start, whether it crosses (close) or just
    // advances (far) — so the destination mist is always truthful and the outcome predictable.
    if (m.teleport && m.teleport.crossRange) { const o = this.match.opponentOf(this); this.tpCross = Math.abs(o.x - this.x) <= m.teleport.crossRange; }
    if (m.teleport) { const o = this.match.opponentOf(this); this.match.emit({ type: 'tpcue', who: this.id, x: this.teleportTarget(m.teleport, o), y: this.y, frames: m.teleport.frame }); }

    if (!chaining || m.air) this.chainUsed.clear();
    if (!m.air && m.kind !== 'special') this.chainUsed.add(id);

    if (m.air) { this.airMovesUsed.add(id); if (m.airGroup) this.airMovesUsed.add('g:' + m.airGroup); }   // airGroup: one move of the group per airtime (Kurogane's directional Rakurai)
    if (!this.air) this.vx = 0;

      this.addMeter(-m.meterCost);
      this.match.startSuperFreeze(this, m);
    }
    if (m.kind === 'special' || m.super) this.match.emit({ type: 'special', who: this.id, id, x: this.x, y: this.y });
    else this.match.emit({ type: 'attack', who: this.id, id, x: this.x });       // presentation hook (voice grunts)
    if (m.windup) this.match.emit({ type: 'windup', who: this.id, x: this.x, y: this.y });
    if (m.jumpWarn) this.match.emit({ type: 'cmdwarn', who: this.id, frames: m.startup, name: m.name });   // jumpable command grab: telegraph it
  }

  // ---------------------------------------------------------------- per-frame update
  // Update 4 — teleport charges (Kasumi). Each spent charge has its OWN recharge timer; full at round start.
  resetTeleports() {
    const T = this.char.teleportCharges;
    this.tp = T ? { max: T.max, charges: T.max, timers: [], frames: Math.round(T.rechargeSeconds * 60) } : null;
  }
  tickTeleports(match) {

  }
  update(opp, match) {

    if (this.bound > 0 && this.hitstop <= 0) this.bound--;

  }

  // ---------------------------------------------------------------- Update 7: Kekkai Break
  // Why it can or can't be used right now (null = it can). Shown to the player and used by the CPU.
  breakBlocker(opp, match) {
    const B = DW.CONFIG.break;
    if (this.brk < B.cost) return 'gauge';
    if (match.roundState !== 'fight' || match.cinematic) return 'state';
    const stunned = this.state === 'hitstun' || this.state === 'airhit', blocking = this.state === 'blockstun';

    if (!stunned && !(blocking && B.fromBlockstun) && !DW.Fighter.RAW_BREAK_STATES.includes(this.state)) return 'state';

    if (combo.active) combo.broken = true;

  runBreak(opp, match) {

      match.entities = match.entities.filter(e => !(e.owner === opp.id && Math.abs(e.x - this.x) < B.radius * 1.4));

  runState(opp, match) {
    const inp = this.input;

      case 'break': this.runBreak(opp, match); break;
      case 'repelled':   // thrown clear by a Break: can't act or be hit until it lands and recovers
        if (!this.air) { this.vx *= 0.75; if (this.stateFrame >= DW.CONFIG.break.repel.frames) this.setState('idle'); }

        break;
      case 'jumpsquat':
        this.vx = 0;
        if (this.stateFrame >= this.jumpSquatLen) this.leaveGround(opp);
        break;
      case 'air':
        this.tryAirActions(opp, match);
        break;
      case 'fall':   // helpless after an air special: can't act until landing
        break;
      case 'dash': {
        const d = this.char.dash.ground;
        if (this.stateFrame <= d.frames) this.vx = d.speed * this.facing * (1 - this.stateFrame / (d.frames * 2.2));
        else this.vx *= d.decel;

        // count resets only when the dashes end, so it can never exceed `chain`. Independent of teleport charges.
        if (d.chain && (this.dashCount || 1) < d.chain && this.stateFrame >= d.chainFrom && this.input.buffered('dash', this.clock) && !this.input.back(this.facing)) {

        else this.vx *= d.decel;

          this.airDashesLeft = 0;
          match.emit({ type: 'text', who: this.id, text: 'AIR RECOVER', small: true });
        }

        this.vx = 0; this.vy = 0;
        break;
      case 'techrecover':           // pushed apart after a throw escape

        if (this.stateFrame >= DW.CONFIG.throw.techRecovery) this.setState('idle');
        break;
      case 'knockdown':
        this.vx *= 0.8;
        if (this.stateFrame >= DW.CONFIG.knockdownFrames) { this.setState('idle'); this.invuln = DW.CONFIG.getupInvulnFrames; }
        break;
      case 'ko': case 'win': case 'cine':
        this.vx *= 0.85;
        break;
    }
  }

  runAttack(opp, match) {
    const m = this.move;
    if (this.seq) { this.runSeq(match); return; }
    // Update 9 — CHARGED SPECIALS (move.charge): if the Special button is still held when the move reaches
    // charge.at, the move holds there (fully vulnerable, can't cancel) and builds charge. Releasing — or reaching
    // charge.max — resumes the move with the highest level reached (charge.levels[i].t = frames needed).
    // A quick tap never reaches the hold, so the uncharged move is frame-for-frame unchanged.
    if (m.charge && this.chargeLv === undefined && this.moveFrame === m.charge.at) {
      const C = m.charge, lvOf = (t) => { let l = 0; C.levels.forEach((L, i) => { if (t >= L.t) l = i; }); return l; };
      if (this.input.cur.special && this.chargeT < C.max) {

        const lv = lvOf(this.chargeT);
        if (lv > this.chargeShown) { this.chargeShown = lv; match.emit({ type: 'chargelv', who: this.id, lv, x: this.x + this.facing * 40, y: this.y + 90 }); }
        if (!this.air) this.vx *= 0.7;
        return;
      }
      this.chargeLv = lvOf(this.chargeT);
      if (this.chargeT > 0) match.emit({ type: 'chargefire', who: this.id, lv: this.chargeLv, x: this.x + this.facing * 40, y: this.y + 90 });
    }

    // the direction arrives within 2 frames (e.g. S a frame before the Down-Back diagonal registers).
    if (this.lateDir > 0) { this.lateDir--; const d = this.input.dirFor('special', this.facing), mv = this.char.moves;

      if (nid && this.moveStance && this.moveStance !== 'N' && mv[this.moveStance + nid]) nid = this.moveStance + nid;   // Update 14: stance version (Shin)

    if (m.endOnHit && (this.moveHit || this.moveBlocked) && this.moveFrame <= m.startup + m.active) this.moveFrame = m.startup + m.active + 1;   /* Update 12: slides stop on contact */
    const f = this.moveFrame;

    let moving = false;
    if (m.motion) for (const seg of m.motion) {
      if (f < seg.f[0] || f > seg.f[1]) continue;
      if (seg.untilHit && this.moveHit) continue;

      if (seg.vx !== undefined) this.vx = seg.vx * this.facing;
      if (seg.vy !== undefined) { this.vy = seg.vy; if (seg.vy > 0 && !this.air) { this.air = true; this.y = Math.max(this.y, 1); } }

    if (m.teleport && f === m.teleport.frame) this.doTeleport(m.teleport, opp, match);

    if (m.trap && f === m.trap.frame) match.spawnTrap(this, m.trap);
    if (m.seal && f === m.seal.frame) match.spawnSeal(this, m.seal);                      // Update 8: Kurogane
    if (m.detonate && f === m.detonate.frame) match.detonate(this, (m.pillar || this.char.moves['6S'].pillar), m.detonate.now);   // (Update 12: the air Kai! uses the same pillar as Kai!)
    if (m.puppetCmd && f === m.puppetCmd.frame) DW.Puppet.command(this, m.puppetCmd, match);   // Update 8: Ayakashi
    if (m.arc && f >= (m.arc.aim || m.arc.from) && f <= m.arc.to) this.runArc(m.arc, f, opp, match);   // Update 9/11: Ayakashi's Kage-nui
    if (m.reel && f >= m.reel.from && f <= m.reel.from + m.reel.frames) this.runReel(m.reel, f, opp, match);   // Update 9: Ito-tsuri
    if (this.tryCancels(opp, match)) return;
    // Update 5 — follow-up window: after a teleport has resolved, the rest of its recovery can be cancelled into
    // any normal action (attacks, throw, another teleport if a charge is left, jump). Until then: committed.
    const ff = m.followFrom && (this.fromHit && m.followFromHit ? m.followFromHit : m.followFrom);
    if (ff && f >= ff) {
      const acted = this.air ? this.tryAirActions(opp, match, false) : this.tryGroundActions(opp, match, false, false);
      if (acted) return;
    }
    const total = m.startup + m.active + m.recovery + ((this.chargeLv && m.charge.levels[this.chargeLv].recoveryAdd) || 0);
    if (f >= total) {
      if (this.air) { const helpless = m.kind === 'special' && m.helpless; this.clearMove(); this.setState(helpless ? 'fall' : 'air'); }
      else { this.clearMove(); this.setState(this.input.down() ? 'crouch' : 'idle'); }
      return;
    }
    if (!this.air && !moving) {
      const adv = m.advance;
      if (adv && f <= adv.frames && !this.moveHit) this.vx = adv.speed * this.facing;
      else this.vx *= 0.7;
    }
  }

  // Update 9 — Ayakashi's string movement (deterministic, position-scripted).
  // arc: swing on a string over the opponent's head to their far side (a cross-up), then turn to face them.
  runArc(A, f, opp, match) {
    const lim = DW.CONFIG.STAGE_HALF_WIDTH - this.char.pushWidth / 2;
    if (f === (A.aim || A.from) || !this.arcS) {   // Update 11: the anchor (and so the landing spot) is fixed when it appears
      const dir = Math.sign(opp.x - this.x) || this.facing;
      this.arcS = { x0: this.x, y0: this.y, tx: DW.clamp(opp.x + dir * A.spacing, -lim, lim), ty: Math.max(opp.y + A.endY, 40), cx: opp.x, cy: Math.max(this.y, opp.y) + A.lift, dir };
      match.emit({ type: A.aim ? 'stringanchor' : 'stringswing', who: this.id, x: this.x, y: this.y, ax: this.arcS.cx, ay: this.arcS.cy + 110 });
    }
    if (A.aim && f < A.from) { this.vx = 0; this.vy = 0; this.noGrav = true; this.arcS.x0 = this.x; this.arcS.y0 = this.y; return; }   // hanging on the anchored string
    if (A.aim && f === A.from) match.emit({ type: 'stringswing', who: this.id, x: this.x, y: this.y, ax: this.arcS.cx, ay: this.arcS.cy + 110 });
    const S = this.arcS, u = DW.clamp((f - A.from) / (A.to - A.from), 0, 1), e = u * u * (3 - 2 * u), q = 1 - e;
    this.x = q * q * S.x0 + 2 * q * e * S.cx + e * e * S.tx; this.y = Math.max(1, q * q * S.y0 + 2 * q * e * S.cy + e * e * S.ty);
    this.vx = 0; this.vy = 0; this.noGrav = true; this.air = true;
    if (f === A.to) { this.facing = Math.sign(opp.x - this.x) || -S.dir; this.vx = this.facing * 0.5; this.arcS = null; }
  }
  // reel: pull herself along the strings to her puppet when it is out (it then returns to her side);
  // with the puppet beside her or broken, the strings yank her back and up instead (an air escape).
  runReel(R, f, opp, match) {
    const p = this.puppet;
    if (f === R.from || !this.reelS) {
      const toPuppet = p && (p.state === 'hold' || p.state === 'go') && Math.abs(p.x - this.x) > 40;
      const lim = DW.CONFIG.STAGE_HALF_WIDTH - this.char.pushWidth / 2;
      const tx = toPuppet ? p.x - Math.sign(p.x - this.x) * 24 : this.x - this.facing * R.back, ty = toPuppet ? Math.max(30, p.y + 10) : this.y + R.up;
      this.reelS = { x0: this.x, y0: this.y, tx: DW.clamp(tx, -lim, lim), ty, toPuppet };
      match.emit({ type: 'stringreel', who: this.id, x: this.x, y: this.y, tx: this.reelS.tx, ty: this.reelS.ty, puppet: toPuppet });
    }
    const S = this.reelS, u = DW.clamp((f - R.from) / R.frames, 0, 1), e = 1 - (1 - u) * (1 - u);
    this.x = S.x0 + (S.tx - S.x0) * e; this.y = Math.max(1, S.y0 + (S.ty - S.y0) * e);
    this.vx = 0; this.vy = 0; this.noGrav = true; this.air = true;
    if (f === R.from + R.frames) { if (S.toPuppet && p && (p.state === 'hold' || p.state === 'go')) DW.Puppet.setState(p, 'return'); this.vy = 1; this.reelS = null; }
    if (this.x !== S.tx || true) this.faceOpponent(opp);
  }

  // ---------------------------------------------------------------- grab sequences
  startSeq(victim, match) {
    const m = this.move, back = !!(m.seqBack && this.input.back(this.facing));
    const def = back ? m.seqBack : m.seq;
    const y0 = this.y;
    const keys = def.keys.map(k => k.aY !== undefined ? Object.assign({}, k, { aY: DW.Seq.resolveAY(k.aY, y0) }) : k);
    const relDmg = def.release.damage !== undefined ? def.release.damage : m.damage;
    const predicted = DW.Seq.predictDamage(def, match.combos[this.id].active ? match.combos[this.id].hits : 0, !!m.super, relDmg);
    // Wall-aware start: a strike sequence that travels (aX / free victim path) shifts its origin away from the
    // corner so both bodies always stay inside the stage.
    const dir = this.facing, reach = Math.max(0, ...keys.map(k => Math.max(k.aX || 0, k.wv ? k.wv[0] : 0)));
    const lim = DW.CONFIG.STAGE_HALF_WIDTH - 30;
    let x0 = this.x; if (keys.some(k => k.aX !== undefined) && dir * x0 + reach > lim) x0 = dir * (lim - reach);
    // Update 12: a ranged sequence (Tenmetsu's force wave) is anchored where the VICTIM stands; the attacker's aX
    // keys are shifted so he stays where he cast it. (Origin still kept inside the stage.)
    if (def.anchorVictim) {
      const vReach = Math.max(0, ...keys.map(k => k.wv ? k.wv[0] : 0));
      x0 = victim.x; if (dir * x0 + vReach > lim) x0 = dir * (lim - vReach);
      const off = (this.x - x0) * dir;
      for (let i = 0; i < keys.length; i++) if (keys[i].aX !== undefined) keys[i] = Object.assign({}, keys[i], { aX: keys[i].aX + off });
    }
    this.seq = { def, keys, t: -1, victim, x0, y0, dir, inCombo: match.combos[this.id].active && match.combos[this.id].hits > 0, hasAX: keys.some(k => k.aX !== undefined), blendFrom: [victim.x, victim.y], blendT: 0, mode: null, prev: [victim.x, victim.y],
      lethal: m.super === 3 && predicted >= victim.health };
    this.moveHit = true;
    victim.clearMove(); victim.setState('grabbed'); victim.pendingBounce = null; victim.holdFrames = 0;
    victim.vx = victim.vy = 0; victim.squash = null;
    match.emit({ type: 'grabstart', who: this.id, command: !!def.command, move: this.moveId, super: m.super || 0, lethal: this.seq.lethal, x: (this.x + victim.x) / 2, y: this.y + 70 });
    this.runSeq(match);
  }

  // One frame of the shared grab sequence: attacker pose -> attacker hands -> victim attached to the hands.
  runSeq(match) {
    const S = this.seq, v = S.victim, keys = S.keys, C = DW.CONFIG;
    S.t++;
    const t = S.t;
    if (S.def.tech && t <= C.throw.techWindow && v.input.buffered('grab', v.clock)) {   // throw escape
      v.input.consume('grab'); this.throwTech(v, match); return;
    }
    // attacker: altitude (+ optional horizontal travel aX) + interpolated pose
    this.y = Math.max(0, DW.Seq.channel(keys, 'aY', t, S.y0)); this.air = this.y > 0;
    const limA = C.STAGE_HALF_WIDTH - this.char.pushWidth / 2;
    if (S.hasAX) this.x = DW.clamp(S.x0 + S.dir * DW.Seq.channel(keys, 'aX', t, 0), -limA, limA);
    this.seqHide = !!DW.Seq.latest(keys, 'ahide', t);
    if (keys.some(k => k.aflip !== undefined)) this.facing = DW.Seq.latest(keys, 'aflip', t) ? -S.dir : S.dir;   // Update 15: she turns back after dashing through
    if (S.def.clones) this.seqClones = DW.Seq.clones(S.def.clones, t, S, this); 
    this.vx = 0; this.vy = 0; this.noGrav = true;
    const ap = DW.Seq.pose(keys, 'apose', t, 'grab');
    this.seqPts = ap.pts; this.seqPose = ap.name;
    const sc = this.char.scale || 1, P = ap.pts;
    const handMode = DW.Seq.latest(keys, 'hand', t) || 'both';
    const off = DW.Seq.channel(keys, 'off', t, [0, 0]);
    const hl = handMode === 'front' ? P.hF : [(P.hF[0] + P.hB[0]) / 2, (P.hF[1] + P.hB[1]) / 2];
    const hand = [this.x + this.facing * (hl[0] + off[0]) * sc, this.y + (hl[1] + off[1]) * sc];
    this.seqHand = hand;
    // victim: pose, rotation, deformation, then position (attached to the hands, or on its own keyed path)
    v.facing = -S.dir;
    v.seqRot = DW.Seq.channel(keys, 'vrot', t, 0);
    v.squash = DW.Seq.channel(keys, 'squash', t, null);
    if (S.def.bigBook) {   // Update 15 (Oshi-hon): victim hidden between the pages, squash pivot, book state for the renderer
      v.seqHide = !!DW.Seq.latest(keys, 'vhide', t); v.squashPivot = DW.Seq.channel(keys, 'sqPivot', t, 70);
      S.book = { s: DW.Seq.channel(keys, 'bookS', t, 0), open: DW.Seq.channel(keys, 'bookOpen', t, 1), at: DW.Seq.channel(keys, 'bookAt', t, [90, 60]) };
    }
    const vp = DW.Seq.pose(keys, 'vpose', t, 'hit'); v.seqPts = vp.pts; v.seqPose = vp.name;
    const mode = DW.Seq.latest(keys, 'mode', t) || 'hand';
    const attachName = DW.Seq.latest(keys, 'attach', t) || 'chest';
    let target;
    if (mode === 'free') {
      const w = DW.Seq.channel(keys, 'wv', t, [60, 0]), limV = C.STAGE_HALF_WIDTH - v.char.pushWidth / 2;
      target = [DW.clamp(S.x0 + S.dir * w[0], -limV, limV), w[1]];
    } else {
      const at = DW.Pose.ATTACH[attachName];
      target = DW.Pose.solveOrigin(hand, v.facing, v.char.scale || 1, v.seqRot, at);
    }
    // switching how the victim is held (hand <-> free, or chest -> ankles): ease over, never snap
    const holdKey = mode + ':' + attachName;
    if (S.hold !== holdKey) { if (S.hold !== undefined) { S.blendFrom = [v.x, v.y]; S.blendT = 0; } S.hold = holdKey; S.mode = mode; }
    const pull = S.def.pull || 5;                 // grab confirmation / mode switch: ease into the hold, no snapping
    if (S.blendT < pull) { S.blendT++; const u = DW.Seq.smooth(S.blendT / pull); target = [S.blendFrom[0] + (target[0] - S.blendFrom[0]) * u, S.blendFrom[1] + (target[1] - S.blendFrom[1]) * u]; }
    S.prev = [v.x, v.y];
    v.x = target[0]; v.y = target[1]; v.air = v.y > 0;
    for (const k of keys) {
      if (k.f !== t) continue;
      if (k.dmg) DW.Combat.seqHit(this, v, k.dmg, match);
      if (k.fx) match.emit({ type: 'seqfx', fx: k.fx, power: k.power || 0, who: this.id, x: v.x, y: Math.max(0, v.y), command: !!S.def.command, lethal: S.lethal, n: k.n, big: k.big });
      if (k.text) match.emit({ type: 'text', who: this.id, text: k.text, command: true });
      if (k.voice) match.emit({ type: 'voicecue', who: this.id, cue: k.voice });
      if (k.cam) S.cam = k.cam;
      if (k.stop) { this.hitstop = k.stop; v.hitstop = k.stop; }
    }
    if (t >= S.def.length) this.releaseSeq(match);
  }

  releaseSeq(match) {
    const S = this.seq, v = S.victim, m = this.move, rel = S.def.release;
    this.facing = S.dir;   // Update 15: any mid-sequence turn-around is undone before the release
    const props = Object.assign({}, m, rel, { damage: rel.damage !== undefined ? rel.damage : m.damage, grab: false, seq: null, seqInCombo: S.inCombo });
    const mom = [v.x - S.prev[0], v.y - S.prev[1]];
    this.seq = null; this.seqPose = null; this.seqPts = null; this.seqHand = null; this.seqHide = false; this.seqClones = null;
    const relRot = v.seqRot || 0; v.seqRot = 0; v.squash = null; v.seqPts = null; v.seqHide = false; v.squashPivot = undefined;   // Update 15: always back to normal shape
    v.y = Math.max(1, v.y);
    const facing = S.def.back ? -this.facing : this.facing;
    DW.Combat.resolve({ owner: this, facing, x: this.x, y: this.y, proj: false, finalHit: true, release: true }, v, props, match);
    v.relRot = relRot;

    if (rel.momentum && v.state === 'airhit' && !v.pendingBounce) {
      const k = rel.momentum;
      v.vx = DW.clamp(mom[0] * k * 1.6, -12, 12);
      v.vy = DW.clamp(Math.max(mom[1] * k * 1.6, 4), 4, 12);
      if (Math.abs(v.vx) < 3) v.vx = 3 * facing;
    }
    if (rel.throwImpact) match.emit({ type: 'seqfx', fx: 'release', power: 4, who: this.id, x: v.x, y: v.y });
    if (S.def.back) this.facing = -this.facing;
  }

  throwTech(v, match) {
    const C = DW.CONFIG.throw;
    this.clearMove(); v.clearMove();
    this.setState('techrecover'); v.setState('techrecover');
    v.x = this.x + this.facing * 44;
    this.vx = -C.techPush * this.facing; v.vx = C.techPush * this.facing;
    this.hitstop = v.hitstop = 6;
    match.emit({ type: 'tech', who: v.id, x: (this.x + v.x) / 2, y: 70 });
    match.emit({ type: 'text', who: v.id, text: 'THROW ESCAPE' });
  }

  runShadowStep(opp, match) {
    const S = DW.CONFIG.shadowStep;
    const dir = Math.sign(opp.x - this.x) || this.facing;
    this.facing = dir;
    const tx = opp.x - dir * S.spacing;
    this.vx = DW.clamp((tx - this.x) * 0.4, -S.speed, S.speed);
    if (this.air) {
      const ty = opp.air ? Math.max(opp.y - 6, 26) : 0;   // stay airborne while chasing a bouncing victim
      if (!opp.air) this.vy = -this.y / Math.max(1, S.actionableFrom - this.stateFrame);  // grounded target: drop to the floor by the actionable frame
      else this.vy = DW.clamp((ty - this.y) * 0.4, -S.airSpeed, S.airSpeed);
      this.noGrav = true;
    } else this.vy = 0;
    if (this.stateFrame >= S.actionableFrom) {
      const wasAir = this.air;
      const acted = wasAir ? this.tryAirActions(opp, match, true) : this.tryGroundActions(opp, match, true, true);
      if (acted) { if (wasAir) { this.vy = 2; this.vx *= 0.4; } return; }
    }
    if (this.stateFrame >= S.frames) { this.vx *= 0.3; this.setState(this.air ? 'air' : 'idle'); }
  }

  faceOpponent(opp) { if (Math.abs(opp.x - this.x) > 1) this.facing = opp.x > this.x ? 1 : -1; }

  groundMovement() {
    const inp = this.input;
    if (this.bound > 0) { this.vx = 0; if (this.state !== 'idle' && this.state !== 'crouch') this.setState(inp.down() ? 'crouch' : 'idle'); if (inp.down() && this.state !== 'crouch') this.setState('crouch'); return; }
    if (inp.down()) { this.vx = 0; if (this.state !== 'crouch') this.setState('crouch'); return; }
    if (inp.forward(this.facing)) { this.vx = this.M.walkForward * this.facing; if (this.state !== 'walkF') this.setState('walkF'); return; }
    if (inp.back(this.facing)) { this.vx = -this.M.walkBack * this.facing; if (this.state !== 'walkB') this.setState('walkB'); return; }
    this.vx = 0; if (this.state !== 'idle') this.setState('idle');
  }

  // ---------------------------------------------------------------- reading buttons -> move ids
  // Returns { id, use:[buttons] } | { wait:true } | null
  pickMove(air, chainFrom) {
    const w = this.pickMove0(air, chainFrom);
    // Update 8: in a stance, the same input performs that stance's version of the move (K5H, M5S…) if it exists
    if (w && w.id && this.stance && this.stance !== 'N' && !air) { const sid = this.stance + w.id; if (this.char.moves[sid]) w.id = sid; }
    // Update 12: a move that needs one of his seals on the field falls back to another move when there is none
    if (w && w.id) { const mv = this.char.moves[w.id]; if (mv && mv.ifSeal && this.match.entities.some(e => e.kind === 'seal' && e.owner === this.id && e.life > 0)) w.id = mv.ifSeal; /* Update 12: air Forward + S → Kai! when a seal is down */ }
    return w;
  }
  pickMove0(air, chainFrom) {
    const inp = this.input, F = this.clock, mv = this.char.moves, C = DW.CONFIG.CHORD_FRAMES;
    const L = inp.buffered('light', F), H = inp.buffered('heavy', F), S = inp.buffered('special', F);
    const p0 = air ? 'j' : '';
    // Dedicated Super buttons (touch LV1 / 極, keys I / O): same move ids, meter checks and startMove as the manual inputs.
    for (const [btn, lv] of [['super3', 3], ['super1', 1]]) {
      if (!inp.buffered(btn, F)) continue;
      const id = mv[p0 + 'L' + lv] ? p0 + 'L' + lv : null;
      if (id && this.meter >= mv[id].meterCost) return { id, use: [btn] };
      inp.consume(btn);                               // not enough meter / not available here: nothing happens
    }
    const G = inp.buffered('grab', F) && !air && !chainFrom && mv['5G'];
    if (G && !(L && inp.lastPress.light > inp.lastPress.grab) && !(H && inp.lastPress.heavy > inp.lastPress.grab) && !(S && inp.lastPress.special > inp.lastPress.grab))
      return { id: '5G', use: ['grab'] };
    if (!L && !H && !S) return null;
    const p = air ? 'j' : '';
    // Supers: Heavy + Special together (Down + Heavy + Special = Level 3)
    if (H && S && Math.abs(inp.lastPress.heavy - inp.lastPress.special) <= C) {
      const lv3 = inp.downFor('special') || inp.downFor('heavy');
      const id3 = mv[p + 'L3'] ? p + 'L3' : null, id1 = mv[p + 'L1'] ? p + 'L1' : null;
      if (lv3 && id3 && this.meter >= mv[id3].meterCost) return { id: id3, use: ['heavy', 'special'] };
      if (id1 && this.meter >= mv[id1].meterCost) return { id: id1, use: ['heavy', 'special'] };
    }
    // Wait a couple of frames for the second half of a Super chord (only when a Super is affordable)
    if (this.meter >= DW.CONFIG.meter.barSize &&
        ((H && !S && inp.age('heavy', F) < C - 1) || (S && !H && inp.age('special', F) < C - 1))) return { wait: true };
    const newest = [['special', S], ['heavy', H], ['light', L]].filter(x => x[1])
      .sort((a, b) => inp.lastPress[b[0]] - inp.lastPress[a[0]])[0][0];
    let id;
    if (newest === 'special') {
      const d = inp.dirFor('special', this.facing);
      // Down-Back / Down-Forward + S exist for some characters (Kasumi's trap distances); otherwise fall back to Down + S
      // Update 9: Up + S exists in the air for some characters (Kurogane's rising Rakurai). Up = stick/d-pad up, or
      // JUMP held (keyboard). Forward wins over up, so a held up-forward from a forward jump gives the flat shot.
      const up = d.up || (air && !!inp.cur.jump);
      id = p + (d.down ? (d.back && mv[p + '1S'] ? '1S' : d.fwd && mv[p + '3S'] ? '3S' : '2S') : d.fwd ? '6S' : d.back ? '4S' : up && mv[p + '8S'] ? '8S' : '5S');
      this.neutralS = !air && !d.down && !d.fwd && !d.back && !up;   // Update 13: candidate for late-direction leniency
      if (!mv[id]) id = p + '5S';
    } else if (newest === 'heavy') id = air ? 'jH' : (inp.downFor('heavy') ? '2H' : (mv['6H'] && inp.dirFor('heavy', this.facing).fwd ? '6H' : '5H'));
    else {
      if (air) id = 'jL';
      else if (inp.downFor('light')) id = '2L';
      else id = (chainFrom && chainFrom.chainL) ? chainFrom.chainL : '5L';
    }
    // MODERN controls — auto-combos (Update 3 assist, completed in Update 4). Only during a confirmed combo
    // (the opponent is actually in hitstun) and only for a neutral press, so blocked strings never continue:
    //   • mash LIGHT → the character's full Light route, through the launcher, the air string and a finisher
    //   • mash HEAVY → the character's Heavy route, ending in Level 1 if you have the bar, else a normal finisher
    //   • neutral SPECIAL mid-combo → the character's combo special
    // Every step is an ordinary move/cancel a Traditional player can input by hand (same frames, cancels,
    // meter); route-picked moves deal 15% less (see combat). Traditional never reaches this code.
    if (this.scheme === 'modern' && this.char.assist) {
      if (!this.opponentInCombo()) this.assistRun = null;
      else {
        const A = this.char.assist, d = inp.dirFor(newest, this.facing), neutral = !d.down && !d.fwd && !d.back;
        if ((newest === 'light' || newest === 'heavy') && neutral && (chainFrom || this.assistRun)) {
          const R = A[newest];
          let i = this.assistRun && this.assistRun.btn === newest ? this.assistRun.i : R.indexOf(this.moveId);
          if (i >= 0 && (chainFrom || this.assistRun)) {
            let step = R[i + 1];
            if (step && typeof step === 'object') {      // meter branch: Level 1 only if it can actually be paid for
              const sid = step.super, ok = sid && mv[sid] && this.meter >= mv[sid].meterCost;
              step = ok ? sid : step.else;
            }
            if (step === 'J' || step === 'JC') return { action: step === 'J' ? 'superjump' : 'jc', use: [newest], assistI: i + 1, btn: newest };
            if (step && mv[step] && !(mv[step].air && this.airUsed(step)))
              return { id: step, use: [newest], assisted: step !== id, assistI: i + 1, btn: newest };
          }
        }

      }
    }

<script>/* src/core/combat.js */

// can never disagree with how the hit must actually be blocked. Returns null for things that are not attacks.
DW.ATTACK_CLASS_COLORS = { MID: '#ffd23f', LOW: '#4fb3ff', OVERHEAD: '#ff5ad1', THROW: '#ff9f1c', 'CMD GRAB': '#ff9f1c', UNBLOCKABLE: '#ff3b3b', 'ANTI-AIR': '#7cff7c', 'BIND TRAP': '#7cf2d6' };
DW.attackClass = (p, opts = {}) => {
  if (!p) return null;
  if (p.grab) return { tags: p.throwTech || p.kind === 'throw' ? ['THROW'] : ['CMD GRAB', 'UNBLOCKABLE'] };
  if (!(p.damage > 0)) return null;                                  // wards, set-up objects: no misleading label
  if (p.unblockable) return { tags: ['UNBLOCKABLE'] };

DW.Combat = {
  hitstopFor(p) {

  canStrike(a) {

    const m = a.move;

  // Update 12: a move whose hitbox is a wave front travelling out from the attacker during its active frames
  waveBox(a, m) { const front = m.wave.x0 + m.wave.speed * Math.max(0, a.moveFrame - m.startup); return { x: m.wave.x0, y: m.hitbox.y, w: front - m.wave.x0 + m.wave.w, h: m.hitbox.h }; },

    // Grab interactions: a strike landing on the same frame beats a grab; two grabs at once = both escape.
    const isGrab = (h) => h[2].seq && !h[2].multi && !h[2].seqOnHit;
    if (hits.length === 2) {
      const [g0, g1] = [isGrab(hits[0]), isGrab(hits[1])];
      if (g0 && g1) { hits[0][0].throwTech(hits[0][1], match); return; }
      if (g0 && !g1) hits.splice(0, 1); else if (g1 && !g0) hits.splice(1, 1);
    }
    for (const [a, d, m] of hits) {   // m captured: a trade may have already cleared a's move
      if (m.seq && !m.multi && !m.seqOnHit) {      // grabs with an animated sequence
        if (a.move !== m || d.state === 'grabbed') continue;
        a.hitCount++;
        if (match.combos[a.id].active || m.kind !== 'throw') { /* command grabs keep combos alive */ }
        a.startSeq(d, match);
        continue;
      }
      const final = m.multi && a.hitCount + 1 >= m.multi.count;
      const props = final && m.final ? Object.assign({}, m, m.final) : m;
      a.hitCount++; a.nextHitFrame = a.moveFrame + (m.multi ? m.multi.interval : 999);
      this.resolve({ owner: a, facing: a.facing, x: a.x, y: a.y, proj: false, finalHit: !m.multi || final }, d, props, match);
    }
  },

  grabbable(d, m) {
    if (d.state === 'blockstun' || d.state === 'grabbed' || d.state === 'techrecover') return false;
    if (m.kind === 'throw') return !d.air && !['hitstun', 'airhit', 'knockdown'].includes(d.state);
    if (m.grab === 'ground') return !d.air && d.state !== 'hitstun';   // jump startup is still on the ground: grabbable
    if (m.grab === 'air') return d.air;
    return d.state !== 'hitstun' || m.super;   // 'any': supers can grab out of a combo
  },

  // Update 5 — per-character combo tuning (char.comboTuning, all default 1 = off):
  //   repeatScale^n  : the n-th repeat of the same move id inside one combo deals less
  //   ssScale^k      : every Shadow Step already spent in this combo reduces the damage that follows
  //   seqScale       : multiplier for command-grab sequence damage dealt INSIDE an existing combo
  // Update 7 meter economy: what the attacker earns for one hit, and what the defender earns for taking it.
  meterOnHit(a, d, combo, p, base, dmg, repeats) {
    const M = DW.CONFIG.meter;
    if (!(a.move && a.move.super) && !p.super) {
      const rate = p.grab ? M.hit.grab : (p.kind === 'special' ? M.hit.special : M.hit.normal);
      const pos = Math.max(M.comboMin, 1 - M.comboStep * Math.max(0, combo.hits - M.comboFullHits));
      let v = (base * rate + M.perHit) * pos * Math.pow(M.repeatScale, Math.max(0, repeats));
      v = Math.max(0, Math.min(v, M.comboCap - combo.meterBuilt));
      combo.meterBuilt += v; a.addMeter(v);
    }
    const t = Math.max(0, Math.min(dmg * M.taken, M.takenComboCap - combo.meterGiven));
    combo.meterGiven += t; d.addMeter(t);
    d.addBreak(dmg * DW.CONFIG.break.fillPerDamage);   // Kekkai Break gauge refills from damage taken
  },

  tuning(a, combo, id) {
    const T = a.char.comboTuning || {}; let k = 1;
    if (T.repeatScale && id) k *= Math.pow(T.repeatScale, combo.used[id] || 0);
    if (T.ssScale) k *= Math.pow(T.ssScale, combo.shadowSteps || 0);
    return k;
  },

  // Universal AIR-TO-GROUND (Update 3): a deep air Light/Heavy that hits a grounded opponent gives
  // enough hitstun for the attacker to land and link a grounded attack. Computed from the attacker's
  // real fall time, so high/early air hits (more than ~16 frames from the floor) get no bonus.
  //   hitstun = frames until landing + air-attack landing recovery + per-character follow-up window
  airToGround(a, p) {
    if (!a.air || (p.kind !== 'light' && p.kind !== 'heavy') || !a.move || !a.move.air) return 0;
    const C = DW.CONFIG; let y = a.y, vy = a.vy, n = 0;
    const left = a.move.startup + a.move.active + a.move.recovery - a.moveFrame;
    while (y > 0 && n < 40) { const g = C.GRAVITY * (n < left && vy < 0 ? 0.5 : 1); vy = Math.max(vy - g, -C.MAX_FALL_SPEED); y += vy; n++; }
    if (n > 16) return 0;
    const M = a.char.movement;
    return n + M.airAttackLandingRecovery + (M.airToGroundWindow || 9);
  },

  canBlock(d, p, src) {
    if (p.grab || p.unblockable) return false;
    const okState = ['idle', 'walkF', 'walkB', 'crouch', 'blockstun', 'air'].includes(d.state);
    if (!okState) return false;
    // Update 15 — puppet attacks are blocked against the side the puppet ACTUALLY strikes from (a puppet behind you is a
    // real cross-up: hold toward it). No blanket "blockstun blocks both sides" any more. Only protection kept: a true
    // SANDWICH — a hit from the opposite side within 3 frames of a block you just made — is guarded automatically,
    // so two simultaneous hits from both sides are never unblockable. A puppet right on top of you (|dx| < 8):
    // the direction its strike travels decides (a strike moving right comes from the left).
    let dir = d.facing;
    if (src && src.puppet) {
      const sx = p.blockFromOwner && src.owner ? src.owner.x : src.x, dx = sx - d.x;
      dir = Math.abs(dx) < 8 ? (-(src.facing || 0) || d.facing) : Math.sign(dx);
      if (d.state === 'blockstun' && d.lastBlockSide && d.lastBlockSide !== dir && d.lastBlockAt != null && d.clock - d.lastBlockAt <= 3)
        return !(p.height === 'low' && !d.input.down() && !d.air) && !(p.height === 'overhead' && d.input.down());
    }
    if (!d.input.back(dir)) return false;
    if (d.air) return true;
    if (p.height === 'low' && !d.input.down()) return false;
    if (p.height === 'overhead' && d.input.down()) return false;
    return true;
  },

  // src: { owner, facing, x, y, proj, entity?, finalHit }
  resolve(src, d, p, match) {
    const C = DW.CONFIG, a = src.owner, dir = src.facing;
    const total = p.startup + p.active + p.recovery;
    const contactX = (src.x + d.x) / 2 + dir * 8;
    const contactY = Math.min(src.y + (p.hitbox ? p.hitbox.y + p.hitbox.h / 2 : 60), d.y + 110);
    const freeze = (n) => { d.hitstop = n; if (!src.proj) a.hitstop = n; else if (src.entity) src.entity.hitstop = n; };
    if (!src.proj) { a.moveHit = true; }
    else if (a.moveSerial === src.entity.serial && a.state === 'attack') a.moveHit = true;

    // Counter stance catches strikes (not grabs or projectiles)
    if (!src.release && d.isCountering() && !p.grab && !src.proj) {
      const fu = d.move.counter.followup;
      d.startMove(fu); d.invuln = 14;
      a.hitstop = 22; d.hitstop = 8;
      match.emit({ type: 'counterstance', who: d.id, x: contactX, y: contactY });
      match.emit({ type: 'text', who: d.id, text: 'COUNTER!' });
      return;
    }
    // Armor absorbs one strike (grabs beat armor)
    if (!src.release && d.hasArmor() && !p.grab) {
      d.armorUsed++;
      const chip = Math.round((p.damage || 0) * 0.5);
      d.health = Math.max(1, d.health - chip);
      d.flash = 6; freeze(this.hitstopFor(p));
      match.emit({ type: 'armor', who: d.id, x: contactX, y: contactY });
      return;
    }

    if (!src.release && this.canBlock(d, p, src)) {
      if (!src.proj) a.moveBlocked = true;
      d.setState('blockstun'); d.stun = p.blockstun; d.lowBlocking = d.input.down();
      d.lastBlockAt = d.clock; d.lastBlockSide = Math.sign((src.puppet && p.blockFromOwner && src.owner ? src.owner.x : src.x) - d.x) || d.facing;   // Update 15 (sandwich rule)
      const chip = p.kind === 'special' || p.super ? Math.round(p.damage * 0.1) : 0;
      d.health = Math.max(1, d.health - chip);
      freeze(Math.max(4, this.hitstopFor(p) - 2));
      if (!src.proj) this.push(a, d, p.push || 3, dir);
      else d.vx = (p.push || 3) * dir;
      if (!p.super) a.addMeter((p.damage || 0) * C.meter.blockAttacker);   // Update 15: a blocked SUPER builds no meter for its user (it used to)
      d.addMeter((p.damage || 0) * C.meter.blockDefender);
      if (!src.proj) match.lastFrameInfo = { move: a.moveId, name: p.name, startup: p.startup + 1, result: 'BLOCK', advantage: p.blockstun - (total - a.moveFrame) };
      match.emit({ type: 'block', x: contactX, y: contactY, who: d.id });
      return;
    }

    // Update 4: strike-started cinematic supers (Ren / Kasumi Level 3). The opening strike can be blocked
    // like any attack; on HIT it hands both fighters to the shared, synchronized sequence system.
    if (p.seqOnHit && !src.release && !src.proj && a.move === p && d.state !== 'grabbed') {
      const combo0 = match.combos[a.id]; if (!combo0.active) Object.assign(combo0, DW.newCombo(), { active: true });
      d.flash = 8; a.startSeq(d, match);
      return;
    }
    if (!src.release) d.relRot = undefined;
    d.bounced = false;
    const counter = (d.state === 'attack' && d.movePhase() === 'startup') || (d.state === 'break' && d.brkPunish);   // Update 15: a guarded Break is punished as a counter-hit
    const punish = !counter && ((d.state === 'attack' && d.movePhase() === 'recovery') || d.state === 'landing' || d.state === 'backdash' || d.state === 'fall');

    const combo = match.combos[a.id];
    if (!combo.active) Object.assign(combo, DW.newCombo(), { active: true });
    combo.hits++;
    const cc = C.combo;
    let dmgScale = Math.max(cc.damageMinScale, 1 - cc.damageStepPerHit * Math.max(0, combo.hits - cc.damageFullHits));
    if (p.super) dmgScale = Math.max(cc.superMinScale, dmgScale);
    const hsScale = Math.max(cc.hitstunMinScale, 1 - cc.hitstunStepPerHit * Math.max(0, combo.hits - cc.hitstunFullHits));
    const assist = !src.proj && a.assisted ? C.modernAssistScale : 1;   // Modern auto-combo hits: 15% less
    let tune = this.tuning(a, combo, p.id || a.moveId);
    if (p.seqInCombo && !p.super && a.char.comboTuning && a.char.comboTuning.seqScale) tune *= a.char.comboTuning.seqScale;
    const repeats = combo.used[p.id || a.moveId] || 0;
    if (!src.proj && (p.id || a.moveId)) combo.used[p.id || a.moveId] = (combo.used[p.id || a.moveId] || 0) + (src.finalHit !== false ? 1 : 0);
    const dmg = Math.round((p.damage || 0) * dmgScale * assist * tune);
    let newHp = d.health - dmg;
    // Level 3: only the FINAL hit can be lethal (so the cinematic always plays on the finishing blow)
    if (p.super === 3 && !src.finalHit) newHp = Math.max(1, newHp);
    // Training dummy can't die, except to a Level 3 finishing blow (so finishers can be practised)
    if (match.mode === 'training' && !(match.training && match.training.realMatch) && !(p.super === 3 && src.finalHit) && !(match.realTrainingKO && match.realTrainingKO(d))) newHp = Math.max(1, newHp);
    d.health = Math.max(0, newHp);
    combo.damage += dmg;
    this.meterOnHit(a, d, combo, p, p.damage || 0, dmg, repeats);
    d.flash = 8; d.lastHitBy = p.name;
    if (d.state === 'attack' || d.state === 'shadowstep' || d.state === 'airdash' || d.state === 'dash') d.clearMove();
    const stunMul = hsScale * (counter ? C.counterHitHitstunBonus : 1);

    const hold = p.hold && !src.finalHit;
    if (hold) {                                  // multi-hit supers/grabs keep the victim in place
      const h = Array.isArray(p.hold) ? p.hold[(a.hitCount - 1) % p.hold.length] : p.hold;
      d.x = a.x + a.facing * h.dx; d.y = Math.max(0, a.y + h.dy);
      d.vx = 0; d.vy = 0; d.air = d.y > 0;
      d.setState(d.air ? 'airhit' : 'hitstun');
      d.stun = (p.multi ? p.multi.interval : 10) + 14; d.holdFrames = p.multi ? p.multi.interval + 6 : 10;
      d.facing = -a.facing;
    } else if (p.bounce && this.bounceAllowed(combo, p.bounce)) {
      const b = p.bounce;
      if (b.type === 'ground') combo.groundBounces++; else combo.wallBounces++;
      d.air = true; d.y = Math.max(d.y, 1);
      if (b.type === 'ground') { d.vy = b.slam !== undefined ? b.slam : -12; d.vx = 0; }
      else { d.vy = 4; d.vx = (b.speed || 15) * dir; }
      d.pendingBounce = { type: b.type, vy: b.vy, vx: b.vx || 0, hitstun: b.hitstun, dir, x0: d.x, maxTravel: b.maxTravel || 0 };   // Update 14: maxTravel = spirit wall
      d.setState('airhit'); d.stun = 999;
      match.emit({ type: 'text', who: a.id, text: b.type === 'ground' ? 'GROUND BOUNCE' : 'WALL BOUNCE' });
    } else if (p.launch && (!d.air || p.launchAir) && (p.id || a.moveId) === '2H' && repeats >= C.combo.launcherLoopCap) {
      // Update 12 — L → H → 2H loop cap: within ONE combo the Down Heavy launcher relaunches at most
      // launcherLoopCap times. Past that it still hits, but knocks the victim away into a hard knockdown, which
      // ends the loop (other juggle routes are untouched; the count resets when the combo ends).
      d.air = true; d.y = Math.max(d.y, 1); d.vy = 7; d.vx = 5 * dir; d.setState('airhit'); d.stun = 999; d.pendingBounce = null;
      match.emit({ type: 'text', who: a.id, text: 'LOOP LIMIT' });
    } else if (p.launch && (!d.air || p.launchAir)) {
      d.air = true; d.y = Math.max(d.y, 1);
      d.vy = p.launch.vy; d.vx = p.launch.vx * dir;
      d.setState('airhit'); d.stun = Math.round((p.launchHitstun || p.hitstun) * stunMul);
      combo.launched = true;
      if (p.kind === 'launcher') match.emit({ type: 'text', who: a.id, text: 'LAUNCH' });
    } else if (d.air) {
      const ah = p.air_hit || { vy: 5, vx: 2, hitstun: p.hitstun + 6 };
      d.vy = ah.vy; d.vx = ah.vx * dir;
      d.setState('airhit'); d.stun = Math.round(ah.hitstun * stunMul);
      if (!combo.launched) combo.launched = true;
    } else if (p.knockdown) {
      d.air = true; d.y = 1; d.vy = p.knockdown.vy; d.vx = p.knockdown.vx * dir;
      d.setState('airhit'); d.stun = 999;
    } else {
      d.setState('hitstun'); d.stun = Math.round(p.hitstun * stunMul);
      const a2g = this.airToGround(a, p);
      if (a2g) { d.stun = Math.max(d.stun, Math.round(a2g * Math.max(hsScale, 0.85))); combo.airToGround = true; }
      if (!src.proj) this.push(a, d, p.push || 3, dir); else d.vx = (p.push || 3) * dir;
    }
    // Air-to-air: attacker floats with the victim so strings continue
    if (!src.proj && a.air && d.air && p.air_hit && !hold && !p.bounce) { a.vy = p.air_hit.selfVy ?? 3; a.vx = d.vx * 0.9; }
    freeze(this.hitstopFor(p) + (counter ? 3 : 0));

    if (d.health <= 0) {
      if (p.super === 3 && src.finalHit) { match.startCinematic(a, d); }
      else {
        d.setState('ko'); d.air = true; d.y = Math.max(d.y, 1); d.vy = 9; d.vx = 4 * dir; d.pendingBounce = null;
        match.onKO(a, d);
      }
    }

    if (!src.proj) match.lastFrameInfo = { move: a.moveId, name: p.name, startup: p.startup + 1, result: 'HIT', advantage: p.blockstun - (total - a.moveFrame) };
    match.emit({ type: 'hit', x: contactX, y: contactY, who: d.id, kind: p.super ? 'super' : p.grab ? 'grab' : p.kind, dmg, counter, punish, attacker: a.id, move: p.id, proj: src.proj, meteor: !!p.meteor });
    if (counter) match.emit({ type: 'text', who: a.id, text: 'COUNTER HIT' });
    else if (punish) match.emit({ type: 'text', who: a.id, text: 'PUNISH' });
    if (p.grab && a.hitCount <= 1 && !p.seq) match.emit({ type: 'text', who: a.id, text: 'GRAB' });
  },

  // Damage dealt mid-sequence (crushes, squeezes). Counts as a combo hit; can never kill (the release can).
  seqHit(a, d, amount, match) {
    const C = DW.CONFIG, cc = C.combo, combo = match.combos[a.id];
    if (!combo.active) Object.assign(combo, DW.newCombo(), { active: true });
    combo.hits++;
    let scale = Math.max(cc.damageMinScale, 1 - cc.damageStepPerHit * Math.max(0, combo.hits - cc.damageFullHits));
    if (a.move && a.move.super) scale = Math.max(cc.superMinScale, scale);
    let tune = this.tuning(a, combo, null);
    if (combo.hits > 1 && a.seq && a.seq.inCombo && !(a.move && a.move.super) && a.char.comboTuning && a.char.comboTuning.seqScale) tune *= a.char.comboTuning.seqScale;
    const dmg = Math.round(amount * scale * tune);
    d.health = Math.max(1, d.health - dmg); combo.damage += dmg;
    this.meterOnHit(a, d, combo, { grab: true }, amount, dmg, 0);   // supers never build meter (checked inside)
    d.flash = 6;
    match.emit({ type: 'hit', x: d.x, y: d.y + 70, who: d.id, kind: 'crush', dmg, attacker: a.id, move: a.moveId });
  },

  bounceAllowed(combo, b) {
    const cc = DW.CONFIG.combo;
    return b.type === 'ground' ? combo.groundBounces < cc.groundBouncesPerCombo : combo.wallBounces < cc.wallBouncesPerCombo;
  },

  push(a, d, amount, dir) {
    const wall = DW.CONFIG.STAGE_HALF_WIDTH - d.char.pushWidth / 2 - 2;
    if (Math.abs(d.x) >= wall && Math.sign(d.x) === dir) a.vx = -amount * dir * 0.9;
    else d.vx = amount * dir;
  },
};

</script>
<script>/* src/systems/puppet.js */
// DARK WAR — Ayakashi's puppet (Update 8). Pure simulation, deterministic (no randomness), part of the fighter
// state (fighter.puppet) so it is replayed/snapshotted for Wi-Fi play like everything else.
//
// The puppet is a SEPARATE body with its own position, facing, states and hurtbox:
//   side     floats just behind Ayakashi (the side away from the opponent) — never overlaps her, can't be hit
//   go       flies forward on its strings to a spot (Ike, S); 'hold' = stays there (up to ~2.5 s) then returns
//   atk      performs a commanded attack from wherever it is (Kiri / Ashi-kiri / Tsurube / Ranbu):
//            STARTUP (telegraphed: eyes flare, a ring marks the strike) → ACTIVE (its own hitbox) → 'recover'
//   return   flies back along its strings (Modore, 4S — or automatically)
//   stagger  (Update 9) took a hit but still has durability: knocked back briefly (vulnerable, can't be commanded);
//            an interrupted attack is cancelled and it returns; a held puppet stays where it is
//   down     out of durability: falls apart, unavailable for ~5.5 s, then 'reform' at her side (full durability)
// Limits (balance): strings reach at most 260 px from Ayakashi; it is vulnerable whenever it is away from her or
// attacking. Update 9: it has DURABILITY (3 hits; a super breaks it outright), mends 1 point every 5 s only
// while resting at her side, and takes longer to come back once broken; a command given while it is down or busy
// does nothing (her gesture still has recovery = punishable); attacks have long, visible startup.
// Two-sided pressure is real but never unavoidable: a puppet attack from BEHIND must be blocked the other way
// (hold toward it), but a defender who is already blocking (blockstun) blocks puppet hits from either side.
var DW = (globalThis.DW = globalThis.DW || {});

DW.PUPPET = {
  // Update 9 tuning (all configurable): holdFrames 150 → 270 (4.5 s out after Ike), durability 1 → 3 hits,
  // downFrames 210 → 330 + reform 30 → 40 (respawn 4.0 s → 6.2 s once broken), regenFrames: +1 durability per
  // 5 s resting at her side, staggerFrames: knock-back when hit without breaking, hitInvuln: no double counting.
  sideX: 34, sideY: 38, reach: 260, speed: 9, holdFrames: 270, downFrames: 330, reformFrames: 40,
  durability: 2, regenFrames: 300, staggerFrames: 16, hitInvuln: 8,   // Update 11: durability 3 → 2
  groundY: 56,   // Update 15: at or below this height Kagemaru counts as GROUNDED (its resting height is 38–47 incl. bob)
  hurt: { w: 38, h: 74 },
  // commanded attacks (frames counted from the command)
  attacks: {
    slash:  { name: 'Kiri', startup: 12, active: 5, recovery: 22, lunge: 140, hitbox: { x: 0, y: -6, w: 74, h: 74 }, damage: 600, hitstun: 26, blockstun: 16, push: 4, air_hit: { vy: 7, vx: 2.5, hitstun: 32 } },
    sweep:  { name: 'Ashi-kiri', startup: 12, active: 5, recovery: 22, lunge: 130, low: true, hitbox: { x: 0, y: -38, w: 80, h: 26 }, damage: 460, hitstun: 24, blockstun: 14, push: 3, height: 'low', knockdown: { vy: 5, vx: 2.5 } },
    // Update 15 — Down + S while Kagemaru is SUSPENDED in the air (above groundY): never a low. It cleaves down-and-
    // across from its height (a MID: block standing OR crouching, from the side it strikes from). Own pose/animation.
    sweepAir: { name: 'Ashi-kiri (aerial: Kesa-otoshi)', startup: 12, active: 5, recovery: 22, lunge: 120, airCut: true, hitbox: { x: -4, y: -30, w: 78, h: 78 }, damage: 420, hitstun: 24, blockstun: 14, push: 3, height: 'mid', air_hit: { vy: 6, vx: 2.5, hitstun: 28 } },
    dive:   { name: 'Tsurube-otoshi', startup: 10, active: 12, recovery: 18, dive: true, hitbox: { x: -10, y: -40, w: 60, h: 70 }, damage: 520, hitstun: 24, blockstun: 12, push: 3, height: 'overhead', air_hit: { vy: -6, vx: 2, hitstun: 30 } },
    // Update 9 — air special j2S: the puppet slips under the opponent and rises through them. Relaunches an
    // airborne opponent ONCE per combo (later ones only pop them a little: no loops). Telegraphed like the others.
    rise:   { name: 'Tsurube-age', startup: 14, active: 9, recovery: 20, rise: true, hitbox: { x: -28, y: -46, w: 56, h: 100 }, damage: 420, hitstun: 26, blockstun: 14, push: 2, launch: { vy: 9, vx: 0.4 }, launchAir: true,
              air_hit: { vy: 11.5, vx: 0.6, hitstun: 40 }, weak: { air_hit: { vy: 4.5, vx: 1.2, hitstun: 24 }, launch: null, damage: 300 } },
    // Update 11 — Level 1 "Kamikakushi" (spirited away), scripted by Puppet.runKami: SINK into its own shadow →
    // the shadow RACES along the floor → ERUPTS under the opponent with an upward stab (2 hits, launches) → FLIPS
    // over them → corkscrew heel SPIKE (1 hit). Each phase has its own hitbox at the puppet. Blockable (low-safe
    // rising stab is a mid; the spike is an overhead), and the puppet can still be broken before it erupts.
    ranbu:  { name: 'Kamikakushi', kami: true, startup: 8, active: 26, recovery: 22, super: 1, damage: 520, hitstun: 30, blockstun: 12, push: 1,
              phases: {
                stab:  { from: 9, to: 16, hits: 2, interval: 4, hitbox: { x: -24, y: -40, w: 48, h: 120 }, damage: 520, hitstun: 34, blockstun: 12, launch: { vy: 10, vx: 0.5 }, launchAir: true, air_hit: { vy: 10, vx: 0.5, hitstun: 40 } },

  },

  create(owner) { return { x: owner.x - owner.facing * this.sideX, y: this.sideY, vx: 0, vy: 0, facing: owner.facing, state: 'side', t: 0, atk: null, cmd: null, hitsLeft: 0, cool: 0, hitstop: 0, serial: 0, hits: 0, downT: 0, holdT: 0, target: null,

DW.Puppet = {
  // beside her, away from the opponent; rises with her when she jumps (Update 9) so it stays at her side in the air
  sideTarget(f, opp) { const away = Math.sign(f.x - opp.x) || -f.facing; return [f.x + away * DW.PUPPET.sideX, DW.PUPPET.sideY + Math.max(0, f.y) * 0.85]; },
  setState(p, s) { p.state = s; p.t = 0; },
  vulnerable(p) { return ['go', 'hold', 'atk', 'recover', 'stagger'].includes(p.state) && !(p.hide >= 1); },   // (Update 11: not while sunk into the floor during Kamikakushi)   // never while resting beside her, returning, broken or in her Level 3

  available(p) { return p && ['side', 'go', 'hold', 'return', 'recover'].includes(p.state); },

  // A command from one of Ayakashi's specials (move.puppetCmd = { frame, type, attack? })

      return;
    }
    if (!this.available(p) && !(cmd.type === 'recall' && p.state === 'atk')) { match.emit({ type: 'puppetfail', who: f.id, x: f.x, y: f.y, why: p.state === 'down' || p.state === 'reform' ? 'down' : 'busy' }); return; }
    p.serial = f.moveSerial; p.cmd = cmd.type; p.cmdMove = f.moveId;
    match.emit({ type: 'puppetcmd', who: f.id, cmd: cmd.type, x: p.x, y: p.y, hx: f.x + f.facing * 14, hy: f.y + 84 });

      const tx = f.x + f.facing * 170, lim = DW.CONFIG.STAGE_HALF_WIDTH - 20;
      p.target = [DW.clamp(tx, -lim, lim), C.sideY + 6]; this.setState(p, 'go'); p.holdT = 0; return;
    }
    if (cmd.type === 'recall') { this.setState(p, 'return'); return; }

    if (cmd.attack === 'sweep' && p.y > C.groundY) cmd = Object.assign({}, cmd, { attack: 'sweepAir' });   // Update 15: suspended → MID

    if (A.dive) p.from = [opp.x - p.facing * 46, Math.max(opp.y + 74, 96)];   // flies up above the opponent, then drops on them
    if (A.rise) { const lim = DW.CONFIG.STAGE_HALF_WIDTH - 20; p.from = [DW.clamp(opp.x - p.facing * 18, -lim, lim), Math.max(14, opp.y - 70)]; }   // slips in under them
    this.setState(p, 'atk');
    match.emit({ type: 'puppetatk', who: f.id, attack: cmd.attack, x: p.x, y: p.y, frames: A.startup });
  },

  update(f, opp, match) {
    const p = f.puppet, C = DW.PUPPET;
    // Update 15 — DEFEAT: when Ayakashi is knocked out, Kagemaru dies with her. Its strings go slack, it drops limp
    // and crumples on the floor beside her (any attacker, any round state after the KO). A broken puppet stays down.
    if (f.state === 'ko' || (f.health <= 0 && (match.roundState !== 'fight' || (match.finish && match.finish.vic === f.id)))) {

      if (p.state === 'slain') {
        p.t++;

          if (p.y > 0) { p.vy -= 0.9; p.y = Math.max(0, p.y + p.vy); p.x += p.vx; p.vx *= 0.94; }
          else { p.lie = Math.min(1, p.lie + 1 / 12); p.vx *= 0.7; p.x += p.vx; }
        }
        p.x = DW.clamp(p.x, -(DW.CONFIG.STAGE_HALF_WIDTH - 16), DW.CONFIG.STAGE_HALF_WIDTH - 16);

      return;
    }
    if (match.roundState !== 'fight' && match.roundState !== 'ko') return;

      if (p.state !== 'seqatk') { p.state = 'seqatk'; p.t = 0; p.seqFrom = [p.x, p.y]; }
      // Update 11: the Level 3 sequence scripts the puppet's path (pX forward of where she started, pY height); it
      // TRAVELS smoothly between keys (eased), blending in from wherever it was. pHit keys swing its blade.
      if (keys.some(k => k.pX !== undefined)) {

        const hk = keys.find(q => q.f === S.t && q.pHit); if (hk) p.slashT = 8; if (p.slashT > 0) p.slashT--;

      }

            if (A.airCut) { const hb = DW.worldBox(opp, opp.hurtbox()); glide(tx, DW.clamp(hb.y + hb.h - 4, C.groundY + 4, Math.max(C.groundY + 4, p.y)), 12); p.slashT = 6; }   // Update 15: drops to chest height and cleaves down-and-across — never sinks to a sweep (stays above groundY)

      }

        if (p.y > 8) { p.vy -= 0.8; p.y = Math.max(8, p.y + p.vy); p.x += p.vx; p.vx *= 0.9; }

        break;
      case 'reform':
        { const [tx, ty] = this.sideTarget(f, opp); p.x = tx; p.y = ty; }
        if (p.t >= C.reformFrames) { this.setState(p, 'side'); p.hp = C.durability; p.regenT = 0; }

  },

  // Update 11 — Level 1 Kamikakushi, frame by frame (p.t counts from the command). Deterministic.

    if (fr <= 4) {                                   // SINK: melts down into its own shadow
      p.y = Math.max(0, p.from[1] * (1 - fr / 4)); p.hide = fr / 4;
    } else if (fr <= 8) {                            // the shadow RACES along the floor to under the opponent
      const tx = DW.clamp(opp.x, -lim, lim), k = (fr - 4) / 4; p.x += (tx - p.x) * Math.min(1, k * 0.7 + 0.3); p.y = 0; p.hide = 1;
      p.facing = Math.sign(opp.x - f.x) || f.facing;
      if (fr === 8) match.emit({ type: 'kamierupt', who: f.id, x: p.x, y: 0 });
    } else if (fr <= 16) {                           // ERUPT: bursts up through them, blade-claw first (stab ×2)
      p.hide = 0; p.y = Math.min(140, p.y + 18); p.x += (opp.x - p.x) * 0.3; p.spin = 0;

    } else if (fr <= 34) {                           // corkscrew heel SPIKE down onto them
      p.spin = Math.PI * 2 + (fr - 26) * 0.9; p.y = Math.max(30, p.y - 16); p.x += (opp.x - p.x) * 0.35;
      this.tryPhaseHit(f, p, opp, A, 'spike', match);
    } else { p.spin = 0; p.hide = 0; this.setState(p, 'recover'); p.atk = null; return; }
  },
  // one hit-phase of a scripted puppet attack: its own hitbox / hit count / properties
  tryPhaseHit(f, p, opp, A, name, match) {   // (phase stored by NAME so Wi-Fi snapshots restore it exactly)
    const ph = A.phases[name];
    if (p.phase !== name) { p.phase = name; p.hitsLeft = ph.hits; p.cool = 0; }

  },
  hitbox(p, A) { const b = A.hitbox; return { x: p.facing > 0 ? p.x + b.x : p.x - b.x - b.w, y: p.y + b.y, w: b.w, h: b.h }; },

  tryHit(f, p, opp, A, match) {
    if (p.hitsLeft <= 0 || p.cool-- > 0) return;
    if (opp.isInvulnerable() || opp.state === 'ko' || opp.state === 'cine') return;
    if (!DW.overlap(this.hitbox(p, A), DW.worldBox(opp, opp.hurtbox()))) return;
    p.hitsLeft--; p.cool = A.interval || 99; p.hits++;

    if (props.height === 'low' && p.y > DW.PUPPET.groundY) props = Object.assign({}, props, { height: 'mid', low: false });   // Update 15: an airborne puppet can never hit low

    if (A.weak && !relaunched) match.combos[f.id].puppetLaunch = true;

  },

  // Update 9: an opponent's strike or projectile touched the puppet. It loses durability (a super takes it all);
  // at 0 it breaks and is out for a while, otherwise it is staggered (an attack in progress is cancelled).
  // Returns true if the hit was absorbed by the puppet (projectiles are then consumed).
  hitPuppet(f, by, match, dmg = 1) {
    const p = f.puppet, C = DW.PUPPET; if (!p || !this.vulnerable(p)) return false;

    match.emit({ type: 'puppetdmg', who: f.id, by: by.id, hp: p.hp, max: C.durability, x: p.x, y: p.y, interrupted: was === 'atk' });
    return true;
  },
  breakPuppet(f, by, match) {
    const p = f.puppet; if (!p || !this.vulnerable(p)) return false;
    this.setState(p, 'down'); p.atk = null; p.hp = 0; p.vx = (Math.sign(p.x - by.x) || 1) * 4; p.vy = 4; p.hitstop = 8;
    match.emit({ type: 'puppetbreak', who: f.id, by: by.id, x: p.x, y: p.y });
    return true;
  },
};
