<script>/* src/core/match.js */
// DARK WAR — Match: owns fighters, projectiles/traps, rounds, timer, super freeze and cinematics.
// step(inputs) is the only way the game moves forward; same inputs -> same result (rollback-ready).
var DW = (globalThis.DW = globalThis.DW || {});

DW.START_X = 85;

DW.Match = class {
  constructor(opts = {}) {
    this.mode = opts.mode || 'training';            // 'training' | 'versus' | 'tutorial'
    const c0 = DW.CHARACTERS[opts.p1 || 'ren'], c1 = DW.CHARACTERS[opts.p2 || 'ren'];
    this.fighters = [new DW.Fighter(0, c0, -DW.START_X, this), new DW.Fighter(1, c1, DW.START_X, this)];
    this.mirror = (opts.p1 || 'ren') === (opts.p2 || 'ren');
    // Update 3: per-player control scheme ('traditional' | 'modern') and colour variation (palette index)
    const sch = opts.schemes || [], col = opts.colors || [];
    this.fighters.forEach((f, i) => { f.scheme = sch[i] || 'traditional'; f.colorIndex = col[i] || 0; f.pal = DW.paletteFor(f.char, f.colorIndex); });
    this.training = Object.assign({ autoRefill: true, infiniteMeter: false, aiHealth: 'normal' }, opts.training || {});   // Update 12: aiHealth = 'normal' | percent 1-100
    this.frame = 0; this.events = [];
    this.entities = [];
    this.combos = [DW.newCombo(), DW.newCombo()];
    this.lastCombo = [null, null];
    this.lastFrameInfo = null;
    this.refillAt = [-1, -1];
    this.superFreeze = 0; this.superInfo = null;
    this.cinematic = null; this.finish = null; this.finishShown = false;
    this.wins = [0, 0]; this.round = 1; this.result = null;
    this.timer = DW.CONFIG.round.seconds * 60;
    this.roundState = this.mode === 'versus' ? 'intro' : 'fight';
    this.introFrames = this.mode === 'versus' ? (opts.matchIntro || 0) : 0;   // pre-round VS/character intros (presentation)
    this.stateTimer = this.mode === 'versus' ? 90 + this.introFrames : 0;
    if (this.introFrames) this.emit({ type: 'matchintro', p1: this.fighters[0].char.id, p2: this.fighters[1].char.id });
    else if (this.mode === 'versus') this.emit({ type: 'round', round: 1 });
  }
  skipIntro() { if (this.roundState === 'intro' && this.round === 1 && this.stateTimer > 91) { this.stateTimer = 91; this.introSkipped = true; } }

  opponentOf(f) { return this.fighters[1 - f.id]; }
  emit(e) { e.frame = this.frame; this.events.push(e); }
  drainEvents() { const e = this.events; this.events = []; return e; }

  juggleGravity(victimId) {
    const c = this.combos[1 - victimId], cc = DW.CONFIG.combo;
    if (!c.active) return 1;
    return Math.min(cc.juggleGravityMax, 1 + cc.juggleGravityPerHit * c.hits);
  }

  resetPositions(keepMeter) {
    this.fighters[0].reset(-DW.START_X, keepMeter); this.fighters[1].reset(DW.START_X, keepMeter);
    this.combos = [DW.newCombo(), DW.newCombo()];
    this.entities = []; this.superFreeze = 0; this.cinematic = null; this.finish = null; this.finishShown = false; this.moonBroken = false; this.hidePuppets = false;   // Update 12: once per round (13: the moon comes back)
  }

  // ---------------------------------------------------------------- supers / cinematic
  startSuperFreeze(f, m) {
    this.superFreeze = m.superFreeze || 30;
    this.superInfo = { who: f.id, level: m.super, name: m.name, frames: this.superFreeze };
    this.emit({ type: 'super', who: f.id, level: m.super, name: m.name, x: f.x, y: f.y });
  }

  startCinematic(a, d) {
    this.cinematic = DW.Cinematic.create(a, d, this);
    this.entities = [];
    this.emit({ type: 'cinematic', who: a.id, char: a.char.id });
  }

  onKO(a, d, viaFinisher) {
    this.emit({ type: 'ko', who: a.id, finisher: !!viaFinisher });
    if (this.mode === 'versus') {
      if (this.roundState !== 'fight') return;
      this.wins[a.id]++;
      this.roundState = 'ko'; this.stateTimer = DW.CONFIG.round.koPause;
      this.roundWinner = a.id;
    } else {
      this.roundState = 'ko'; this.stateTimer = 110;   // training: brief pause then reset
    }
  }

  // ---------------------------------------------------------------- entities
  spawnProjectile(owner, def, at) {
    const m = owner.move || { id: def.pillar ? '6S' : 'proj', name: def.pillar ? 'Kai!' : 'Spell', startup: 0, active: 1, recovery: 0 };   // seals ignited while idle
    const opp = this.opponentOf(owner);
    // Update 8: atOpponent (spell opens under the opponent), at (explicit spot, e.g. a seal), delay (visible
    // warning before it can hit), ward (eats projectiles, never hits people)
    const x0 = at ? at.x : def.atOpponent ? DW.clamp(opp.x, -DW.CONFIG.STAGE_HALF_WIDTH + 30, DW.CONFIG.STAGE_HALF_WIDTH - 30) : owner.x + owner.facing * def.x;
    const y0 = at ? def.y : def.atOpponent ? def.y : owner.y + def.y;
    this.entities.push({
      kind: 'proj', owner: owner.id, serial: owner.moveSerial, def,
      x: x0, y: y0, vx: (def.vx || 0) * owner.facing, vy: def.vy || 0,
      w: def.w, h: def.h, life: def.life, age: 0, facing: owner.facing,
      hitsLeft: def.hits || 1, cooldown: 0, hitstop: 0, beam: !!def.beam, strength: def.strength || 1,
      props: Object.assign({ id: m.id, name: m.name, kind: 'special', startup: m.startup, active: m.active, recovery: m.recovery, super: m.super }, def),
    });
    if (!def.shock) this.emit({ type: 'projectile', who: owner.id, beam: !!def.beam, kunai: !!def.kunai, super: m.super, ward: !!def.ward, pillar: !!def.pillar, x: x0, y: y0 });
  }

  // ---------------------------------------------------------------- Update 8: Kurogane's spiritual seals
  spawnSeal(owner, def) {
    const mine = this.entities.filter(e => e.kind === 'seal' && e.owner === owner.id);
    if (mine.length >= 3) { const old = mine[0]; old.life = 0; this.entities = this.entities.filter(e => e !== old); this.emit({ type: 'sealgone', who: owner.id, x: old.x }); }
    const lim = DW.CONFIG.STAGE_HALF_WIDTH - 30;
    const x = DW.clamp(owner.x + owner.facing * def.x, -lim, lim);
    this.entities.push({ kind: 'seal', owner: owner.id, serial: owner.moveSerial, def, x, y: 0, vx: 0, vy: 0, w: 56, h: 18, life: 900, age: 0, arm: 18, facing: owner.facing, hitstop: 0, props: {} });
    this.emit({ type: 'sealset', who: owner.id, x, count: Math.min(3, mine.length + 1) });
  }
  // one seal erupts as a vertical pillar (Kai!, Onibi passing over it, Level 1)
  eruptSeal(seal, owner, pillar, delay) {
    seal.life = 0;
    const d = Object.assign({}, pillar, { delay: delay !== undefined ? delay : pillar.delay });
    this.spawnProjectile(owner, d, { x: seal.x });
    this.emit({ type: 'sealburst', who: owner.id, x: seal.x, delay: d.delay });
  }
  detonate(owner, pillar, now) {
    const seals = this.entities.filter(e => e.kind === 'seal' && e.owner === owner.id && e.life > 0);
    for (const sl of seals) this.eruptSeal(sl, owner, pillar, now ? 2 : undefined);
    this.emit({ type: 'kai', who: owner.id, n: seals.length, x: owner.x, y: owner.y, air: owner.air, targets: owner.air ? seals.map(sl => sl.x) : null });   // (Update 12: air Kai! — bolts to each seal)
  }

  spawnTrap(owner, def) {
    this.entities = this.entities.filter(e => !(e.kind === 'trap' && e.owner === owner.id));   // one trap at a time
    const lim = DW.CONFIG.STAGE_HALF_WIDTH - def.w / 2;                                           // never outside the stage
    this.entities.push({
      kind: 'trap', owner: owner.id, serial: owner.moveSerial, def,
      x: DW.clamp(owner.x + owner.facing * def.x, -lim, lim), y: 0, vx: 0, vy: 0, w: def.w, h: def.h, life: def.life, age: 0, arm: def.arm,
      facing: owner.facing, hitstop: 0,
      props: Object.assign({ id: owner.moveId, name: owner.move.name, kind: 'special', startup: 0, active: 1, recovery: 0 }, def),
    });
    this.emit({ type: 'trapset', who: owner.id, x: this.entities[this.entities.length - 1].x, dist: def.x });
  }

  stepEntities() {
    const W = DW.CONFIG.STAGE_HALF_WIDTH;
    for (const e of this.entities) {
      if (e.hitstop > 0) { e.hitstop--; continue; }
      e.age++; e.life--;
      const owner = this.fighters[e.owner];
      if (e.kind === 'meteor') { this.stepMeteor(e, owner); continue; }   // Update 12
      if (e.beam) {
        if (owner.state !== 'attack' || owner.moveSerial !== e.serial) { e.life = 0; continue; }
        e.facing = owner.facing;
        e.x = owner.x + owner.facing * e.def.x; e.y = owner.y + e.def.y;
      } else { e.x += e.vx; e.y += e.vy; }
      if (e.kind === 'proj' && (Math.abs(e.x) > W + 80 || e.y < -20)) e.life = 0;
      // Onibi ignites its owner's seals as it passes over them
      if (e.kind === 'proj' && e.def.ignite && e.y < 140) for (const sl of this.entities) {
        if (sl.kind === 'seal' && sl.owner === e.owner && sl.life > 0 && Math.abs(sl.x - e.x) < 26) this.eruptSeal(sl, owner, owner.char.moves['6S'].pillar, 3);
      }
    }
    // projectile clashes
    const projs = this.entities.filter(e => e.kind === 'proj' && e.life > 0 && e.age >= (e.def.delay || 0));
    for (let i = 0; i < projs.length; i++) for (let j = i + 1; j < projs.length; j++) {
      const p = projs[i], q = projs[j];
      if (p.owner === q.owner) continue;
      if (DW.overlap(this.entBox(p), this.entBox(q))) {
        const sp = p.strength, sq = q.strength;
        p.strength -= sq; q.strength -= sp;
        if (p.strength <= 0) p.life = 0; if (q.strength <= 0) q.life = 0;
        this.emit({ type: 'clash', x: (p.x + q.x) / 2, y: (p.y + q.y) / 2 });
      }
    }
    // hits
    for (const e of this.entities) {
      if (e.life <= 0 || e.hitstop > 0) continue;
      if (e.cooldown > 0) { e.cooldown--; continue; }
      const owner = this.fighters[e.owner], v = this.opponentOf(owner);
      if (e.kind === 'meteor') continue;
      if (e.def.ward || e.age < (e.def.delay || 0)) continue;              // wards never hit people; delayed spells wait
      if (e.kind === 'seal') {   // BIND: an opponent who steps onto an armed seal while free can't move for a moment
        const free = ['idle', 'walkF', 'walkB', 'crouch', 'dash', 'backdash', 'landing'].includes(v.state);
        if (e.age >= e.arm && !e.spent && free && !v.air && !this.combos[owner.id].active && Math.abs(v.x - e.x) < e.w / 2 + 10) {
          e.spent = true; v.bound = 40;   // the seal stays (dimmed): it can still be detonated — bind → Kai! is his set-up v.vx = 0; if (v.state === 'dash' || v.state === 'backdash') v.setState('idle');
          this.emit({ type: 'sealbind', who: owner.id, victim: v.id, x: e.x });
        }
        continue;
      }
      if (v.puppet && e.kind === 'proj' && DW.Puppet.vulnerable(v.puppet) && DW.overlap(this.entBox(e), DW.Puppet.box(v.puppet))) {   // projectiles break the puppet too
        DW.Puppet.hitPuppet(v, owner, this, e.props.super ? 99 : 1); if (!e.beam) e.life = 0; continue;   // Update 9: durability
      }
      if (v.isInvulnerable() || v.state === 'ko' || v.state === 'cine') continue;
      // Update 13 — forward ground dashes pass THROUGH projectiles during the dash's travel window (per character,
      // dash.ground.projThrough = [from, to] state frames). Only ordinary projectiles: Super projectiles still hit,
      // and so do strikes and throws; the dash's recovery is fully vulnerable. Back dashes get nothing.
      // Update 14 — Shin's Water Ryusui (move.projCut = [from, to]) cuts ordinary projectiles apart while she advances.
      if (e.kind === 'proj' && v.state === 'attack' && v.move && v.move.projCut && v.inRange(v.move.projCut) && !(e.props && e.props.super) && DW.overlap(this.entBox(e), DW.worldBox(v, v.hurtbox()))) {
        e.life = 0; this.emit({ type: 'projcut', who: v.id, x: e.x, y: e.y }); continue;
      }
      if (e.kind === 'proj' && v.state === 'dash' && !(e.props && e.props.super) && DW.Fighter.dashPassesProj(v)) {
        if (DW.overlap(this.entBox(e), DW.worldBox(v, v.hurtbox())) && !e.passed) { e.passed = true; this.emit({ type: 'dashthrough', who: v.id, x: v.x, y: e.y }); }
        continue;
      }
      if (e.kind === 'trap') {
        if (e.age < e.arm || v.air) continue;
      }
      if (!DW.overlap(this.entBox(e), DW.worldBox(v, v.hurtbox()))) continue;
      e.hitsLeft = (e.hitsLeft || 1) - 1;
      DW.Combat.resolve({ owner, facing: e.facing, x: e.x, y: e.y - 40, proj: true, entity: e, finalHit: e.hitsLeft <= 0 }, v, e.props, this);
      if (e.def.meteors && (v.state === 'airhit' || v.state === 'hitstun')) this.spawnMeteors(owner, v, e.def.meteors);   // Update 12: Sanki-bi
      e.cooldown = e.def.interval || 6;
      if (e.hitsLeft <= 0 && !e.beam) e.life = 0;
      if (e.kind === 'trap') { e.life = 0; this.emit({ type: 'trap', x: e.x, victim: v.id, who: owner.id }); }
    }
    this.entities = this.entities.filter(e => e.life > 0);
  }
  // Update 12 — Kurogane's Sanki-bi: after the fireball HITS (never on block / whiff), the victim is held aloft and
  // two meteors fall on them. Each meteor tracks the victim exactly and lands on its frame (20 and 40 after the
  // hit) while they are still in hitstun — guaranteed, whatever knockback or position. Deterministic.
  spawnMeteors(owner, v, M) {
    v.floatT = M.hold;
    // Update 15: they come in DIAGONALLY from the upper corner on Kurogane's own side (side = where he stands
    // relative to the victim at the moment of the hit), steepening into the victim — still homing, still landing on
    // their frame, so they connect the same way from either side.
    const side = Math.sign(owner.x - v.x) || -owner.facing;
    for (const d of M.list) this.entities.push({ kind: 'meteor', owner: owner.id, target: v.id, x: v.x + side * 400, y: v.y + 470, vx: 0, vy: 0, w: 60 * d.size, h: 60 * d.size, facing: owner.facing, side,
      age: 0, life: d.at + 2, at: d.at, def: d, hitstop: 0, cooldown: 0 });
    this.emit({ type: 'meteorcall', who: owner.id, x: v.x, y: v.y });
  }
  stepMeteor(e, owner) {
    const v = this.fighters[e.target], left = e.at - e.age;
    const L = Math.max(0, left), px = e.x, py = e.y;
    e.x = v.x + (e.side || 0) * L * 20; e.y = v.y + 70 + L * 20;   // a 45° dive from Kurogane's upper corner onto them (homing)
    e.vx = e.x - px; e.vy = e.y - py;
    if (left > 0) return;
    e.life = 0;
    if (v.health > 0 && (v.state === 'airhit' || v.state === 'hitstun')) {
      const d = e.def, props = { id: 'L1', name: 'Sanki-bi', kind: 'special', super: 1, startup: 9, active: 1, recovery: 30, height: 'mid', unblockable: true, damage: d.damage, hitstun: 60, push: 0,
        air_hit: d.last ? { vy: -12, vx: 2, hitstun: 50 } : { vy: 3, vx: 0.4, hitstun: 60 }, meteor: true };
      DW.Combat.resolve({ owner, facing: owner.facing, x: v.x, y: v.y + 60, proj: true, entity: e, finalHit: true }, v, props, this);
      if (d.last) v.floatT = 0;
      this.emit({ type: 'meteorhit', who: owner.id, x: v.x, y: v.y + 60, size: d.size, last: !!d.last });
    }
  }
  entBox(e) {
    if (e.beam) return { x: e.facing > 0 ? e.x : e.x - e.w, y: e.y - e.h / 2, w: e.w, h: e.h };
    return { x: e.x - e.w / 2, y: e.y - e.h / 2, w: e.w, h: e.h };
  }

  // ---------------------------------------------------------------- main step
  step(inputs) {
    this.frame++;
    const [a, b] = this.fighters;
    const live = this.roundState === 'fight';
    const i0 = live ? inputs[0] : null, i1 = live ? inputs[1] : null;
    a.input.feed(i0 || DW.emptyInputFrame(), a.clock + 1, this.frame);
    b.input.feed(i1 || DW.emptyInputFrame(), b.clock + 1, this.frame);

    if (this.cinematic) {
      if (DW.Cinematic.step(this.cinematic, this)) {
        const c = this.cinematic; this.cinematic = null;
        c.vic.setState('ko'); c.vic.health = 0; c.vic.air = false; c.vic.y = 0;
        c.att.setState('win');
        // Update 12 — CINEMATIC FINISH: a lethal Level 3 whose Ultimate (and its finishing cinematic) has fully
        // played gets a separate finish beat before the round ends. Once per round. Ids only (netplay snapshots).
        // Update 13 — character CINEMATIC FINISH, only when this KO wins the match (Training: always). Once per round.
        if (DW.Finish.eligible(this, c.att)) { this.finishShown = true; this.finish = DW.Finish.create(c.att, c.vic, this); this.emit({ type: 'cinefinish', who: c.att.id, char: c.att.char.id, x: c.att.x, y: c.att.y }); }
        else this.onKO(c.att, c.vic, true);
      }
      return;
    }
    if (this.finish) {   // the round-end / victory flow waits until the finish is over
      if (DW.Finish.step(this.finish, this)) { const F = this.finish; this.finish = null; if (F.kind === 'ayakashi') this.hidePuppets = true;   /* Update 15: no Kagemaru after her finish */ this.onKO(this.fighters[F.att], this.fighters[F.vic], true); }
      return;
    }
    if (this.roundState === 'intro') {
      if (--this.stateTimer <= 0) { this.roundState = 'fight'; this.emit({ type: 'fight' }); }
      else if (this.introFrames && this.round === 1 && this.stateTimer === 90) this.emit({ type: 'round', round: 1 });
      return;
    }
    if (this.superFreeze > 0) { this.superFreeze--; return; }

    a.update(b, this);
    b.update(a, this);
    this.stepEntities();
    this.resolvePush();
    this.clampToStage();
    DW.Combat.checkHits(this);
    this.updateCombos();
    if (this.training.infiniteMeter && this.mode !== 'versus') for (const f of this.fighters) { f.meter = 300; if (f.state !== 'break') f.brk = DW.CONFIG.break.max; }

    if (this.roundState === 'fight' && this.mode === 'versus') {
      if (this.timer === 10 * 60 + 1) this.emit({ type: 'timelow' });
      if (--this.timer <= 0) {
        this.timer = 0;
        const r0 = a.health / a.char.health, r1 = b.health / b.char.health;
        const w = r0 === r1 ? null : (r0 > r1 ? a : b);
        this.emit({ type: 'text', who: -1, text: 'TIME', big: true });
        if (w) { this.wins[w.id]++; this.roundWinner = w.id; } else { this.wins[0]++; this.wins[1]++; this.roundWinner = -1; }
        this.roundState = 'ko'; this.stateTimer = DW.CONFIG.round.koPause;
      }
    }
    if (this.roundState === 'ko') {
      const w = this.fighters[this.roundWinner];
      if (w && ['idle', 'walkF', 'walkB', 'crouch'].includes(w.state)) w.setState('win');
      if (--this.stateTimer <= 0) this.nextRound();
    }
  }

  // Update 12 — Training "AI Health": the opponent's (P2's) health cap in Training only. 'normal' = the classic
  // training dummy (refills to full, only a Level 3 finisher can KO it). A percentage sets its health to that share
  // of its max (applied at once, after every refill and after every reset) and makes KOs real so L1s and normal
  // hits can finish it. The player's health is never touched.
  aiHealthCap() { const v = this.training.aiHealth, f = this.fighters[1]; return this.mode === 'training' && v !== 'normal' && v > 0 ? Math.max(1, Math.round(f.char.health * Math.min(100, v) / 100)) : f.char.health; }
  realTrainingKO(d) { return this.mode === 'training' && d.id === 1 && this.training.aiHealth !== 'normal'; }
  applyAiHealth() { if (this.mode !== 'training') return; const f = this.fighters[1]; if (f.state === 'ko') return; f.health = this.aiHealthCap(); }
  nextRound() {
    if (this.mode !== 'versus') { this.resetPositions(true); this.applyAiHealth(); this.roundState = 'fight'; return; }
    const need = DW.CONFIG.round.winsNeeded;
    if (this.wins[0] >= need || this.wins[1] >= need) {
      const winner = this.wins[0] === this.wins[1] ? -1 : (this.wins[0] > this.wins[1] ? 0 : 1);
      this.result = { winner, wins: this.wins.slice() };
      this.roundState = 'over';
      this.emit({ type: 'matchover', winner });
      return;
    }
    this.round++;
    this.resetPositions(true);
    this.timer = DW.CONFIG.round.seconds * 60;
    this.roundState = 'intro'; this.stateTimer = 90;
    this.emit({ type: 'round', round: this.round });
  }

  resolvePush() {
    const [a, b] = this.fighters;
    if (a.isVanished() || b.isVanished() || a.holdFrames > 0 || b.holdFrames > 0 || a.seq || b.seq) return;
    if (Math.abs(a.y - b.y) > 90) return;
    const minDist = (a.char.pushWidth + b.char.pushWidth) / 2;
    const dx = b.x - a.x;
    if (Math.abs(dx) >= minDist) return;
    if (a.air && b.air) return;
    if (a.air || b.air) { const air = a.air ? a : b; if (air.y > 60) return; }
    const overlap = minDist - Math.abs(dx);
    const s = dx === 0 ? (a.facing > 0 ? 1 : -1) : Math.sign(dx);
    a.x -= s * overlap / 2; b.x += s * overlap / 2;
  }

  clampToStage() {
    const W = DW.CONFIG.STAGE_HALF_WIDTH, MAX_SEP = DW.CONFIG.MAX_SEPARATION;
    for (const f of this.fighters) { const lim = W - f.char.pushWidth / 2; f.x = DW.clamp(f.x, -lim, lim); }
    const [a, b] = this.fighters;
    const sep = Math.abs(a.x - b.x);
    if (sep > MAX_SEP) { const ex = (sep - MAX_SEP) / 2, s = Math.sign(b.x - a.x); a.x += s * ex; b.x -= s * ex; }
  }

  updateCombos() {
    for (let i = 0; i < 2; i++) {
      const c = this.combos[i], victim = this.fighters[1 - i];
      if (!c.active || victim.hitstop > 0) continue;
      if (victim.state !== 'hitstun' && victim.state !== 'airhit' && victim.state !== 'grabbed') {
        c.active = false; c.endFrame = this.frame;
        this.lastCombo[i] = { hits: c.hits, damage: c.damage, jcUsed: c.jcUsed, frame: this.frame };
        this.emit({ type: 'comboend', who: i, hits: c.hits, damage: c.damage, broken: !!c.broken });
        if (this.mode !== 'versus' && this.training.autoRefill && victim.state !== 'ko') this.refillAt[1 - i] = this.frame + 50;
      }
    }
    for (let i = 0; i < 2; i++) {
      if (this.refillAt[i] > 0 && this.frame >= this.refillAt[i]) {
        const f = this.fighters[i];
        if (!this.combos[1 - i].active) f.health = i === 1 ? this.aiHealthCap() : f.char.health;
        this.refillAt[i] = -1;
      }
    }
  }
};

</script>
<script>/* src/systems/cinematic.js */
// DARK WAR — Cinematic Level 3 finishers.
// A dedicated combat state: when a Level 3's final hit is lethal, Match hands control to a timeline.
// The timeline is part of the simulation (frame-indexed, deterministic: identical on both online peers).
// It moves the fighters, sets their cinematic poses, drives the camera and emits effect/sound cues.
// Character art is still placeholder; the timeline, camera and hooks are the real system.
var DW = (globalThis.DW = globalThis.DW || {});

const lerp = (a, b, t) => a + (b - a) * Math.max(0, Math.min(1, t));
const ease = (t) => { t = Math.max(0, Math.min(1, t)); return t * t * (3 - 2 * t); };

DW.Cinematic = {
  create(att, vic, match) {
    for (const f of [att, vic]) { f.setState('cine'); f.clearMove(); f.vx = f.vy = 0; f.hitstop = 0; f.flash = 0; f.invuln = 0; f.holdFrames = 0; f.pendingBounce = null; }
    const script = this.scripts[att.char.id] || this.scripts.ren;
    const c = { t: 0, att, vic, script, length: script.length, ax: att.x, ay: att.y, vx0: vic.x, vy0: vic.y,
      dir: att.facing, cam: { x: att.x, y: 60, zoom: 1.8 }, letterbox: 0, tint: null, slowmo: false, title: null };
    att.cinePose = 'charge'; vic.cinePose = 'hit';
    return c;
  },
  // returns true when finished
  step(c, match) {
    c.t++;
    c.letterbox = Math.min(1, c.t / 12);
    if (c.t > c.length - 20) c.letterbox = Math.max(0, (c.length - c.t) / 20);
    c.script.run(c, match, c.t);
    return c.t >= c.length;
  },

  scripts: {
    // SHIRANUI REN — lethal Kokuryu Tensho epilogue (Update 4). The strike sequence already played every
    // beat in-game; the camera holds on the black-flame pillar, Ren turns his back, and the flame collapses.
    ren: { length: 130, run(c, m, t) {
      const { att, vic, dir } = c;
      vic.cinePose = 'down'; vic.y = 0; vic.air = false; att.y = 0; att.air = false;
      if (t === 1) { m.emit({ type: 'cine_fx', fx: 'pillar', x: vic.x, power: 14 }); m.emit({ type: 'cine_fx', fx: 'kanji', text: '滅', who: att.id }); }
      if (t < 50) {
        att.cinePose = 'stance'; c.cam = { x: vic.x, y: 50, zoom: lerp(1.6, 2.0, t / 50) }; c.tint = { color: '20,0,10', a: 0.5 };
        if (t % 8 === 0) m.emit({ type: 'cine_fx', fx: 'aura', who: att.id, x: vic.x, y: 40 });
      } else if (t < 90) {
        att.cinePose = 'sheathe'; att.facing = -dir;
        c.cam = { x: lerp(vic.x, att.x, ease((t - 50) / 25)), y: 50, zoom: lerp(2.0, 2.3, ease((t - 50) / 30)) };
        if (t === 62) { m.emit({ type: 'voicecue', who: att.id, cue: 'finisher' }); m.emit({ type: 'cine_sfx', sfx: 'boom' }); m.emit({ type: 'cine_fx', fx: 'shake', power: 8 }); }
        c.tint = { color: '0,0,0', a: 0.6 };
      } else {
        att.cinePose = 'win'; c.tint = null; c.cam = { x: (att.x + vic.x) / 2, y: 40, zoom: lerp(2.3, 1.5, ease((t - 90) / 30)) };
        if (t === 94) m.emit({ type: 'cine_fx', fx: 'title', text: 'FINISH' });
      }
    } },

    // ONIMARU — lethal Hyakki Yako epilogue. The grab sequence already played every beat in-game; the
    // cinematic lingers on the crater while the dust settles, then Onimaru rises into a roaring finishing pose.
    onimaru: { length: 150, run(c, m, t) {
      const { att, vic } = c;
      vic.cinePose = 'down'; vic.y = 0; vic.air = false;
      if (t === 1) { m.emit({ type: 'cine_fx', fx: 'impact', x: vic.x, y: 0, power: 14, crater: true }); m.emit({ type: 'cine_fx', fx: 'kanji', text: '鬼', who: att.id }); }
      if (t < 60) {
        att.cinePose = 'land'; att.y = Math.max(0, att.y - 6); att.air = att.y > 0;
        c.cam = { x: vic.x, y: 10, zoom: lerp(2.1, 2.4, t / 60) }; c.tint = { color: '40,10,0', a: 0.4 };
        if (t % 10 === 0) m.emit({ type: 'cine_fx', fx: 'dust', x: vic.x });
      } else if (t < 100) {
        att.cinePose = t < 78 ? 'land' : 'roar'; att.y = 0; att.air = false;
        c.cam = { x: lerp(vic.x, att.x, ease((t - 60) / 25)), y: 40, zoom: lerp(2.4, 1.7, ease((t - 60) / 25)) };
        if (t === 78) { m.emit({ type: 'cine_sfx', sfx: 'roar' }); m.emit({ type: 'voicecue', who: att.id, cue: 'finisher' }); m.emit({ type: 'cine_fx', fx: 'shake', power: 10 }); }
        c.tint = { color: '60,0,0', a: 0.3 };
      } else {
        att.cinePose = 'roar';
        c.cam = { x: att.x, y: 50, zoom: lerp(1.7, 1.9, ease((t - 100) / 40)) }; c.tint = null;
        if (t === 104) m.emit({ type: 'cine_fx', fx: 'title', text: 'FINISH' });
      }
    } },

    // KASUMI — lethal Mugen Kage-bashigo epilogue (Update 4): the opponent has fallen; Kasumi sheathes her
    // blade with her back turned, the last mist-clones dissolve into petals, and every cut lands at once.
    kasumi: { length: 120, run(c, m, t) {
      const { att, vic, dir } = c;
      vic.cinePose = 'down'; vic.y = 0; vic.air = false; att.y = 0; att.air = false;
      c.tint = { color: '10,0,30', a: t < 60 ? 0.55 : 0.3 };
      if (t < 60) {
        att.cinePose = 'sheathe'; att.facing = -dir;
        c.cam = { x: att.x, y: 50, zoom: lerp(1.6, 2.3, ease(t / 40)) };
        if (t % 9 === 0) m.emit({ type: 'cine_fx', fx: 'afterimage', who: att.id, x: att.x - dir * (40 + t), y: 30 + (t % 27) });
        if (t === 50) m.emit({ type: 'cine_sfx', sfx: 'sheathe' });
      } else {
        if (t === 60) { m.emit({ type: 'cine_fx', fx: 'cutall', x: vic.x, y: 40 }); m.emit({ type: 'cine_fx', fx: 'kanji', text: '霞', who: att.id }); m.emit({ type: 'cine_sfx', sfx: 'boom' }); m.emit({ type: 'voicecue', who: att.id, cue: 'finisher' }); }
        att.cinePose = 'win';
        c.tint = t < 75 ? { color: '220,200,255', a: lerp(0.9, 0, (t - 60) / 15) } : null;
        c.cam = { x: (att.x + vic.x) / 2, y: 40, zoom: lerp(2.3, 1.4, ease((t - 60) / 30)) };
        if (t === 68) m.emit({ type: 'cine_fx', fx: 'title', text: 'FINISH' });
      }
    } },
    // AKATSUKI (Update 8) — the Ichimonji already cut everything; she stands with her back turned, sheathes the
    // last inch of the blade, and the dawn breaks across the screen with one cut.
    akatsuki: { length: 120, run(c, m, t) {
      const { att, vic, dir } = c;
      vic.cinePose = 'down'; vic.y = 0; vic.air = false; att.y = 0; att.air = false;
      if (t < 58) {
        att.cinePose = 'ak_after'; att.facing = -dir; c.tint = { color: '20,10,30', a: 0.55 };
        c.cam = { x: att.x, y: 60, zoom: lerp(1.7, 2.3, ease(t / 45)) };
        if (t === 50) m.emit({ type: 'cine_sfx', sfx: 'sheathe' });
      } else {
        if (t === 58) { m.emit({ type: 'cine_fx', fx: 'cutall', x: vic.x, y: 40 }); m.emit({ type: 'cine_fx', fx: 'kanji', text: '暁', who: att.id }); m.emit({ type: 'cine_sfx', sfx: 'boom' }); m.emit({ type: 'voicecue', who: att.id, cue: 'finisher' }); }
        att.cinePose = 'win';
        c.tint = t < 74 ? { color: '255,190,120', a: lerp(0.9, 0, (t - 58) / 16) } : null;
        c.cam = { x: (att.x + vic.x) / 2, y: 40, zoom: lerp(2.3, 1.4, ease((t - 58) / 30)) };
        if (t === 66) m.emit({ type: 'cine_fx', fx: 'title', text: 'FINISH' });
      }
    } },

    // KUROGANE (Update 8) — the Four-Gods seal closes over the fallen opponent; he shuts the grimoire.
    kurogane: { length: 130, run(c, m, t) {
      const { att, vic } = c;
      vic.cinePose = 'down'; vic.y = 0; vic.air = false; att.y = 0; att.air = false;
      if (t === 1) { m.emit({ type: 'cine_fx', fx: 'pillar', x: vic.x, power: 12 }); m.emit({ type: 'cine_fx', fx: 'kanji', text: '滅', who: att.id }); }   // Update 11: Tenmetsu (滅 = annihilate)
      if (t < 60) {
        att.cinePose = 'mg_raise'; c.tint = { color: '0,30,24', a: 0.5 };
        c.cam = { x: vic.x, y: 40, zoom: lerp(1.7, 2.1, ease(t / 50)) };
        if (t % 12 === 0) m.emit({ type: 'cine_fx', fx: 'aura', who: att.id, x: vic.x, y: 30 });
      } else {
        att.cinePose = t < 90 ? 'mg_book' : 'win';
        if (t === 80) { m.emit({ type: 'cine_sfx', sfx: 'boom' }); m.emit({ type: 'cine_fx', fx: 'shake', power: 8 }); m.emit({ type: 'voicecue', who: att.id, cue: 'finisher' }); }
        c.tint = null; c.cam = { x: (att.x + vic.x) / 2, y: 40, zoom: lerp(2.1, 1.5, ease((t - 60) / 30)) };
        if (t === 92) m.emit({ type: 'cine_fx', fx: 'title', text: 'FINISH' });
      }
    } },

    // AYAKASHI (Update 8) — the strings go slack; she bows like a performer at the end of the play.
    ayakashi: { length: 120, run(c, m, t) {
      const { att, vic } = c;
      vic.cinePose = 'down'; vic.y = 0; vic.air = false; att.y = 0; att.air = false;
      if (t === 1) m.emit({ type: 'cine_fx', fx: 'kanji', text: '妖', who: att.id });
      if (t < 60) { att.cinePose = 'pp_conduct'; c.tint = { color: '30,0,20', a: 0.55 }; c.cam = { x: (att.x + vic.x) / 2, y: 60, zoom: lerp(1.6, 2.0, ease(t / 50)) }; }
      else {
        att.cinePose = 'win';
        if (t === 62) { m.emit({ type: 'cine_sfx', sfx: 'boom' }); m.emit({ type: 'voicecue', who: att.id, cue: 'finisher' }); }
        c.tint = null; c.cam = { x: att.x, y: 50, zoom: lerp(2.0, 1.5, ease((t - 60) / 30)) };
        if (t === 70) m.emit({ type: 'cine_fx', fx: 'title', text: 'FINISH' });
      }
    } },
  },
};

<script>/* src/systems/finishes.js */
// DARK WAR — Update 13: character CINEMATIC FINISHES.
// Played after a lethal Level 3's own finishing cinematic, ONLY when that KO wins the match (and in Training, where
// there are no rounds). Like DW.Cinematic, every timeline is part of the deterministic simulation: it moves the two
// fighters, sets their poses and a few render-only flags (scale, rotation, alpha, "to the moon", "puppetized"…),
// drives the camera and emits cue events for sound and particles. All state is ids and numbers, so Wi-Fi snapshots
// restore it exactly. The renderer draws each finish's props (moon, dragon, glass, clones, sword, book, strings)
// purely as a function of match.finish. No damage is dealt here: the KO already happened.
var DW = (globalThis.DW = globalThis.DW || {});
(() => {
  const clamp01 = (t) => Math.max(0, Math.min(1, t));
  const lerp = (a, b, t) => a + (b - a) * clamp01(t);
  const ease = (t) => { t = clamp01(t); return t * t * (3 - 2 * t); };
  const easeIn = (t) => { t = clamp01(t); return t * t * t; };
  const span = (t, a, b) => clamp01((t - a) / (b - a));
  const FLAGS = ['cineScale', 'cineRot', 'cineAlpha', 'cineMoon', 'cineCam', 'cineSlide', 'cineHide', 'cineSquint', 'cineNoSword', 'cinePuppet', 'cineSquash', 'cineFlip'];

  DW.Finish = {
    clearFlags(f) { for (const k of FLAGS) f[k] = undefined; },
    // Is this KO allowed to play a Cinematic Finish? (lethal Level 3 already established by the caller)
    eligible(match, att) {
      if (match.finishShown) return false;
      if (match.mode === 'versus') return match.wins[att.id] + 1 >= DW.CONFIG.round.winsNeeded;   // only the match-winning round
      return match.mode === 'training';                                                              // Training: no rounds — always (to practise them)
    },
    create(att, vic, match) {
      const s = this.scripts[att.char.id] ? att.char.id : 'ren', S = this.scripts[s];
      for (const f of [att, vic]) { f.setState('cine'); f.clearMove(); f.vx = f.vy = 0; f.hitstop = 0; f.flash = 0; f.invuln = 0; f.pendingBounce = null; this.clearFlags(f); }
      // tidy unusual end positions (corner, mid-air): both grounded, the victim far enough from the wall for the scene
      const lim = DW.CONFIG.STAGE_HALF_WIDTH - (S.margin || 150);
      let dir = Math.sign(vic.x - att.x) || att.facing;
      const vx = Math.max(-lim, Math.min(lim, vic.x));
      if (Math.abs(vx - dir * (S.gap || 120)) > DW.CONFIG.STAGE_HALF_WIDTH - 40) dir = -dir;
      vic.x = vx; vic.y = 0; vic.air = false; att.y = 0; att.air = false; att.x = vx - dir * (S.gap || 120);
      att.facing = dir; vic.facing = -dir; att.cinePose = 'idle'; vic.cinePose = 'down';
      if (att.puppet) att.puppet.hidden = false;
      return { kind: s, t: 0, length: S.length, titleAt: S.titleAt, att: att.id, vic: vic.id, dir, vx, ax: att.x,
        cam: { x: (att.x + vx) / 2, y: 40, zoom: 1.6 }, roll: 0, moonHit: 0, sky: 0 };
    },
    step(F, match) {
      F.t++;
      const S = this.scripts[F.kind], att = match.fighters[F.att], vic = match.fighters[F.vic];
      S.run(F, att, vic, match, F.t);
      for (const f of [att, vic]) f.stateFrame++;
      return F.t >= F.length;
    },
    fx(match, fx, o) { match.emit(Object.assign({ type: 'fin_fx', fx }, o || {})); },
    sfx(match, sfx) { match.emit({ type: 'cine_sfx', sfx }); },

    scripts: {
      // ---------------------------------------------------------------- REN — the dragon blast into the moon
      ren: { length: 440, titleAt: 352, gap: 120, run(F, att, vic, m, t) {
        // Update 15 redesign — a spectacular combo that builds into an enormous energy beam that carries them into
        // the moon. (Original choreography: dash-in rush, knee, roundhouse, spinning launch kick, aerial string,
        // energy spike back down, a long charge with the sky darkening, then the giant beam → moon shatters.)
        const d = F.dir, X = DW.Finish, lim = DW.CONFIG.STAGE_HALF_WIDTH - 60;
        const hit = (pose, power, big) => { att.cinePose = pose; X.fx(m, 'finhit', { x: vic.x - d * 6, y: vic.y + 70, power, big: !!big }); X.sfx(m, big ? 'hitHeavy' : 'hit'); vic.cinePose = 'hit'; vic.cineRot = (Math.floor(t / 3) % 2 ? 0.18 : -0.14) * (big ? 1.6 : 1); };
        if (t === 1) { X.fx(m, 'flash'); X.sfx(m, 'charge'); F.ax0 = att.x; F.vx0 = F.vx; }
        // 1. dash in and open the combo (camera punch-zooms on each blow, alternating sides)
        if (t < 14) { att.cinePose = 'rush'; att.x = lerp(F.ax0, F.vx0 - d * 46, ease(t / 14)); vic.cinePose = 'hit'; F.cam = { x: (att.x + vic.x) / 2, fy: 80, zoom: lerp(1.6, 2.3, ease(t / 14)) }; }
        const beats = [[14, 'strike'], [20, 'palm'], [26, 'strike'], [32, 'fin_knee'], [39, 'palm'], [45, 'fin_hikick'], [53, 'uppercut'], [60, 'fin_hikick'], [68, 'strike']];
        for (const [bt, pose] of beats) if (t === bt) { hit(pose, bt >= 45 ? 9 : 6, bt === 45 || bt === 60); vic.x = DW.clamp(vic.x + d * 4, -lim, lim); }
        if (t >= 14 && t < 76) { att.x = DW.clamp(lerp(att.x, vic.x - d * 44, 0.35), -lim, lim);
          const b = beats.filter(q => q[0] <= t).pop(); if (b && t - b[0] > 3) att.cinePose = 'stance';
          F.cam = { x: (att.x + vic.x) / 2 + (Math.floor(t / 7) % 2 ? 10 : -10), fy: 84, zoom: 2.3 + (beats.some(q => t - q[0] >= 0 && t - q[0] < 3) ? 0.25 : 0) }; }
        // 2. spinning launch kick — they go up; he follows
        if (t === 76) { hit('fin_spin', 12, true); X.sfx(m, 'launch'); X.fx(m, 'shake', { power: 8 }); }
        if (t >= 76 && t < 128) { const k = ease(span(t, 76, 96)); vic.y = lerp(0, 150, k); vic.cineRot = (t - 76) * 0.25; vic.cinePose = 'hit';
          att.y = lerp(0, 132, ease(span(t, 82, 100))); if (t >= 82 && t < 100) att.cinePose = 'leap';
          att.x = DW.clamp(lerp(att.x, vic.x - d * 42, 0.25), -lim, lim);   // he follows them up
          F.cam = { x: (att.x + vic.x) / 2, fy: (att.y + vic.y) / 2 + 70, zoom: lerp(2.1, 1.55, k) }; }
        for (const [bt, pose] of [[100, 'fin_knee'], [106, 'strike'], [112, 'fin_hikick']]) if (t === bt) { hit(pose, 8, bt === 112); att.y += 6; vic.y += 6; }
        // 3. energy-infused axe kick spikes them back down
        if (t === 120) { hit('fin_axe', 14, true); X.fx(m, 'finenergy', { x: vic.x, y: vic.y + 60 }); X.fx(m, 'flash'); }
        if (t >= 120 && t < 150) { const k = ease(span(t, 120, 132)); vic.y = lerp(vic.y, 36, k); vic.cineRot = lerp(vic.cineRot || 0, -0.6, k); att.y = lerp(att.y, 0, ease(span(t, 124, 146))); att.cinePose = t < 132 ? 'fin_axe' : 'land';
          if (t === 132) { X.fx(m, 'shake', { power: 12 }); X.sfx(m, 'crush'); } F.cam = { x: (att.x + vic.x) / 2, fy: Math.max(70, (att.y + vic.y) / 2 + 70), zoom: 1.6 }; }
        // 4. anticipation: he steps back and gathers an enormous charge — the sky darkens, energy streams in
        if (t >= 150 && t < 230) { const k = span(t, 150, 226); att.cinePose = 'charge'; att.x = lerp(att.x, DW.clamp(vic.x - d * 150, -lim, lim), 0.12); vic.cinePose = 'limp'; vic.y = 36 + Math.sin(t * 0.2) * 3; vic.cineRot = -0.5;
          F.charge = k; if (t % 4 === 0) X.fx(m, 'gather', { x: att.x + d * 22, y: 70, who: att.id }); if (t === 150 || t === 190) X.sfx(m, 'charge'); if (t % 20 === 0) X.fx(m, 'shake', { power: 2 + k * 6 });
          F.cam = { x: (att.x + vic.x) / 2 - d * 20 * ease(k), fy: 76, zoom: lerp(1.45, 1.7, ease(k)) }; }
        // 5. the beam — far bigger than any projectile — catches them and drives them into the sky toward the moon
        if (t === 230) { X.sfx(m, 'dragon'); X.sfx(m, 'boom'); X.fx(m, 'flash'); X.fx(m, 'shake', { power: 16 }); F.charge = 0; }
        F.blast = t >= 230 ? t - 230 : -1;
        if (t >= 230 && t < 290) att.cinePose = 'beam';
        if (t >= 236) { const k = span(t, 236, 318); vic.cineMoon = easeIn(k); vic.cineRot = (t - 236) * 0.24; vic.cinePose = 'hit';
          if (t < 330) F.cam = { x: lerp((att.x + vic.x) / 2, att.x + d * 60, ease(k)), y: lerp(60, 140, ease(k)), zoom: lerp(1.7, 1.0, ease(k)) }; }
        // 6. they crash into the moon — it shatters
        if (t === 318) { F.moonHit = 318; m.moonBroken = true; vic.cineHide = true; X.sfx(m, 'moonbreak'); X.sfx(m, 'boom'); X.fx(m, 'shake', { power: 20 }); X.fx(m, 'flash'); }
        if (t === 334) X.fx(m, 'shake', { power: 10 });
        if (t >= 340) { att.facing = -d; att.cinePose = t < 372 ? 'stance' : 'win'; F.cam = { x: lerp(F.cam.x, att.x + d * 30, 0.06), y: lerp(F.cam.y || 60, 30, 0.06), zoom: lerp(F.cam.zoom, 1.55, 0.05) }; }
      } },

      // ---------------------------------------------------------------- ONIMARU — through the fourth wall
      onimaru: { length: 360, titleAt: 280, gap: 70, run(F, att, vic, m, t) {
        const d = F.dir, X = DW.Finish;
        if (t < 20) { att.cinePose = 'grab'; vic.cinePose = 'down'; F.cam = { x: (att.x + vic.x) / 2, y: 60, zoom: 2.0 }; }
        else if (t < 45) { att.cinePose = 'hoist_side'; vic.cinePose = 'lifted'; const k = ease(span(t, 20, 45)); vic.x = lerp(F.vx, att.x + d * 6, k); vic.y = lerp(0, 128, k); }
        else if (t < 58) { att.cinePose = 'wind_back'; vic.x = att.x - d * 14; vic.y = 132; vic.cineRot = -0.3; }
        if (t === 20) X.sfx(m, 'grab');
        if (t === 58) { att.cinePose = 'throw_fwd'; X.sfx(m, 'whoosh'); }
        if (t >= 58) { vic.cineCam = easeIn(span(t, 58, 72)); vic.cineRot = t < 72 ? (t - 58) * 0.45 : 0; vic.cinePose = t < 72 ? 'hit' : 'struggle'; }   // flies at the viewer, tumbling
        if (t >= 72) vic.cineSquash = [1.14, 0.93];                              // flattened on the glass
        if (t === 72) { F.crackAt = 72; X.sfx(m, 'glass'); X.fx(m, 'shake', { power: 14 }); X.fx(m, 'flash'); }
        if (t >= 80) vic.cineSlide = ease(span(t, 84, 210));                    // slides down the glass
        if (t >= 210) vic.cineHide = true;
        if (t >= 58 && t < 170) F.cam = { x: (att.x + F.vx) / 2, y: 60, zoom: 1.9 };
        if (t >= 170) {                                                          // zoom on the demon's face — he laughs
          const k = ease(span(t, 170, 200)), hx = att.x + d * 8, hy = 118 * (att.char.scale || 1);
          F.cam = { x: lerp((att.x + F.vx) / 2, hx, k), fy: lerp(80, hy, k), zoom: lerp(1.9, 3.2, k) };
          att.cinePose = t < 196 ? 'roar' : (Math.floor((t - 196) / 7) % 2 ? 'roar' : 'win_oni');
          if (t >= 250) { const k2 = ease(span(t, 250, 285)); F.cam = { x: lerp(hx, att.x, k2), fy: lerp(hy, 90, k2), zoom: lerp(3.2, 2.0, k2) }; att.cinePose = 'win_oni'; }
        }
        if (t === 198 || t === 226) { X.sfx(m, 'laugh'); X.fx(m, 'laugh', { who: att.id }); }
        if (t === 212) X.fx(m, 'laugh', { who: att.id });
      } },

      // ---------------------------------------------------------------- KASUMI — clone baseball into the moon
      kasumi: { length: 390, titleAt: 305, gap: 175, margin: 260, run(F, att, vic, m, t) {
        const s = -F.dir, X = DW.Finish;                                     // s: direction from the victim to the real Kasumi
        const xR = att.x, xA = F.vx - s * 44, xB = F.vx - s * 200;
        F.cloneA = { x: xA, a: t < 18 ? 0 : t < 100 ? 1 : Math.max(0, 1 - (t - 100) / 10), pose: t < 34 ? 'idle_ninja' : t < 42 ? 'wind_back' : 'twist', face: -s };
        F.cloneB = { x: xB, a: t < 46 ? 0 : t < 100 ? 1 : Math.max(0, 1 - (t - 100) / 10), pose: t < 62 ? 'wind_back' : 'reach_wide', face: s, bat: true };
        if (t < 30) { att.cinePose = 'cast'; F.cam = { x: F.vx, y: 50, zoom: 1.5 }; }
        if (t === 18 || t === 46) { X.sfx(m, 'puff'); X.fx(m, 'puff', { x: t === 18 ? xA : xB, y: 50 }); }
        vic.cinePose = 'down';
        if (t >= 40 && t < 62) { const k = span(t, 40, 62); vic.cinePose = 'hit'; vic.x = lerp(F.vx, xB + s * 46, k); vic.y = Math.sin(k * Math.PI) * 46 + k * 30; vic.cineRot = -k * 2; }
        if (t === 40) { X.sfx(m, 'hitHeavy'); X.fx(m, 'impact', { x: F.vx, y: 40 }); }
        if (t === 62) { X.sfx(m, 'bat'); X.fx(m, 'kakiin', { x: xB + s * 46, y: 60 }); X.fx(m, 'impact', { x: xB + s * 46, y: 60, big: true }); X.fx(m, 'shake', { power: 6 }); }
        if (t >= 62 && t < 90) { const k = span(t, 62, 90); vic.cinePose = 'hit'; vic.x = lerp(xB + s * 46, xR - s * 30, k); vic.y = 30 + 26 * Math.sin(k * Math.PI); vic.cineRot = (t - 62) * 0.55; }
        if (t >= 30 && t < 90) F.cam = { x: lerp(F.vx, (xB + xR) / 2, ease(span(t, 30, 50))), y: 50, zoom: 1.15 };
        if (t >= 90 && t < 165) { att.cinePose = t < 140 ? 'grab_pull' : 'wind_back'; vic.cinePose = 'hit'; vic.cineRot = 0.25;
          vic.x = t < 140 ? xR - s * 30 : lerp(xR - s * 30, xR + s * 14, ease(span(t, 140, 160))); vic.y = t < 140 ? 32 : lerp(32, 70, ease(span(t, 140, 160)));
          F.cam = { x: lerp(F.cam.x, xR - s * 20, 0.12), y: 60, zoom: lerp(F.cam.zoom, 2.4, 0.1) }; }
        if (t === 90) { X.sfx(m, 'grab'); X.fx(m, 'impact', { x: xR - s * 30, y: 60 }); }
        if (t === 100) { X.sfx(m, 'puff'); X.fx(m, 'puff', { x: xA, y: 50 }); X.fx(m, 'puff', { x: xB, y: 50 }); }
        if (t === 165) { att.cinePose = 'throw_fwd'; X.sfx(m, 'whoosh'); }
        if (t >= 165) { const k = span(t, 165, 245); vic.cineMoon = easeIn(k); vic.cineRot = (t - 165) * 0.3; vic.cinePose = 'hit';
          F.cam = { x: lerp(F.cam.x, xR, 0.05), y: lerp(F.cam.y, 140, 0.05), zoom: lerp(F.cam.zoom, 1.0, 0.05) }; if (t < 200) att.cinePose = 'throw_fwd'; }
        if (t === 245) { F.moonHit = 245; m.moonBroken = true; vic.cineHide = true; X.sfx(m, 'moonbreak'); X.fx(m, 'shake', { power: 16 }); X.fx(m, 'flash'); }
        if (t >= 270) { att.cinePose = 'win_ninja'; F.cam = { x: lerp(F.cam.x, xR - s * 30, 0.06), y: lerp(F.cam.y, 30, 0.06), zoom: lerp(F.cam.zoom, 1.75, 0.05) }; }
      } },

      // ---------------------------------------------------------------- SHIN — the aerial sword execution
      akatsuki: { length: 430, titleAt: 340, gap: 150, run(F, att, vic, m, t) {
        const d = F.dir, X = DW.Finish, sc = att.char.scale || 1;
        vic.cinePose = 'down';
        // 1-2 · slow close-up of her face drifting across the screen; her eyes narrow
        if (t < 74) { att.cinePose = 'ak_guard'; const hx = att.x + d * 6, hy = 116 * sc;
          F.cam = { x: lerp(hx - d * 40, hx + d * 26, t / 74), fy: hy, zoom: 3.6 }; att.cineSquint = ease(span(t, 34, 52)); }
        if (t === 40) X.sfx(m, 'ding');
        // 3 · the throw: the blade leaves her raised hand and spins up on a ballistic arc (3 full turns, blade-up again at the catch)
        const T0 = 82, TC = 130, g = 0.38, vy0 = 13.4, vxs = 1.6;
        if (t >= 74 && t < 96) { att.cinePose = t < T0 ? 'ak_rise' : 'reach'; att.cineSquint = 0; F.cam = { x: lerp(F.cam.x, att.x + d * 40, 0.15), fy: lerp(F.cam.fy !== undefined ? F.cam.fy : 116, 150, 0.12), zoom: lerp(F.cam.zoom, 1.5, 0.12) }; }
        if (t === T0) { F.sword = { t0: T0, x0: att.x + d * 14, y0: 150 * sc, vx: d * vxs, vy: vy0, g, w: (Math.PI * 2 * 3) / (TC - T0), caught: 0, planted: 0 }; att.cineNoSword = true; X.sfx(m, 'whoosh'); }

          if (t === 104 || t === 116) X.sfx(m, 'whoosh');

        const TS = 156;
        if (t > TC && t <= TS) { const k = span(t, TC, TS); att.x = lerp(att.x, F.vx - d * 20, 0.2); att.y = lerp(att.y, 30, easeIn(k));

        // 9 · she rises slowly, draws the blade out and cleans it (chiburi), then sheathes
        if (t >= 214) { att.y = 0; att.cineNoSword = t < 222;
          att.cinePose = t < 236 ? 'ak_after' : t < 252 ? 'ak_wind' : t < 282 ? 'ak_after' : t < 310 ? 'ak_sheathe' : 'win_ronin';
          if (t === 222) sw.planted = -1;                                         // pulled out
          if (t === 252) { X.sfx(m, 'whoosh'); X.fx(m, 'chiburi', { x: att.x + d * 30, y: 70, d }); }
          if (t === 296) X.sfx(m, 'ding');
          F.cam = { x: lerp(F.cam.x, att.x + d * 20, 0.06), fy: lerp(F.cam.fy, 72, 0.06), zoom: lerp(F.cam.zoom, 1.9, 0.04) }; }
        // 10 · petals flow across the screen

      // ---------------------------------------------------------------- KUROGANE — shrunk and sealed in the grimoire
      kurogane: { length: 400, titleAt: 320, gap: 130, run(F, att, vic, m, t) {
        const d = F.dir, X = DW.Finish;
        const bx = att.x + d * 52, by = 104;                                   // where the great book hangs
        if (t < 150) { att.cinePose = 'mg_raise'; }
        if (t < 40) { vic.cinePose = t < 8 ? 'down' : 'hit'; vic.y = lerp(0, 86, ease(span(t, 6, 40))); vic.cineRot = Math.sin(t * 0.2) * 0.08; }
        if (t % 10 === 5 && t < 140) X.fx(m, 'sigil', { x: F.vx, y: vic.y + 50 });
        if (t >= 40 && t < 190) {                                                  // compressed, struggling, shrinking
          const k = ease(span(t, 40, 140)); vic.cinePose = Math.floor(t / 9) % 2 ? 'hit' : 'struggle'; vic.y = 86 + Math.sin(t * 0.1) * 4;
          vic.cineScale = lerp(1, 0.2, k); vic.cineRot = Math.sin(t * 1.3) * 0.22 * (1 - k * 0.5);
          vic.cineSquash = [1 + 0.16 * Math.sin(t * 0.9), 1 - 0.16 * Math.sin(t * 0.9)];
          if (t % 8 === 0) X.fx(m, 'constrict', { x: F.vx, y: vic.y + 40 * vic.cineScale, r: 70 * (1 - k) + 14 });

        F.book = t < 150 ? 0 : t < 250 ? ease(span(t, 150, 172)) : Math.max(0, 1 - (t - 250) / 6);   // 0 shut … 1 open
        F.bookAt = [bx, by]; F.bookShown = t >= 146 ? 1 : 0; F.bookShut = t >= 250 ? t - 250 : -1;
        if (t >= 150) att.cinePose = t < 250 ? 'mg_cast' : 'mg_book';
        if (t === 150) X.sfx(m, 'charge');
        if (t >= 190 && t < 250) {                                                 // spiralled into the pages
          const k = ease(span(t, 190, 246)), a = k * Math.PI * 5, r = 70 * (1 - k);
          vic.x = lerp(F.vx, bx, k) + Math.cos(a) * r; vic.y = lerp(86, by - 10, k) + Math.sin(a) * r * 0.5; vic.cineScale = lerp(0.2, 0.02, k); vic.cineRot = a * 0.5;
          if (t === 190) X.sfx(m, 'whoosh');

        if (t >= 248) vic.cineHide = true;
        if (t === 250) { X.sfx(m, 'bookshut'); X.fx(m, 'flash'); X.fx(m, 'shake', { power: 7 }); X.fx(m, 'seal', { x: bx, y: by }); }
        F.cam = t < 150 ? { x: lerp((att.x + F.vx) / 2, att.x * 0.3 + F.vx * 0.7, ease(t / 120)), fy: lerp(70, 110, ease(t / 60)), zoom: lerp(1.6, 2.3, ease(span(t, 40, 140))) }
          : { x: lerp(att.x * 0.3 + F.vx * 0.7, (att.x + bx) / 2 + d * 10, ease(span(t, 150, 200))), fy: lerp(110, 96, ease(span(t, 150, 200))), zoom: lerp(2.3, 2.2, ease(span(t, 150, 200))) };
        if (t >= 290) F.cam = { x: att.x + d * 24, fy: 92, zoom: lerp(2.2, 2.5, ease(span(t, 290, 340))) };
      } },

      // ---------------------------------------------------------------- AYAKASHI — the opponent becomes the new puppet
      ayakashi: { length: 420, titleAt: 335, gap: 140, run(F, att, vic, m, t) {
        const d = F.dir, X = DW.Finish;
        F.oldPuppet = { x: att.x - d * 40, k: ease(span(t, 40, 86)) };           // Kagemaru bows and crumbles away
        att.cinePose = t < 40 ? 'pp_command' : t < 90 ? 'pp_raise' : t < 180 ? 'pp_conduct' : t < 300 ? 'pp_conduct' : 'win_puppeteer';
        if (t === 44) X.sfx(m, 'creak');
        if (t === 82) { X.sfx(m, 'puff'); X.fx(m, 'puff', { x: att.x - d * 40, y: 40 }); }
        if (t % 12 === 6 && t < 170) X.fx(m, 'sigil', { x: F.vx, y: 6, flat: true });
        // the victim rises limp, then is remade as a puppet of itself
        vic.cinePose = t < 14 ? 'down' : 'limp'; vic.y = t < 180 ? lerp(0, 14, ease(span(t, 14, 40))) : vic.y;
        vic.cinePuppet = ease(span(t, 90, 170));
        if (t >= 90 && t < 180) { vic.cineRot = Math.sin(t * 0.7) * 0.18 * vic.cinePuppet; if (t === 100 || t === 130 || t === 160) X.sfx(m, 'creak'); }
        if (t === 90) X.sfx(m, 'charge');

        F.strings = t >= 120 ? (t < 180 ? 'sky' : 'hand') : null;
        if (t >= 180) {
          const jerk = ['pp_flick', 'reach', 'stance', 'pp_lowkick', 'limp'];
          vic.cinePose = t < 260 ? jerk[Math.floor((t - 180) / 11) % jerk.length] : 'limp';
          // Update 15: it ends well away from her (150 px), dropped to its knees in a broken, puppet-like kneel
          const lim = DW.CONFIG.STAGE_HALF_WIDTH - 40, x1 = DW.clamp(att.x + d * 150, -lim, lim), hops = Math.min(3, Math.max(0, Math.floor((t - 196) / 20) + 1));
          vic.x = lerp(F.vx, x1, hops / 3); vic.y = t < 260 ? 14 + ((t - 196) % 20 < 8 && t >= 196 ? 18 : 0) : Math.max(0, 14 - (t - 260) * 2);
          if (t >= 262) vic.cinePose = 'puppet_kneel';
          if (t === 262) X.sfx(m, 'creak');
          vic.cineRot = t < 260 ? (Math.floor(t / 5) % 2 ? 0.14 : -0.1) : -0.2 + (t % 46 < 3 ? 0.12 : 0);    // snaps — then kneels, twitching now and then

        if (t >= 300) F.cam = { x: (att.x + vic.x) / 2, fy: 74, zoom: lerp(1.7, 1.85, ease(span(t, 300, 380))) };   // final shot: ONLY Ayakashi and her new puppet
        if (t >= 300) F.hideKagemaru = true;
      } },
    },
  };
})();

<script>/* src/systems/combobot.js */
// DARK WAR — Combo bot. Performs a combo written in move-list notation with human-like timing
// (each button pressed a few frames after the previous move connects). Used by the automated tests,
// and by the Combo Guide to show real damage numbers and to demonstrate combos.
//
// Notation: L H 2L 2H  (ground)   jL jH  (air)   S 6S 4S 2S  jS j6S j4S j2S  (specials)
//           J  (jump / pursuit)    JC  (Jump Cancel)    SS  (Shadow Step)    L1  L3  (Supers)
var DW = (globalThis.DW = globalThis.DW || {});

DW.ComboBot = class {
  constructor(notation, opts = {}) {
    this.tokens = notation.trim().split(/\s+/);
    this.i = 0; this.delay = opts.delay ?? 3; this.armed = -1; this.serial = 0; this.lastPress = 0;
    this.pursuitGap = opts.pursuitGap ?? 9; this.jcGap = opts.jcGap ?? 5;
    this.done = false; this.press = opts.press || null;   // Update 8: per-step button override (Modern trial instructions)
  }
  static isAttack(t) { return !['J', 'fJ', 'JC', 'SS', 'G', 'bG'].includes(t); }

  ready(f, m) {
    const tok = this.tokens[this.i];
    // grounded follow-up after an air attack (air-to-ground): only once actually landed
    if (this.i > 0 && /^j[LHS]/.test(this.tokens[this.i - 1]) && /^(2?[LH]|5L|5H|2S|[1-6]?S)$/.test(tok) && f.air && !/^j/.test(tok)) return false;
    if (this.i === 0) return ['idle', 'walkF', 'walkB', 'crouch'].includes(f.state);
    if (this.press && this.press[this.i] && (this.press[this.i].light || this.press[this.i].heavy) && f.hitstop > 5) return false;   // Modern mash steps: a press made deep in the hit-freeze would expire from the 8f buffer
    const prev = this.tokens[this.i - 1], F = m.frame;
    if (prev === 'fJ' && /^j[LH]$/.test(this.tokens[this.i]) && this.tokens.slice(this.i + 1).some(t => !/^j|^J|^JC$/.test(t))) {
      // deep jump-in for air-to-ground: press so the attack is active just before landing
      if (!f.air || f.vy >= 0) return false;
      const mv = f.char.moves[this.tokens[this.i]], two = /^j/.test(this.tokens[this.i + 1] || '');
      let y = f.y, vy = f.vy, n = 0, life = mv.startup + mv.active + mv.recovery;
      while (y > 0 && n < 80) { vy -= DW.CONFIG.GRAVITY * (n < life && vy < 0 ? 0.5 : 1); y += vy; n++; }
      const opp = m.fighters[1 - f.id], reach = Math.abs(opp.x - (f.x + f.vx * mv.startup)) <= mv.hitbox.x + mv.hitbox.w + 14;
      return n <= mv.startup + (two ? 12 : 6) && (n <= mv.startup + 6 || reach);
    }
    if (prev === 'J' || prev === 'JC' || prev === 'fJ') {
      const before = this.tokens[this.i - 2];
      const gap = this.press && this.press[this.i - 1] && prev === 'JC' ? 4 : (before === '2H') ? this.pursuitGap : this.jcGap;   // Modern: the JC press itself waited out the hit-freeze
      return f.air && F - this.lastPress >= gap;
    }
    if (prev === 'AD') return f.state === 'airdash' ? f.stateFrame >= (f.char.dash.air.attackCancelFrom || 5) : (f.air && F - this.lastPress > 14);   // cancel the dash into an air attack
    if (prev === 'SS') return f.state === 'shadowstep' ? f.stateFrame >= 4 : F - this.lastPress > 20;
    // stance change / step moves never hit: go as soon as their follow-up window opens
    if (f.state === 'attack' && f.move && f.move.followFrom && !f.move.hitbox && f.moveSerial > this.serial) return f.moveFrame >= (f.fromHit && f.move.followFromHit ? f.move.followFromHit : f.move.followFrom) - 1;
    // attack: wait until it connected (all hits of a multi-hit move), then a short human delay
    if (f.state === 'attack' && !f.seq && f.moveSerial > this.serial && f.moveHit && !(f.move.multi && f.hitCount < f.move.multi.count)) {
      if (this.armed < 0) this.armed = F;
      return F - this.armed >= this.delay;
    }
    const idle = ['idle', 'walkF', 'walkB', 'crouch', 'air', 'landing'].includes(f.state);
    return idle && F - this.lastPress > 6 && f.moveSerial > this.serial;
  }

  next(m, who = 0) {
    const f = m.fighters[who], inp = DW.emptyInputFrame();
    if (this.hold && this.hold.n > 0) { this.hold.n--; inp[this.hold.dir === 'fwd' ? (f.facing > 0 ? 'right' : 'left') : (f.facing > 0 ? 'left' : 'right')] = true; }
    if (this.i >= this.tokens.length) { this.done = true; return inp; }
    if (!this.ready(f, m)) return inp;
    let t = this.tokens[this.i];
    const fwd = f.facing > 0 ? 'right' : 'left', back = f.facing > 0 ? 'left' : 'right';
    const air = t.startsWith('j') && t !== 'J' && t !== 'JC';
    const core = air ? t.slice(1) : t;
    switch (core) {
      case 'L': inp.light = true; break;
      case 'H': inp.heavy = true; break;
      case '2L': inp.light = true; inp.down = true; break;
      case '2H': inp.heavy = true; inp.down = true; break;
      case '6H': inp.heavy = true; inp[fwd] = true; break;
      case 'S': case '5S': inp.special = true; break;
      case '6S': inp.special = true; inp[fwd] = true; break;
      case '4S': inp.special = true; inp[back] = true; break;
      case '2S': inp.special = true; inp.down = true; break;
      case '8S': inp.special = true; inp.up = true; break;   // Update 9: air Up + S (Kurogane)
      case 'AD': inp.dash = true; inp[fwd] = true; break;   // air dash (forward)
      case '1S': inp.special = true; inp.down = true; inp[back] = true; break;
      case '3S': inp.special = true; inp.down = true; inp[fwd] = true; break;
      case 'J': case 'JC': inp.jump = true; break;
      case 'SS': inp.dash = true; break;   // Update 3: Shadow Step is DASH during a 影 move
      case 'G': inp.grab = true; break;
      case 'bG': inp.grab = true; inp[back] = true; this.hold = { dir: 'back', n: 12 }; break;
      case 'fJ': inp.jump = true; inp[fwd] = true; this.hold = { dir: 'fwd', n: 8 }; break;
      case 'L1': inp.heavy = true; inp.special = true; break;
      case 'L3': inp.heavy = true; inp.special = true; inp.down = true; break;
    }
    const ov = this.press && this.press[this.i];
    if (ov) { for (const k of ['light', 'heavy', 'special', 'grab', 'dash', 'jump', 'super1', 'super3', 'up', 'down', 'left', 'right']) inp[k] = false; Object.assign(inp, ov); }
    this.i++; this.armed = -1; this.serial = f.moveSerial; this.lastPress = m.frame + 1;
    return inp;
  }
};

// Runs a combo on a standing dummy and reports what happened.
DW.runCombo = function (p1, p2, notation, opts = {}) {
  const m = new DW.Match({ schemes: opts.schemes, colors: opts.colors, mode: opts.mode || 'training', p1, p2, training: { autoRefill: false } });
  const d = opts.startDist ?? 70, cx = opts.centerX ?? 0;
  m.fighters[0].x = cx - d / 2; m.fighters[1].x = cx + d / 2;
  m.fighters[0].meter = opts.meter ?? 300;
  if (opts.victimHealth) m.fighters[1].health = opts.victimHealth;
  if (m.mode === 'versus') { m.roundState = 'fight'; }
  const bot = new DW.ComboBot(notation, opts);
  const attackTokens = bot.tokens.filter(DW.ComboBot.isAttack).length;
  let dropped = false, best = null, cinematic = false, events = [], nonHitting = 0;
  for (let t = 0; t < (opts.maxFrames || 900); t++) {
    m.step([bot.next(m), null]);
    if (m.cinematic) cinematic = true;
    for (const e of m.drainEvents()) {
      if (opts.keepEvents) events.push(e);
      if ((e.type === 'special' || e.type === 'attack') && e.who === 0) { const mv = m.fighters[0].char.moves[e.id]; if (mv && !mv.hitbox && !mv.projectile && !mv.trap && !mv.grab && !mv.seq && !mv.counter && !mv.puppet && !mv.detonate) nonHitting++; }   // stance changes / steps
      if (e.type === 'comboend' && e.who === 0) {
        if (!best || e.hits > best.hits) best = { hits: e.hits, damage: e.damage };
        if (bot.i < bot.tokens.length) dropped = true;
      }
    }
    if (bot.i >= bot.tokens.length && !m.combos[0].active && t > 30 && !m.cinematic && (best || cinematic)) break;
  }
  if (m.combos[0].active) best = { hits: m.combos[0].hits, damage: m.combos[0].damage };
  best = best || { hits: 0, damage: 0 };
  return { ok: !dropped && bot.i >= bot.tokens.length && best.hits >= attackTokens - nonHitting, dropped, pressed: bot.i, tokens: bot.tokens.length,
           hits: best.hits, damage: best.damage, attackTokens, cinematic, match: m, events };
};

<script>/* src/ai/cpu.js */
// DARK WAR — CPU opponent. Produces InputFrames exactly like a human (no reading of hidden state
// beyond what a player can see on screen). Uses the character's own Combo Guide routes on hit-confirm.
var DW = (globalThis.DW = globalThis.DW || {});

DW.CPU_LEVELS = {
  easy:   { tech: 0.1, reaction: 30, block: 0.15, antiAir: 0.15, comboSkill: 0, aggression: 0.35, super: 0.2, brk: 0.15, brkHits: 6 },
  normal: { tech: 0.35, reaction: 14, block: 0.55, antiAir: 0.45, comboSkill: 1, aggression: 0.55, super: 0.6, brk: 0.4, brkHits: 4 },
  hard:   { tech: 0.6, reaction: 8,  block: 0.8,  antiAir: 0.75, comboSkill: 2, aggression: 0.7,  super: 0.9, brk: 0.7, brkHits: 3 },
};

DW.CPU = class {
  constructor(id, level = 'normal') {
    this.id = id; this.setLevel(level);
    this.rng = 987654321 + id * 7; this.plan = null; this.planT = 0; this.bot = null; this.seen = [];
  }
  setLevel(l) { this.levelName = l; this.L = DW.CPU_LEVELS[l] || DW.CPU_LEVELS.normal; }
  rand() { this.rng = (this.rng * 1103515245 + 12345) & 0x7fffffff; return this.rng / 0x7fffffff; }

  pickCombo(me) {
    const combos = me.char.combos, bars = me.bars, skill = this.L.comboSkill;
    const ok = combos.filter(c => {
      const needs = /L3/.test(c.notation) ? 3 : /L1|SS/.test(c.notation) ? (c.notation.match(/L1|SS/g).length) : 0;
      if (needs > bars) return false;
      if (/\bj6S\b/.test(c.notation) && me.char.moves.j6S && me.char.moves.j6S.ifSeal && me.match.entities.some(e => e.kind === 'seal' && e.owner === me.id && e.life > 0)) return false;   // Update 12: with a seal down, air Forward+S is Kai!, not the Yoko ender
      if (/L3/.test(c.notation) && this.rand() > this.L.super) return false;
      if (skill === 0) return c.level === 'Beginner';
      if (skill === 1) return c.level !== 'Advanced';
      return true;
    });
    const pool = ok.length ? ok : combos.filter(c => c.level === 'Beginner');
    // prefer stronger routes on higher levels
    return pool[Math.min(pool.length - 1, Math.floor(this.rand() * pool.length * (0.5 + skill * 0.25)))];
  }

  think(match) {
    const me = match.fighters[this.id], opp = match.opponentOf(me);
    let f = DW.emptyInputFrame();
    // delayed perception (reaction time)
    this.seen.push({ state: opp.state, move: opp.move, air: opp.air, x: opp.x, y: opp.y, vx: opp.vx });
    if (this.seen.length > this.L.reaction) this.seen.shift();
    const o = this.seen[0];
    const toward = opp.x > me.x ? 'right' : 'left', away = toward === 'right' ? 'left' : 'right';
    const dist = Math.abs(opp.x - me.x);

    // throw escape attempt (decided once per grab)
    if (me.state === 'grabbed') {
      if (this.techDecision === undefined) this.techDecision = this.rand() < this.L.tech ? 3 + Math.floor(this.rand() * 5) : -1;
      if (me.stateFrame === this.techDecision) f.grab = true;
      return f;
    }
    this.techDecision = undefined;
    // Update 7: Kekkai Break — decided once per opponent combo, only with a full gauge
    const oc = match.combos[opp.id];
    if (!oc.active) this.brkAt = undefined;
    else if ((me.state === 'hitstun' || me.state === 'airhit') && me.brk >= DW.CONFIG.break.cost) {
      if (this.brkAt === undefined) this.brkAt = this.rand() < (this.L.brk || 0) ? this.L.brkHits + Math.floor(this.rand() * 3) : -1;
      if (this.brkAt >= 0 && oc.hits >= this.brkAt && !me.breakBlocker(opp, match)) { f.brk = true; return f; }
    }
    // running a combo routine
    if (opp.state === 'blockstun') this.lastBlockedAt = match.frame;
    if (this.bot) {
      if (me.moveBlocked || (me.state === 'idle' && match.frame - this.botStart > 40 && !match.combos[this.id].active) ||
          ['hitstun', 'blockstun', 'airhit', 'knockdown'].includes(me.state) || this.bot.done) this.bot = null;
      else return this.bot.next(match, this.id);
    }
    const actionable = ['idle', 'walkF', 'walkB', 'crouch', 'landing'].includes(me.state);
    // Update 3: react to a telegraphed (jumpable) command grab — decided once per grab attempt
    if (opp.state === 'attack' && opp.move && opp.move.jumpWarn && opp.movePhase() === 'startup' && ['idle', 'walkF', 'walkB', 'crouch', 'blockstun'].includes(me.state)) {
      if (this.warnSerial !== opp.moveSerial) { this.warnSerial = opp.moveSerial; this.warnJump = this.rand() < this.L.antiAir ? Math.min(opp.move.startup - 4, Math.round(this.L.reaction * 0.5)) : -1; }
      if (this.warnJump >= 0 && opp.moveFrame >= this.warnJump && me.state !== 'blockstun') { f.up = true; f[away] = true; return f; }
    }

    // defense: block what we "saw" coming
    const threat = (o.state === 'attack' && o.move && dist < 220) || match.entities.some(e => e.owner === opp.id && e.kind === 'proj' && Math.abs(e.x - me.x) < 160);
    if (threat && actionable && this.rand() < this.L.block) {
      f[away] = true;
      const low = (o.move && o.move.height === 'low') || match.entities.some(e => e.owner === opp.id && e.props.height === 'low');
      f.down = low || (this.rand() < 0.3 && !(o.move && o.move.height === 'overhead'));
      return f;
    }
    // anti-air
    if (o.air && o.y > 40 && dist < 170 && actionable && opp.state !== 'airhit' && this.rand() < this.L.antiAir * 0.2) {
      if (me.char.moves['4S'] && me.char.moves['4S'].invuln) { f.special = true; f[away] = true; }
      else { f.heavy = true; f.down = true; }
      return f;
    }
    // punish a whiffed move nearby with a combo
    if (actionable && dist < 120 && ['landing', 'fall'].includes(o.state) || (o.state === 'attack' && o.move && dist < 110 && this.rand() < 0.05 * (1 + this.L.comboSkill))) {
      if (actionable) return this.startCombo(match, me);
    }
    if (this.planT-- <= 0) {
      const r = this.rand(), agg = this.L.aggression, ch = me.char.id;
      if (dist > 260) this.plan = r < 0.45 ? 'walk' : r < 0.65 ? 'dash' : r < 0.8 ? (ch === 'ren' ? 'fireball' : ch === 'kasumi' ? 'teleport' : 'dash') : r < 0.9 ? 'jumpin' : 'wait';
      else if (dist > 120) this.plan = r < agg * 0.6 ? 'dash' : r < agg ? 'jumpin' : r < agg + 0.15 ? 'walk' : r < agg + 0.25 ? (ch === 'kasumi' ? 'trap' : ch === 'ren' ? 'fireball' : 'walk') : 'back';
      else this.plan = r < agg ? 'combo' : r < agg + 0.12 ? (ch === 'onimaru' ? 'grab' : 'poke') : r < agg + 0.2 ? 'throw' : r < agg + 0.3 ? 'block' : 'back';
      // Update 8 — character game plans: the zoner keeps away and sets seals; the puppeteer sends the puppet;
      // the stance fighter switches stance at a distance (a read the opponent can punish)
      if (ch === 'kurogane') {
        if (dist > 200) this.plan = r < 0.35 ? 'fireball' : r < 0.55 ? 'seal' : r < 0.65 && this.sealCount(match, me) ? 'kai' : r < 0.75 ? 'ward' : r < 0.85 ? 'wait' : 'back';
        else if (dist > 110 && r < 0.5) this.plan = r < 0.25 ? 'seal' : r < 0.4 ? 'back' : 'fireball';
        if (dist > 110 && this.plan === 'jumpin' && this.rand() < 0.75) this.plan = this.rand() < 0.5 ? 'fireball' : 'back';   // Update 12: 2H is a real anti-air now — the zoner rarely jumps in from mid range
      }
      if (ch === 'ayakashi' && me.puppet && DW.Puppet.available(me.puppet)) {
        if (dist > 150 && dist < 330 && r < 0.4) this.plan = me.puppet.state === 'hold' ? 'pslash' : r < 0.2 ? 'pgo' : 'pslash';
        else if (dist <= 150 && r < 0.2) this.plan = 'psweep';
      }
      // Update 14: Down + S cycles Neutral → Flame → Water; S / Forward + S / Back + S are that stance's own specials
      if (ch === 'akatsuki') {
        if (dist > 140 && r < 0.18) { this.plan = 'cycle'; const o = ['N', 'K', 'M'].filter(k => k !== me.stance); this.stTarget = o[Math.floor(this.rand() * o.length)]; }
        else if (me.stance !== 'N' && r > 0.82) this.plan = 'sspecial';
      }
      // opponent keeps blocking? open them up with a throw
      if (dist < 90 && this.lastBlockedAt && match.frame - this.lastBlockedAt < 60 && this.rand() < 0.5) this.plan = 'throw';
      this.planT = 10 + Math.floor(this.rand() * 26); this.step = 0;
    }
    this.step++;
    switch (this.plan) {
      case 'walk': f[toward] = true; break;
      case 'back': f[away] = true; break;
      case 'wait': break;
      case 'block': f[away] = true; f.down = this.rand() < 0.5; break;
      case 'dash': f.dash = this.step === 1; if (this.step > 6 && dist < 110 && actionable) return this.startCombo(match, me); break;
      case 'jumpin': if (this.step === 1) f.jump = true; if (this.step < 6) f[toward] = true; if (me.air && dist < 90 && me.vy < 0) f.light = this.step % 3 === 0; break;
      case 'fireball': f.special = this.step === 1; this.planT = Math.min(this.planT, 20); break;
      case 'teleport': if (this.step === 1) { f.special = true; f[toward] = true; } break;
      case 'trap': if (this.step === 1) { f.special = true; f.down = true; } break;
      case 'seal': if (this.step === 1 && actionable) { f.special = true; f.down = true; f[dist > 260 ? toward : dist < 160 ? away : toward] = dist > 260 || dist < 160; } break;
      case 'kai': if (this.step === 1 && actionable) { f.special = true; f[toward] = true; } break;
      case 'ward': if (this.step === 1 && actionable) { f.special = true; f[away] = true; } break;
      case 'pgo': if (this.step === 1 && actionable) f.special = true; break;
      case 'pslash': if (this.step === 1 && actionable) { f.special = true; f[toward] = true; } break;
      case 'psweep': if (this.step === 1 && actionable) { f.special = true; f.down = true; } break;
      case 'cycle': this.planT = Math.max(this.planT, 2); if (me.stance === this.stTarget || this.step > 60) { this.planT = 0; break; } if (actionable && this.step % 14 === 1) { f.special = true; f.down = true; } break;
      case 'sspecial': if (this.step === 1 && actionable) { f.special = true; const k = this.rand();
        if (me.stance === 'K') { if (dist > 150) f[toward] = true; else if (k < 0.3) f[away] = true; }
        else if (me.stance === 'M') { if (dist > 200 && k < 0.6) f[toward] = true; else if (dist < 90 && k < 0.4) f[away] = true; } } break;
      case 'neutral': if (actionable && this.step % 14 === 1) { f.special = true; f.down = true; } break;
      case 'grab': if (dist < 80 && actionable && this.step === 1) f.special = true; else f[toward] = true; break;
      case 'throw': if (dist < 68 && actionable && this.step < 20) f.grab = true; else f[toward] = true; break;
      case 'poke': f.light = this.step % 7 === 1; f.down = this.rand() < 0.4; break;
      case 'combo': if (actionable && dist < 100) return this.startCombo(match, me); f[toward] = true; break;
    }
    return f;
  }

  sealCount(match, me) { return match.entities.filter(e => e.kind === 'seal' && e.owner === me.id).length; }
  startCombo(match, me) {
    if (me.stance && me.stance !== 'N') { this.plan = 'neutral'; this.planT = 4; this.step = 0; return DW.emptyInputFrame(); }   // combos are written from Neutral
    const c = this.pickCombo(me);
    const base = this.levelName === 'easy' ? 6 : this.levelName === 'hard' ? 2 : 3;   // easy CPUs drop combos more
    this.bot = new DW.ComboBot(c.notation, { delay: base + Math.floor(this.rand() * (this.levelName === 'easy' ? 8 : 3)) });
    this.botStart = match.frame; this.plan = null; this.planT = 0;
    return this.bot.next(match, this.id);
  }
};

<script>/* src/ai/dummy.js */
// DARK WAR — Training dummy behaviours (produce InputFrames like a player would).
var DW = (globalThis.DW = globalThis.DW || {});
DW.DUMMY_MODES = ['stand', 'crouch', 'block', 'jump', 'cpu'];   // (tutorial-only modes below are not in the training cycle)
DW.Dummy = class {
  constructor(id, mode = 'stand') { this.id = id; this.mode = mode; this.cpu = null; this.techThrows = false; }
  think(match) {
    const me = match.fighters[this.id], opp = match.opponentOf(me);
    const f = DW.emptyInputFrame();
    const away = opp.x > me.x ? 'left' : 'right';
    if (me.state === 'grabbed' && this.mode !== 'cpu') { if (this.techThrows && me.stateFrame === 4) f.grab = true; return f; }
    switch (this.mode) {
      case 'crouch': f.down = true; break;
      case 'jump': f.up = match.frame % 50 < 2; break;
      case 'thrower': {   // tutorial: walks in and throws, over and over
        const dist = Math.abs(opp.x - me.x);
        if (dist > 60) f[away === 'left' ? 'right' : 'left'] = true; else if (match.frame % 40 === 0) f.grab = true;
        break;
      }
      case 'block': {
        f[away] = true;
        const threat = opp.state === 'attack' && opp.move ? opp.move : null;
        const proj = match.entities.find(e => e.owner === opp.id && e.kind === 'proj');
        if ((threat && threat.height === 'low') || (proj && proj.props.height === 'low')) f.down = true;
        else if (!threat && !proj && me.state === 'blockstun') f.down = me.lowBlocking;
        break;
      }
      case 'cpu': case 'cpuNormal': case 'cpuEasy':
        if (!this.cpu) this.cpu = new DW.CPU(this.id, this.mode === 'cpuEasy' ? 'easy' : 'normal');
        return this.cpu.think(match);
      // ---- tutorial behaviours (deterministic: driven by match.frame, no randomness)
      case 'poke': {      // walks in and jabs on a steady rhythm
        const dist = Math.abs(opp.x - me.x);
        if (dist > 75) f[away === 'left' ? 'right' : 'left'] = true; else if (match.frame % 55 === 0) f.light = true;
        break;
      }
      case 'pokeH': {     // walks in and swings a slow HEAVY on a rhythm (counter-hit practice)
        const dist = Math.abs(opp.x - me.x);
        if (dist > 90) f[away === 'left' ? 'right' : 'left'] = true; else if (me.state === 'idle' && match.frame - (this.last || -999) > 70) { f.heavy = true; this.last = match.frame; }
        break;
      }
      case 'unsafe': {    // walks in, then commits to a big, slow, punishable special (Forward + S)
        const dist = Math.abs(opp.x - me.x), toward = away === 'left' ? 'right' : 'left';
        if (dist > 90) f[toward] = true;
        else if (me.state === 'idle' && match.frame - (this.last || -999) > 90) { f.special = true; f[toward] = true; this.last = match.frame; }
        break;
      }
      case 'mixed': {     // blocks in some windows, stands open in others
        const blocking = Math.floor(match.frame / 150) % 3 === 1 || (Math.floor(match.frame / 150) * 7) % 5 === 0;
        const threat = opp.state === 'attack' || me.state === 'blockstun' || match.entities.some(e => e.owner === opp.id);
        if (blocking && threat) { f[away] = true; if (opp.state === 'attack' && opp.move && opp.move.height === 'low') f.down = true; }
        break;
      }
      case 'walker': {    // slow, steady advance (trap practice)
        if (match.frame % 3 !== 0) f[away === 'left' ? 'right' : 'left'] = true;
        break;
      }
      case 'cmdgrab': {   // Onimaru: approaches and uses his command grab (Oni-shime, S)
        const dist = Math.abs(opp.x - me.x);
        if (dist > 70) f[away === 'left' ? 'right' : 'left'] = true; else if (match.frame % 70 < 2) f.special = true;
        break;
      }
      case 'comboer': {   // Update 7 tutorial: walks in and runs a long combo on you, over and over (Break practice)
        const dist = Math.abs(opp.x - me.x), toward = away === 'left' ? 'right' : 'left';
        if (this.bot && (this.bot.done || ['hitstun', 'airhit', 'blockstun', 'repelled', 'knockdown', 'break'].includes(me.state))) { this.bot = null; this.last = match.frame; }
        if (this.bot) return this.bot.next(match, this.id);
        if (dist > 62) f[toward] = true;
        else if (['idle', 'walkF', 'walkB'].includes(me.state) && !opp.air && match.frame - (this.last || -999) > 50) {
          this.bot = new DW.ComboBot('L L H 2H J jL jH JC jL jH j5S', {}); return this.bot.next(match, this.id);
        }
        break;
      }
      case 'breaker': {   // Update 7 tutorial: stands open and Breaks the moment your combo reaches 2 hits
        const oc = match.combos[opp.id];
        if ((me.state === 'hitstun' || me.state === 'airhit') && oc.active && oc.hits >= DW.CONFIG.break.minComboHits) f.brk = match.frame % 2 === 0;
        break;
      }
      case 'mixer': {     // alternates a low (Down + L) and a jump-in (Air H)
        const dist = Math.abs(opp.x - me.x), cyc = Math.floor(match.frame / 120) % 2, t = match.frame % 120;
        if (cyc === 0) { if (dist > 70) f[away === 'left' ? 'right' : 'left'] = true; else if (t % 40 === 0) { f.down = true; f.light = true; } else f.down = t % 40 < 3; }
        else {   // back off to jump range, then jump in with Air H on the way down
          const toward = away === 'left' ? 'right' : 'left';
          if (!me.air && t < 50 && dist < 150) f[away] = true;
          else if (!me.air && t >= 50 && t < 62) { f.up = t < 54; f[toward] = true; }
          else if (me.air) { f[toward] = true; if (me.vy < 0 && me.y < 110) f.heavy = true; }
        }
        break;
      }
    }
    return f;
  }
};
